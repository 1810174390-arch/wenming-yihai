<script>
const BOOK = [{"title":"第一章 它们出来了","body":["8月3日，凌晨两点四十七分，我打空了三角洲里所有的哈夫币。","绝密航天没撤离成功。对面三个乌鲁鲁开局就上了工位，整局只漏了一次枪声，最后一次开火三枪带走了我们三个人。淘汰回放里，那一秒的镜头我反复看了两遍，他的站位、隔墙育苗、ai吸附。没错，他是绿玩。","李瀚在游戏语音里骂了一句，我摘下耳机，揉了揉眼睛。","我打游戏有个毛病，输了要复盘。这些年从csgo到守望先锋又到三角洲，一帧一帧看回放，练出一双眼睛：窗后有没有狙击镜的反光、草丛里有没有人、对面是虚晃还是真冲。李瀚说我这人不适合打娱乐，适合去打职业。","客厅电视开着，记者站在军列旁边，平板车上驮着一排蒙着帆布的重型装备，说跨战区联合演习潇湘-27正在进行，参演部队跨区机动，陆航直升机群已经转场。","\"演习又开始了。\"李瀚说。","我嗯了一声，没往心里去。","复盘完，我习惯性点开那个论坛。","论坛名字很拗口，常驻用户不到两千人，讨论什么的都有：机械改装、末日生存、地下掩体、病毒传染。置顶帖是篇写了两年的科普楼，楼主说某种真菌能接管蚂蚁的大脑，让蚂蚁爬到高处咬住草叶，等真菌从头顶长出来。楼下跟了一千多楼，一半叫好，一半说楼主该吃药。","我追过那个帖子。楼主偶尔冒出来更新，说人类迟早要面对物种层面的对手。上次更新是三个月前，楼里人问他怎么不写了，他说\"观察样本不够\"。","当时没人当回事。","我在这里潜水三年，大部分帖子当小说看。收藏夹里存了十几篇\"末日生存指南\"：水源净化、避难所选址、武器选择。有一篇讲冷兵器的，楼主说枪声会引来更多麻烦，弓弩更安静、箭还能回收复用，适合小队伍。那时候觉得写得挺有道理，顺手存了，没想过真会用上。","那十几篇东西在收藏夹里躺了三年，排序还停在大一那年。以前半夜翻它们，是当睡前小说看，看完还要吐槽两句作者写得假。三年前随手存的东西，如今成了唯一的参考书，像期末考试将近才想起来翻课本。","那天晚上本来也该这样：扒拉两遍首页，看几眼新帖，关电脑睡觉。","一条帖子引起了我的注意。","发帖时间：一小时前。","标题：They got out.","回复：三条。","第一层说\"楼主嗑药了？\"，第二层问\"你说的是什么？\"，第三层是\"内州那个着火的基地？三天前的新闻了。\"","三条回复，两条是看热闹的，第三条带着地点和日期，像是真知道点什么。我点进那个人的主页，坐标挂在内州，简介写着\"卡车司机\"，主页里全是沿途的风景照。","正文很短，像发帖的人赶时间，句子之间连标点符号都省了：","\"内州地下基地隔离失败了　他们烧了地上能烧的一切但样本已经通过老鼠和蟑螂出去了　封锁没用　如果你看到这条记住　别碰啮齿动物　别碰昆虫　还有　别说出去　没人会信。\"","我盯着屏幕，看了很久。","帖子底部挂着一行灰色小字：该内容可能包含未经核实的信息，已降低展示。我顺手看了眼浏览量，两百出头。这个论坛常驻不到两千人，可一条挂了一小时、带着内州和M国关键词的帖子，正常早该有两三千浏览。两百这个数，像是有人拿手按着，不让它涨。","论坛里这个点没什么人，整个版面静悄悄的。我点开那条帖子，把第三层回复又读了一遍。\"内州那个着火的基地\"，三天前的新闻，我居然一点印象都没有。热搜被晓晓和陆晗分手的消息占着，这种消息沉下去就没了。","打游戏这些年，我练出一双好眼睛。隔着半张地图能看清对面枪口闪光，决赛圈里能数清草丛里有几个人影，压枪弹道飘没飘，扫一眼就知道。这双眼睛让我在翻页之前，多看了一眼这条被冷落的帖子。","账号是今天注册的，一串数字加字母，像在键盘上随手敲的。没有历史发言，头像默认，签名空着。注册时间是一小时前，发帖时间也是一小时前。这个人注册完只发了这一条，就再没出现过。我点开他的主页，在线状态是灰色的，最后活跃时间停在发帖那分钟。","我点开第三条回复说的那条新闻。","三天前，内州一处研究设施起火。官方通报说没有人员伤亡，起因是电路老化。新闻很短，配了一张航拍图：一片烧黑的空地，边缘停着几辆消防车，再往外是光秃秃的戈壁。评论区有人问\"什么设施建在这种地方\"，没人回答。","我把新闻的发布时间和那条帖子的发布时间排在一起：起火在三天前，帖子在一个小时前，中间隔了整整三天。三天里，那个人从内州一路逃出来，还有空注册新号发帖，要么他疯了，要么他真的知道什么。","我又打开微博。热搜第一是晓晓和陆晗分手，往下翻了好几页，才看到一条不起眼的小词条：M国多州出现不明发热。点进去，内容模棱两可，说是流感季提前，专家提醒戴口罩。词条下面挂着一排科普短视频，口径齐得像一个模子刻出来的：注意通风、勤洗手、不必恐慌。评论区有人玩丧尸梗，说\"这次是流感先动的手\"，有人贴了张\"M国药丸\"的表情包，底下笑成一片。","我又翻回论坛。最后一个M国IP的帖子是一张照片：州警备队的军车堵在州际公路上，车头朝着城市外面，有人在往直升机上搬箱子。配文只有一个字：\"跑。\"","我退出微博，给发帖者发了一条私信：\"你是谁？消息靠谱吗？\"","发送成功。","没有回复。我刷新了三次，那条私信一直孤零零躺在已发送里。我又看了一眼帖子的时间，一小时前。如果那个人真的在逃命，他大概没空回私信。","我又等了一会儿，去倒了杯水。回来再看，还是没有。我告诉自己别等了，可手指还是忍不住又刷新了一次。","我说不清为什么，但我觉得这条帖子可能是真的。","也许是那双眼睛。这些年我靠它分辨屏幕里真假难辨的人影和建筑，它让我注意到一个细节：那条新闻说设施起火，地点在内州的戈壁深处，方圆几十公里没有人烟。一个电路老化，能烧出那么大一片焦黑的空地？还有，起火第三天，同一片区域就传出不明发热的消息。","我把这条帖子当成一条消息来读，越读越觉得不对劲。","这个念头一冒出来，就再也压不回去了。我关掉微博，把那条帖子从头到尾又读了一遍。最后一行字是\"别说出去，没人会信\"。我自嘲地笑了一声。每部末日灾难电影里的开头都是这样，没人会信的消息，可我破天荒地信了。","它说样本通过老鼠和蟑螂出去了。老鼠爬下水道，蟑螂钻缝隙，它们不挑国界，但它们只是感染的第一步。紧接着，轮到了人。染上的人不发烧，不咳嗽，照常上班，照常出差，照常拖着行李箱挤进地铁和航班。机场的体温枪扫过去，全是绿灯。也许用不了几天就会一起爆发，全世界会在同一批航班、同一列高铁、同一个病房里醒来，发现身边坐着的人，早就不是人了。","我算了算时间，又算了算自己。","M国已经乱了，那张军车的照片就是最好的证明。按帖子说的扩散速度，C国这边最多还有几天。也许是三天，也许是一周。我没有内幕消息，只有这条没人信的帖子。","夜里两点的城市，灯星星点点亮着，楼下的711便利店还开着门，晚归的出租车从街口滑过去。便利店门口的台阶上，常年蹲着一只大胖橘猫，等店员扔剩饭。今晚台阶上空的。","一切正常，正常得让人脊背发凉。","我把帖子截图，连同那条英文标题一起存进加密相册，关掉电脑，躺回床上。李瀚的鼾声从隔壁床传过来，远处有野狗叫了两声，又安静下去。","我盯着窗外，把明天要做的事排了一遍：取钱，买物资，然后回青石镇看爸妈，回来再联系那个卖房车的车主。","我还把论坛里那篇讲弓弩的帖子翻出来，把要点抄了一遍：箭要回收，弓弦要保养，别在开阔地站桩。抄完我自己都笑了，三年前当小说存的，现在当求生指南用。","我给自己定了四天。","四天后，如果一切照旧，我就把囤的东西全退掉，当自己发了一场疯。要是真发生了，我想让易爽和爸妈都在我够得着的地方。","手机屏幕亮了，易爽发来消息：\"睡了吗？医院今晚好安静，我有点害怕。\"","我打了几个字又删掉，最后只回了一句：\"早点睡，过两天我去看你。\"","发完这条，我盯着\"过两天\"三个字看了很久。","易爽在肿瘤科重症病房躺了快一年，化疗做了十几轮，头发掉光，身体瘦得跟骷髅骨架没区别。她比谁都怕黑，比谁都怕安静，所以她住的那层楼，永远灯火通明。她说那盏灯亮着，就说明还有人活着。","她是这世上最信我的人。","三年前我在学校贴吧看到一条招募医药志愿者的帖子，八千块补贴，我想都没想就报了名。她的化疗费缺口太大，那笔钱能顶上两个月。她后来知道了，拧着我腰上的肉恶狠狠地瞪我：我实在不行我就嘎巴重开了，我见不得你这样。骂着骂着眼泪就自己掉下来。走的那天她说万一药有问题怎么办。我说体检合格才让进，是个大公司，肯定没问题。","我出了医药公司大门才看到她的电动轮椅停在门口的遮阳伞下面，夕阳铺在她睡着的侧脸，我怔怔地看了许久。后面才知道她不信公司的话，怕我出事，一个人从早上等到傍晚。","当时那批志愿者里，我，陆远，还有另外几个人。我们签的是同一张知情同意书。","那八千块我到现在还留着转账记录。那张薄薄的知情同意书被我压在抽屉最底下，上面签着我的名字，和一个我快要记不清的日期。","如果我的判断是对的，过几天，这座城市可能已经没几个人能来看她了。","我把手机扣在床头，闭上眼睛。","可脑子停不下来，老鼠、蟑螂、货舱、集装箱、铺满全球的水陆空航线、地铁早高峰。我翻了个身，把被子蒙在头上。","被子外面，李瀚的鼾声停了，换成一句含含糊糊的梦话。","从明天开始，我最多只剩三天。"]},{"title":"第二章 青石镇","body":["2027年8月4日，早上七点，我在长途汽车站买了去青石镇的车票。","售票员打着哈欠，问我要不要保险，我摆了摆手拒绝了。车票二十五块，我用现金付的，没必要把钱留卡里，以后也不一定能取出来。","候车厅里人不多，一个老太太拎着两袋菜，一个男人在打瞌睡，广播念着车次，声音沙哑，拖着尾音。墙上的电子屏滚动着发车时间，我盯着青石镇三个字看了两遍，确认它还在。","候车厅门口，镇里的广播正播着一则通知：根据年度军事训练计划安排，我部定于2027年8月期间，在星城以西地域进行军事演习。","演习两个字，我昨晚刚在电视上听过。潇湘-27，跨战区联合，参演部队跨区机动。我没往心里去，广播里的通知，和新闻里的字句，对得上。","大巴开上高速的时候，太阳刚出来。微风吹过路两边的稻田，像翻涌的金色海浪。收割机在远处的田里转圈，有人在路边支着遮阳伞卖西瓜，喇叭里喊着\"沙瓤的，不甜不要钱\"。","一切都是那么平静，恍惚之间让人怀疑昨晚那条帖子是不是做的一场梦。","我想，要是这场梦一直做下去就好了。可我知道那不是梦，昨晚那张截图还刻在我脑海里，想忘也忘不掉。","我靠着车窗，把手机里的截图又看了一遍。","\"别碰啮齿动物，别碰昆虫。\"","我把这句话抄在备忘录里，又补了一行字：远离人群，别坐公共交通工具，别去医院。","医院。我顿了顿，把那行字删了。","易爽还在里面，我躲不开。","青石镇在星城西边，两个半小时的车程。镇子不大，一条主街走到头，街边是理发店、粮油店、麻将馆。理发店的老陈头坐在门口打瞌睡，看见我，喊了一声\"小乐回来了\"。我应了一声，他又闭上了眼继续小憩。","路过粮油店的时候，我停下来，买了四袋米、两桶油，又去药店买了消炎药、退烧药和两大卷纱布。药店老板多看了我一眼，从柜台底下又摸出两盒退烧药塞进袋子：\"一人限购一盒，多的给你留着。\"我问怎么了，他说进货那边说，退烧药在管控了。我道了谢，让老板把东西搬到路边，打电话叫我妈出来接。","我妈骑着小三轮晃晃悠悠出来，看见地上那堆东西，先是一愣，然后说：\"你买这么多干什么？\"","\"囤着。\"我说，\"万一出什么事，米和药比钱管用。\"","我家在镇子最里面，一栋两层的老房子，外墙的水泥有些发黄，门口种着两棵柚子树。我爸坐在堂屋的竹椅上，膝盖上搭着一条旧毯子。他的风湿和关节炎是老毛病了，一到阴雨天就疼得下不了地。他抬头看我一眼，没说话，把手中的烟掐了。","我妈把东西和我一起搬完，扶着门框，一边拿毛巾擦着汗一边问：\"怎么回来了？不是说这周不回吗？\"","\"回来看看。\"我不知道怎么开口，随便扯了个理由。","我是老来得子。我爸四十六岁才有了我，如今他头发全白，背也驼了，走起路来一条腿拖在后面。我妈总说，你爸年轻时候能扛两百斤的谷子，现在连院子里的水都提不动了。","我坐在他旁边，把话在肚子里翻了两遍，纠结了一下，还是说了。","\"爸，妈，最近别出门了。\"","我妈择菜的手停了：\"怎么了？\"","\"M国那边出了点事。\"我说，\"具体的我也说不清，但网上说，可能要传到咱们这边来。你们把米、水、药都囤一点，能不出门就别出门了。\"","我爸重新点上烟深深吸了口没说话。我妈看了他一眼，嘴巴微张，又扭头看我，半天才挤出一句：\"你是不是在网上看到那些乱七八糟的东西了?\"","\"囤东西的钱我自己出。\"我说，\"就几天。\"我认真地盯着我妈的眼睛。","我妈没接话，低头把之前择好的菜倒进盆里。过了一会儿，她说：\"你爸老寒腿又犯了，昨晚一宿没睡好。真要出事，我俩年纪大了，跑不动，别管我们。\"","我手指扣着木桌的边缘，指腹被桌底的倒刺扎得生疼，可到最后什么也没说出来。","我爸把火机往桌上一磕，站起来，一瘸一拐地走进里屋。我以为他要骂我。过了一会儿，他出来，手里多了一个布包，递给我。","我打开，里面是一本存折，和一张折得方方正正的纸。纸是老宅的地契，边角磨得发毛，上面的字还是我爷爷那辈写的。","\"里面的钱没多少。\"我爸说，\"但地契在里面，老家的地，将来要是能种，你拿它回来。\"","\"爸……\"我鼻子一酸。","\"药你妈收好了。\"他打断我，\"消炎的、退烧的，你买的够我们撑一阵。回头再让她添几贴治关节炎的膏药，别的不用操心。你要是信，就信到底，别半路上又心软。\"他说完，又坐回竹椅上，把毯子盖回膝盖，像什么都没发生过。","我攥着那个布包，喉咙有点发紧。","中午饭桌上谁都没再提那件事。我妈不停地给我碗里夹菜，我爸喝了两口黄酒，问我易爽最近怎么样。我说：她挺好的，医生说她各项指标比上个月稳。我爸点了点头，没再问。","我没敢和他们说实话，她住院这一年，我每周都去看她，可情况越来越差，到最后只能隔着病房玻璃看上几分钟。","吃完饭，我从床底拖出我的装备。一个弓包，里面是我的复合弓，和两打替换箭头；一个尼龙复合武器箱，装着我这几年攒下的仿真枪。步枪太大也太扎眼，我把强光手电、激光指示器、高倍瞄准镜都从导轨上拆下来，一把高仿的格洛克还有两盒塑料玩具子弹我塞进包里，盒子里还有一台二手红外夜视仪。","这些东西是我以前cos展上的好装备。强光手电亮度高，照得比寻常手电筒远得多，爆闪模式也迟早派得上用场；夜视仪更是我之后夜晚行动的唯一帮手；激光指示器暂时不知道有什么用，但这是我从海外二手平台淘的军规级货，还是带着吧。","我妈站在门口看我把东西一样样摊在地上，问：\"真的要打仗了吗？\"","\"不是打仗。\"我说，\"是我怕万一有乱子，到时候什么都买不到。\"","她没再问，转身进了厨房，又往我包里塞了一袋晒干的萝卜干和两包腊肉，说：\"路上吃。别饿着。\"","下午五点，我坐大巴回星城。车开出镇子的时候，我脑袋靠着车窗，从后视镜里看见我妈站在路口，身影越来越小。我爸没出来送，但我知道他站在二楼的窗口，手撑在窗台上，看着车走远。","车上人不多，我坐在最后一排，大巴一个颠簸把我摇醒，我掏出手机给易爽打了个电话。","她接起来的时候，声音很轻，像是怕吵到隔壁床的病人：\"你怎么这个点打电话？\"","\"我回了一趟家。\"我说，\"跟爸妈说了囤东西的事。你爸妈那边呢？\"","电话那头安静了一会儿。然后她说：\"我跟他们说了。我爸不信，说我是被网上那些东西吓的。我妈倒信了一半，今天去超市买了两袋米。\"","\"你呢？\"","\"我对你的信任你还需要质疑吗？\"她说，\"你从来不在这种事上开玩笑。\"","她顿了顿，声音压得更低了一点：\"我给你卡里转了钱，你查一下。我不是一直想去冰岛看极光嘛，我想着化疗要是失败，我就拿着它出去走一圈。现在，应该是用不上了，你拿着，跑得远一点。\"","\"易爽。\"","\"好了。\"她打断我，\"你答应我陪我看极光呢，我是没什么机会了，你得去做到。\"","我攥着手机，眼睛映着窗外飞速后退的稻田，汽车后方，天空像墨水一般吞噬着前面的微光，我半天没说出话。挂掉电话，我打开短信，一笔银行转账 21352.7 在屏幕上躺着。","我盯着那串数字，数了两遍。她存了很久，大概每次化疗疼得睡不着的时候，都在想那些远方。","我把手机收起来，没回。","天黑透了，大巴还没到，车载收音机的声音断断续续的。","\"本市多家医院发热门诊就诊人数上升，专家称属季节性流感，请市民不必过度恐慌。\"","我在备忘录里补了一行：发热门诊里的人坐过地铁，坐过高铁，坐过飞机。他们不知道自己有没有带来什么。","车窗外面，城市的灯火一片一片亮起来，地铁口涌出下班的人潮，商场门口有人在排队买奶茶，一切和昨天一模一样。","我忽然有点想笑，这座城市有一千万人，此刻只有我一个人在为一篇没人信的帖子失眠。","我摸出手机，想给易爽发点什么，最后只发了一句：\"现在骨头还疼嘛？\"她回得很快：\"吃了止痛的，不疼。\"","我打开那个论坛，想再看看那条帖子，却显示该内容已被删除。","我揉了揉眼睛，又刷新了一遍。还是那一行字。","昨天晚上它还挂在那里，还有人问\"内州那个着火的基地\"。现在它没了。账号注销了，帖子删了，那条私信也变成了\"对方不存在\"，就像这个人从来没有存在过。","我盯着那行字看了很久，把截图又翻出来，确认自己没记错。帖子没了，可我记得每一个字。删得这么快，不像人干的。人工撤帖要走流程，要审批，要留记录。这条帖子从出现到消失，前后不到一天，连账号都注销得干干净净，像一段程序跑完了，自己清理了自己。","似乎有人在清理痕迹。","我关掉手机，靠着椅背，看着窗外飞速后退的路灯。我想起那条帖子的最后一行字。","\"别说出去，没人会信。\"","我信了。","可帖子都没了，我又该拿什么去相信。"]},{"title":"第三章 房车","body":["2027年8月5日，天亮之后，我是第一个走出宿舍楼的人。","超市刚开门，老板娘在往货架上摆矿泉水。我推着两辆购物车进去，先搬水，二十桶五升的，再搬压缩饼干和罐头，然后是米、面、油、盐、糖。","老板娘站在收银台后面看我，扫一件，顿一下，再扫一件。末了她问：\"同学，你这是干什么？\"","\"学校社团徒步，我负责后勤。四十多个人，三天，一人一天一瓶水，算错了要自己贴钱。\"","她没再问。找零的时候多看了我两眼，把小票折好递过来，说了一句：\"罐头别堆太阳底下。\"","\"嗯。\"","转角就是药店。店员看我买碘伏、纱布、绷带、退烧药、消炎药、止泻药，眼神越来越不对劲。我掏出早就想好的说辞：\"单位团建进山，怕有人摔伤，我负责采购。\"","\"你是学生吧？哪个单位？\"","\"帮我哥的公司采购。\"","她抿了抿嘴，还是给我拿了，末了从柜台里抽出缝合线和手术刀片，一起放进袋子：\"这俩给你，摔伤缝针用得着。不过你哥要是做正经生意的，劝他别囤这些，看着吓人。\"","我出门的时候，听见她在背后嘀咕了一声。我没回头。","上午八点，李瀚在校门口等我。","他背着一个鼓鼓的双肩包，一脸视死如归：\"你要是被传销了，我就把你的号卖了。\"","他是我的室友，比我大两岁，高中毕业当了两年兵，退伍回来考的大学。打游戏认识，处了三年，嘴贫，讲义气，一点就着。他这人特别矛盾，跟熟的人在一起，话多得刹不住；一到人多的地方，或者在女生面前，就闷得像根木头。部队教过他战术动作和服从命令，可他的性子一点没改，遇事从来先上，再想。","为什么是他？因为搬东西、装车、守夜都需要第二个人，开车需要轮换，而我信得过的人，数来数去只有他一个。宿舍里其他人，大难临头第一个跑的是他们，第一个把我卖了换物资的也可能就是他们。李瀚不会。","我没多解释，带着他直接去了城西二手车市场。","车是一辆二手依维柯欧胜，长轴高顶，2.8T柴油，六座，原车主改成了房车：100升水箱、驻车空调、3000W纯正弦波逆变器、双电瓶（副电瓶是磷酸铁锂，两百安时）、后舱上下铺加卡座床，能睡四个人。里程六万八，无事故记录。原车主是个自驾游爱好者，说是媳妇怀了孩子，要换MPV，急着出手。","标价十五万，我看了四十分钟，挑出三处毛病，电瓶老化了、水箱有漏水痕迹、车顶行李架焊点开裂，最后谈到十二万八。","过户的时候，李瀚站在旁边，全程没说话。直到我把钥匙攥在手里，他才开口：\"你哪来的十二万八？\"","\"易爽给了两万一千三百五十二块七，我爸妈给了四万二，我自己一万三，信用卡透支五万，网贷两万。\"","李瀚沉默了一会儿：\"你疯了。\"","\"我没疯。\"我说，\"你信我一次。\"","他看了我很久，最后说：\"行，我跟你疯。\"","钥匙链上挂着一枚硬币，是易爽去年给我的，说带着能保平安。我把它转过来，正面朝外。","午后，看完车，我去了城郊那家户外店。店主是个晒得黑红的中年人，看我挑净水器、净水片、打火石、保温毯、登山绳、多功能钳、强光手电、备用电池，忽然笑了：\"兄弟，你这是要跑路的买法啊。\"","\"真人CS，野外生存挑战赛。\"","\"哦。\"他慢悠悠地把东西装袋，末了，从柜台底下摸出一个哨子，扔给我，\"送你的。真出了事，哨子比嗓子好使。\"","我捏着那个哨子，愣了一下，说了声谢。哨子用红绳穿着，我把它拴在钥匙扣上，和易爽那枚硬币挨在一起。","提车之后，我们没回宿舍，直接去了城郊的一个物流园。我用一天时间，对车做了这些事：","车顶行李架重新焊接加固，用来放油桶和重物；所有车窗加装不锈钢防盗网，用螺栓固定在窗框上，防丧尸也防人；车门内侧加了两道插销和一条铁链。","车头加装了一台电动绞盘，接在副电瓶上，用来清障和拖车；车尾加了一个油桶架，备胎旁边再放两个二十升的柴油桶；车头车尾各装了一盏爆闪灯，电线接进驾驶室，开关装在方向盘旁边。","驾驶座后面焊了个弓架，箭袋固定在副驾座椅侧面；内部按我的清单分成七个区域，用记号笔写上标签：A水，B食物，C医疗，D工具，E武器，F通讯，G卫生。","李瀚一边搬一边问我：\"A区为什么要放在车门最近的地方？\"","\"水最重，也最常用。\"我说，\"B区食物靠里，防潮。C区医疗放中间，两个人伸手都够得着。E区武器，我够得到就行。\"","\"你这些，都是从哪儿学的？\"","\"末日小说。\"我说，\"还有论坛。我看了三年。\"","他骂了一句，继续搬。","物资是我列的单子，一样样往里塞：水，二十桶五升的，加上四十瓶瓶装水；食物，压缩饼干三十斤，罐头四十个，米面各五十斤，油盐糖各十斤，维生素片三瓶，自热米饭和自热火锅一箱，二十四个。","医疗，碘伏、酒精、纱布、绷带、止血带、消炎药、退烧药、止泻药、缝合线、手术刀片；工具，多功能钳、折叠铲、登山绳、胶带、打火石、火柴、蜡烛、红外夜视仪；能源，电池一堆、两个充电宝、一块折叠太阳能板。","通讯，短波收音机、两对手台、一台车载电台；防护，N95口罩两盒、护目镜、护臂、劳保手套；武器，复合弓、碳纤维箭、军刀、折叠铲、高仿格洛克（配两盒塑料玩具子弹）；卫生，卫生纸、垃圾袋、湿巾；文件，身份证、存折、地契、现金、地图。","装车的时候，手机弹出一条推送：演习期间，部分路段临时管制。我扫了一眼，顺手划掉。","车台是我坚持要装的。天线用卡边固定在后门框上，馈线顺着车顶行李架底下走。调试的时候，李瀚问：\"短波收音机不是有了吗？装这个干什么？\"","\"收音机只能听。\"我说，\"车台能喊。万一哪天有人喊我们，总得接得住。\"","他想了想，没再问。","李瀚拎起那块折叠太阳能板，掂了掂：\"这玩意儿，多少瓦？\"","\"一百瓦，单晶硅，三折，带MPPT控制器。\"我说，\"转换效率百分之二十二，重三公斤二。\"","\"多少钱？\"","\"七百八。\"","他把它放回去，又拿起那两块充电宝：\"这个呢？\"","\"两万六千八百毫安，21700电芯，双向六十五瓦，能同时喂手机和对讲机。一块两百六。\"","\"网上那种标两万毫安的，九块九包邮，你为什么不买？\"","\"那种虚标，实给一万都够呛。\"我说，\"电芯缩水，循环一百次就掉一半。去年双十一我买了一块，回家就拆了，里面塞着配重块。卖家给我退了款，让我别声张。\"","李瀚看了我半天：\"你连这都拆过？\"","\"论坛里学的。\"我说，\"末日生存第一条，别信标签上的字。第二条，信自己量出来的数。\"","他骂了一句，继续搬。那把18650电芯组装的十二伏电池组，他拎起来晃了晃，又放下，没再问。它藏在工具箱底层，接一块充电管理板，能喂爆闪灯、夜视仪和手台，够用三天。","装完车，天已经黑了。我盘腿坐在后舱，把今天的支出对了一遍。","房车十二万八。改装的材料钱：防盗网、角铁、插销、铁链、绞盘、爆闪灯、油桶架，加上物流园那半天焊工，拢共四千六。","物资：水，两百四；米面，三百；压缩饼干，四百五；罐头，四百八；自热那一箱，四百八；油盐糖，两百二；维生素，一百三十五；药品，一千一百五；工具，七百八；电池、充电宝、太阳能板，一千四百二；收音机加两对手台，一千一百八；口罩、护目镜、护臂、手套，五百六；复合弓、两打碳纤维箭、备用螺纹箭头一盒、军刀、折叠铲，三千八；卫生纸、垃圾袋、湿巾，两百六；证件袋、现金、地图，五百。","加在一起，十四万四千六。","我手里原本有十四万六千三百五十二块七：易爽的两万一千三百五十二块七，爸妈的四万二，我自己存的一万三，信用卡五万，网贷两万。那剩下来的一千七百五十二块七，我压在驾驶座下面的铁盒里，谁也没告诉。那一万三的存款里，有六千是我给易爽下轮化疗留的。现在它们都变成了一车东西，和一张不知道开到哪儿去的车票。","李瀚蹲在车边啃压缩饼干，啃到一半，问：\"这车上的东西，够吃多久？\"","\"看怎么吃。\"我说，\"正常一天三顿，米面加罐头加自热，四十天上下。压缩饼干算进去，能到五十。\"","\"紧着吃呢？\"","\"一天一餐，压缩饼干配水，七十天。\"","\"水呢？\"","\"十五到二十天。省着喝，加上净水器、净水片，能撑一个月往上。\"","他嚼着饼干，半天说：\"四十天。四十天以后呢？\"","\"四十天以后，要么补给到了，要么咱们不在车上了。\"","装完车，我在物流园的空地上试弓。月光很亮，十米外立了个纸箱，我拉开弓，箭箭上靶。李瀚在旁边数，越数越安静。","\"你这准头，练多久了？\"","\"三年。\"","\"你还说你只是喜欢看小说。\"","我没回答。我的眼睛在夜里比白天更亮，靶心看得清清楚楚。我拉开弓，瞄准二十米外那棵树的枝杈，弓弦响，箭离弦，钉进枝杈中间。李瀚倒吸一口气：\"你什么时候能射这么远了？\"","\"一直能。\"我说，\"就是以前没试过。\"","其实我知道不对。以前我的准头没这么好，夜里看东西也没这么清楚。这几天，我觉得自己看得越来越远，越来越清，像是有什么东西一直在那里，只是我以前没注意。","我把弓收起来，没跟他说。","回宿舍的路上，李瀚走在我前面，忽然回头：\"徐乐，要是真出事了，你第一个救谁？\"","\"易爽。\"我说。","他点了点头：\"那我排第二。\"","\"行。\"","他笑了。路灯底下，那笑看着有点虚。","晚上十一点，我让李瀚先睡，自己坐在窗边守夜。","城市的灯火和平时一样，楼下有人在遛狗，711便利店亮着灯，晚归的出租车一辆辆开过。我刷了一会儿论坛。M国那边已经乱了，昨天还热闹的帖子，今天大片大片地停更。有一个俄州的账号，凌晨两点还在发：\"它们穿过来了，就在墙外面。\"","凌晨两点十分，他最后一条：\"它们在撞门。\"","然后那个账号再没出现过。","我刷新了一遍，两遍。他的主页变成了一片空白。头像、简介、历史帖子，全没了。再刷新，连名字都搜不到了。","我又往下翻。另一个账号，定位在芝城，昨天还在直播\"州政府发通知了，让囤水\"。今天主页上也空了。再往下，一个西州的小号，三个小时前发了一张照片：高速公路上全是车，车灯连成一条河。配文：\"都在逃。\"","那张照片还在。我盯着看了很久，把它也存了下来。","我把这几天攒下的截图按时间排好，一条一条看：从那条没人信的帖子，到内州的新闻，到多州发热，到俄州的账号消失，再到西州的高速公路。一条线清清楚楚，事情正从西往东走，朝着这边来。","手机屏幕忽然亮了一下。","是易爽：\"睡了吗？我睡不着。\"","我正要回，屏幕上方弹出一条新闻推送：","\"M国西州洛城发生多起暴力袭击事件，当地宣布进入紧急状态。\"","洛城。","我盯着那行字，拇指悬在键盘上，最终一个字也没回。","窗外，城市安静得像一口深井。"]},{"title":"第四章 注销","body":["8月6日，凌晨三点，我睡不着。","这几天我养成了一个毛病，一闭眼，脑子里就开始过那几张截图：内州的新闻、俄州的账号、西州的高速公路。它们排成一列，从西往东走，走一步，靠近一步。我翻了个身，打开手机，又翻了一遍论坛。","三点四十分，论坛里没人。四点钟，还是没人。","四点零三分，刷新页面的时候，一条新帖子跳了出来。","发帖账号是刚注册的，用户名只有一个字母：M。头像默认，签名空着，主页里只有这一条。帖子没有标题，正文是几行英文，我一字一字地念：","\"VX-9. 34.05,-118.24. THEY ARE ABOVE THE CLOUDS. TRUST NO ONE. M\"","我把这几行字抄进备忘录，又对着念了一遍。VX-9，该是某种编号。34.05,-118.24，我打开地图输进去，坐标落在西州南部，洛城。","洛城。昨晚那条新闻推送，就是洛城。","我反复看了那个 M 很久。那条\"它们出来了\"的帖子被删了，账号也没了，可这个 M 留这一行字，是算准了有人会来看。留给谁？我不知道。可那行字里有一句，看得我后脊发凉：","\"TRUST NO ONE.\" 不要相信任何人。","我刷新了几遍，那条帖子的浏览量一直是个位数，连一条回复都没有。一个刚注册的账号，发一条没人看得懂的帖子，像是专程放在那儿，等某个人来捡。我捡到了。我搜了一遍\"VX-9\"，什么也没有。又搜\"THEY ARE ABOVE THE CLOUDS\"，还是一样。这两个词像是从没存在过，和那条帖子一样，干干净净。","我盯着\"ABOVE THE CLOUDS\"看了很久。云层之上，那是什么地方？飞机飞的高度？还是更上面？","天蒙蒙亮的时候，我做了个决定：把论坛账号注销。","账号是我大一注册的，攒了三年。里面有几篇帖子，有收藏，有私信记录。我点开设置，找到注销入口，系统让我输入密码，我输了。页面弹出一行字：注销后不可恢复，是否确认？","我点了确认。","页面跳回登录框，我的头像没了，名字没了，那三年攒下的东西，一键清零。我看着空荡荡的登录框，心里反而踏实了一点。","李瀚醒的时候，我已经把手机里的通讯录备份了一遍。","\"今天干嘛？\"他问。","\"去医院看易爽。\"我说，\"顺便把我爸妈那边再确认一遍。\"","他没多问，去洗漱了。","上午，我给我爸打了个电话。电话响了三声才接。","\"爸，是我。\"","\"嗯。\"他那边有锅铲碰锅沿的声音，叮叮当当，\"说。\"","\"镇上都好好的？\"","\"好好的。\"我爸说，\"上午去镇上买了两袋盐，人比平时少点，都戴口罩。你别总打电话，费电。\"","\"你们别出门了。\"我说，\"米和药够不够？\"","\"够。\"他说，\"你妈又添了几贴膏药。你别操心我们，顾好你自己。\"","\"爸。\"","\"行了，挂了。\"他说，\"你妈喊吃饭。\"","电话挂断，我攥着手机，在阳台站了一会儿。风是热的，楼下有人在遛狗，一切照旧。可我就是觉得，有什么东西正在往这边走，一步一步，没有声音。","下午，我和李瀚把房车从物流园开回了学校。车停在宿舍楼下，我们把剩下的物资搬上去，又把床铺铺好。李瀚蹲在车边，把油箱加满，又检查了一遍绞盘。","\"明天几点走？\"他问。","\"五点。\"我说，\"天亮之前到医院，人少。\"","\"我妈在发热门诊。\"他说，\"医院那么大，我们怎么找她？\"","\"先找到易爽。\"我说，\"肿瘤科在住院部，发热门诊在大门边上。\"","他点了点头，没再说话。","晚上，我把箭一支一支检查，箭头擦干净，弓弦上蜡。李瀚蹲在旁边看：\"够用吗？\"","\"省着用，够。\"我说，\"箭杆捡得回来，箭头换一颗就行。断了就没了。\"","夜里十一点，我们关了灯。李瀚很快睡着了，我躺在后舱，听着车外的风声。","手机屏幕忽然亮了一下。是易爽：\"睡了吗？\"","我正要回，窗外传来一声闷响。","像是有什么东西，撞在卷帘门上。","我坐直了，握着弓，屏住呼吸。楼下，711便利店门口的卷帘门，被人从外面撞了一下。然后是第二下，第三下。","李瀚翻身坐起来，声音发紧：\"你听见了？\"","\"听见了。\"我说。","楼下，有什么东西，正在敲门。","8月7日，凌晨两点十四分，我拉开窗帘一角。","711便利店门口，卷帘门凹进去一块，像被什么东西从外面撞的。台阶上那碗猫粮还在，旁边多了一摊暗红色的东西，干了一半。","我蹲下去看，没有再看第二眼。","血迹从便利店门口拖出来，一路往小区出口去，拖痕很深，在台阶上刮出一道白印。","远处，警报声拉起来，响了一阵，又停了。风里只剩那声闷响的回音。","我回到车上，把弓上了弦。","从明天开始，这座城市，大概不会再有711便利店亮着灯了。"]},{"title":"第五章 第二天早上","body":["8月7日，天亮的时候，楼下已经安静了。","昨晚那声响之后，我和李瀚没有再睡。我们坐在窗边，握着弓和刀，一直等到天边发白。楼道里没有脚步声，楼下也没有动静。安静得像是昨晚那声闷响是我听错了。","六点出头，我们决定下去看看。","楼道里空荡荡的。一楼门卫室的门开着，里面没人，桌上放着一碗吃了一半的泡面，筷子搁在碗沿上，还冒着一点热气。门卫老赵的军大衣搭在椅背上，人不见了。","便利店门口，卷帘门凹进去一块，像被什么东西从外面撞的。台阶上那碗猫粮还在，旁边多了一摊暗红色的东西，干了一半。","血迹从便利店门口拖出来，一路往小区出口去，拖痕很深，在台阶上刮出一道白印。","然后我看见了它。","从小区门口的早餐摊底下钻出来，动作不像人。它弓着背，四肢着地，脖子歪着，半张脸上糊着干涸的血，喉咙里发出嗬嗬的声音。","是早餐摊的老郑。","他家做包子的，每天凌晨三点起来和面，我在这片住了三年，买了三年豆浆。此刻他趴在地上，眼睛是灰的，嘴角挂着半截没咽下去的东西。","它看见了我。喉咙里的嗬嗬声停了，它弓着背，一步一步朝我挪过来。","我拉开弓。箭尖对着它的眉心，我手有点抖。","\"老郑。\"我说。","它没有停。","三米。两米。一米。","弦响，箭离弦，钉进它的眉心。它往前又走了半步，然后直挺挺栽下去，砸在地上，扬起一片灰。","我站在原地，握着弓，手指发麻。李瀚在身后，半天没说话。","那是我杀的第一个人。不，它已经不是人了。","七点，我们开始装车。","水、食物、医疗、工具，一箱一箱往车上搬。李瀚搬箱子，我核对清单。搬到一半，一个人从三号楼门口走过来，头发花白，穿着洗得发白的蓝工装，腰里别着一把扳手。","\"需要帮忙吗？\"他问。","我看了一眼他的脸，认出来了。姓周，住三号楼，以前开货车的，现在在楼下给人修车。去年冬天我车胎扎了，他蹲在雪地里帮我换了半小时胎，没收钱。","\"周叔。\"我说，\"不用，我们自己搬。\"","他嗯了一声，没走，蹲在车边看了一会儿，忽然说：\"你们这是要出城？\"","\"去医院。\"我说，\"我女朋友在肿瘤科住院，我兄弟的妈在发热门诊。\"","他沉默了一会儿：\"医院？现在最不能去的就是医院。发热门诊那么多人，你去了，是送死还是接人？\"","\"接人。\"我说。","\"行。\"他点点头，\"你的车，你做主。\"","他站起来，从怀里摸出一台短波收音机，递给我：\"这个你拿着。昨晚我试着搜台，听到有人喊'防线'，说湘中那边在筑防线。\"","\"湘中防线？\"","\"没听清。\"他说，\"反正不是好话。\"","我接过收音机，沉甸甸的。他看了我一眼，又摸出一张皱巴巴的纸，上面画着几条线，标着星城、邵陵、湘中几个字。","\"我开二十年货车，湖南的路我熟。\"他说，\"真要乱起来，别往城里扎，往西走。西边山多，好躲。\"","\"周叔，你呢？\"","\"我哪也不去。\"他说，\"我儿子在邵陵，电话打不通。我在这等他回来。\"","他顿了顿，又说：\"你拿着这收音机，是帮我自己。我这把年纪，跑不动了，你要是能把这台收音机带到有人管的地方，让他们知道，湘中还有人等着。\"","我攥着收音机，说不出话。","装完车，老周从后备箱里翻出一把工兵铲，掂了掂，递给我：\"拿着。\"","\"周叔，这是你的。\"","\"我用不上了。\"他说，\"你比我用得上。\"","我攥着工兵铲，正要转身，老周忽然开口：\"等等。\"","我回头。","他站在楼门口，看着小区门口那辆横着的出租车，看了很久。远处有人喊了一嗓子，又安静下去。他朝我伸出手：\"收音机拿来。\"我把那台短波收音机递过去。他拧开，杂音里隐约有个声音在报地名：\"……邵陵……湘中……\"","他关了收音机。","\"我改主意了。\"他说，\"我儿子在邵陵。邵陵在西边，你们反正往西走。\"","\"我们要先去医院。\"我说。","\"医院也在西边。\"他说，\"顺路。\"","\"周叔，你不是说，你哪也不去，在这等他回来？\"","\"我说等。\"他打断我，\"可等人，得先活着等。这小区现在是个死胡同，我死在这儿，儿子回来也找不着我。我跟着你们走，到了邵陵，你们把我放下，我找儿子，你们找你们的人。湖南的路我熟，二十年的货车不是白开的。我带路，你们载人，两清。\"","李瀚在车边没说话，看着我。","我想了想：\"行。上车吧。\"","老周没动，又补了一句：\"先说好，我上你的车，不是白上。路上我教你们怎么活，你们欠我人情，到了地方还。\"","\"记下了。\"我说。","他这才拎着那袋东西，绕过车头，拉开副驾的门坐进去。","上午九点，车开出小区。小区门口已经乱了，有人在喊，有人在跑。一辆出租车横在路中间，司机趴在方向盘上，一动不动。旁边站着一个人，正低头啃着什么。","李瀚把车窗摇上去，谁都没说话。","老周坐在副驾，看着窗外。过了一会儿，他开口：\"三条规矩，我说给你们听。\"","我握着方向盘，没回头。","\"第一，车不等人。我说走，就走，谁落在后头，谁自己想办法。第二，人不白救。救一个人，就得算一个人情账，账还清了，各走各路。第三，别信广播。广播说安全的地方，八成不安全；广播说防线的地方，八成要出事。\"","车里安静了一会儿。","\"记下了。\"我说。","\"那走吧。\"他说，\"路上，我教你们怎么活。\"","车驶出小区，往医院的方向开。路边的东西越来越多，有的烧过，有的烂在沟里。李瀚把收音机拧开，里面全是杂音。老周伸手关掉，又拧开，又关掉。","第四次拧开的时候，收音机里忽然传出一段清晰的播报，是个女声，一个字一个字地往外念：\"全市进入交通管制，请市民就近避险，不要前往医院、车站等人员密集场所……\"老周伸手又要关，李瀚按住他：\"让她说完。\"女声把同一段话重复了两遍，然后断了，又只剩杂音。老周把手收回去，半天说了一句：\"听见了吧。广播越讲道理，事情越大。\"","\"能收到部队的频道吗？\"李瀚问。","\"按理收不到。\"老周说，\"军用频段是加密的。我开二十年货车，从来没收到过。可昨晚，它自己撞进来了。\"","\"自己撞进来？\"","\"就是自己撞进来的。\"他把收音机塞回包里，\"不然你以为我为什么把它给你？\"","我握着方向盘，没接话。","前方路口，红灯还亮着。可路口已经没人了。"]},{"title":"第六章 特殊种","body":["公交车侧翻在高架应急道上，把右边的路肩堵死了。","高架只有两条道，前面的车都停了，有人从车窗探出头往这边看，没人下车。前面的车按了两声喇叭，又安静下来。","我松开离合，慢慢往前蹭，近到能看清车窗玻璃上的裂纹，和车门把手上干掉的暗红色东西。","车窗上贴着线路牌，5路，从火车站到城南客运站。我坐过这趟车，高中那几年，每周五放学都坐它回家。现在它翻在应急道上，车窗碎了一半，像被人从里面砸开的。","我把车停下。","\"熄火干什么？\"老周问。","\"刚才那声响不对。\"我说，\"我想看一眼。\"","老周皱眉：\"多一事不如少一事。\"","\"要是里面有什么东西，我们现在不知道，晚上它也会来找我们。\"我说，\"大白天，看得清。\"","我拎着弓下车，李瀚跟着我。老周坐在副驾上，把撬棍横在膝盖上：\"你们三分钟不出来，我就开车走。\"","公交车前门开着，台阶上有一摊干涸的血，拖痕往车厢深处去。我弯腰往里看：座椅东倒西歪，过道上散着包、鞋、手机。一只手机的屏幕还亮着，锁屏上是一条未读消息：\"到哪了？\"","车厢尽头，最后一排座椅下面，有什么东西蜷着。","它背对着我们，穿着深蓝色的公交司机制服。肩胛骨的位置，把衣服顶起两个包。我盯着那两团凸起，忽然觉得不对，人的肩膀，不该是那个形状。","\"那是人吗？\"李瀚捂着肩膀小声问。","\"不知道。\"我说。","老周已经下了车，站在公交门口，手里攥着撬棍。他往里看了一眼，忽然低声说：\"退出来。\"","我往后退了一步。","就在这时，那东西动了。","它从座椅底下爬出来，动作很慢，先伸手，再探头。它抬起头的时候，我看见它的眼睛，灰的，没有光，可它直直地看着我。","然后它动了。速度一下子提起来，快得不正常。","我几乎是本能地拉开弓。箭离弦，它偏了一下头，箭擦着它的耳朵钉进座椅靠背。","它停住了。歪着头看我，没见过会躲的东西。","\"徐乐！\"李瀚喊，\"它要过来！\"","我后退，搭箭，又射出一箭。这一箭钉在它肩膀上，它晃了一下，低头看了看那支箭，伸手拔出来，扔在地上。","然后它朝我扑过来。","我往旁边一滚，它从我头顶掠过，撞在公交车门框上，铁皮凹进去一块。李瀚冲上来，一铲子拍在它背上，它踉跄了一下，回头，一掌拍在李瀚肩上。李瀚整个人飞出去，撞在护栏上，捂着肩膀爬不起来。","\"李瀚！\"","我拉开弓，对准它的眼睛。它停下来，看着我，像是在衡量什么。","就在这时，我的眼前忽然浮起一层影子。","淡得像一层水汽，比它快半步，先一步出现在它要去的方向。影子里，它的右爪会先抬起来，抓向我的左肩，我下意识往右闪，它的爪子擦着我的左臂过去，指甲刮破衣袖，留下一道血痕。","它愣住了。我也愣住了。","它看着我，像是头一回遇上会躲的东西。然后它低吼一声，转身，撞破公交车另一侧的玻璃，跳下高架。","我追到护栏边，看见它落进绿化带，几个起落，消失在楼群后面。","那截绿色的带子，留在公交门口的台阶上。李瀚捡起来，上面印着一行小字：","B-3。","\"这什么东西？\"老周问。","\"一个编号。\"我说。","\"认识？\"","\"不认识。\"我说。","我撒谎了。我不知道为什么撒谎，可那三个字母加一个数字，让我后脊发凉。三年前，我签过一张知情同意书。上面也有一行编号，B-5。","腕带的材质和医院住院腕带一样，可印刷的字体，和我抽屉里那张知情同意书上印的编号，一模一样。同一套系统打出来的。","李瀚靠坐在护栏边，脸色发白。我蹲下去，掀开他的衣领，右肩上一道抓痕，皮开肉绽，渗着血。","\"血止住没？\"老周问。","\"止住了。\"李瀚咬着牙。","\"上车，先走。\"老周说，\"那东西要是回头叫来同伴，我们这点人不够它吃的。\"","我扶着李瀚上车。老周绕到驾驶座，打火，车驶离高架。我坐在后座，看着窗外飞速后退的楼群，耳边全是那声低吼。","它认得我。","我不知道它是怎么认得我的，也说不清，为什么刚才我能提前看见它的动作。","箭袋里二十四支箭，还剩二十二支。","\"周叔。\"我说，\"湘中那边，你那个广播，还能收到吗？\"","\"信号不好。\"他说，\"晚上再试试。\"","我点了点头。车窗外，城市安静得像一口深井。远处，城市上空忽然响起警报，短促三声，停两秒，又三声，循环往复。全城警报。李瀚抬头：\"这是……\"老周把收音机拧开，里面只有那个女声在重复：\"全市进入紧急状态，请市民就近避险。\"重复了三遍，声音断了。","井底，有什么东西，正沿着井壁往上爬。"]},{"title":"第七章 医院","body":["市人民医院外面，已经拉起了警戒线。","我们把房车停在马路对面。发热门诊门口排着长队，一眼望不到头，人人戴着口罩，有人蹲在地上，有人靠着栏杆，队伍半天才往前挪一步。几个穿防护服的人站在入口，拿着体温枪，一个一个地测。","我在车里数了一遍：穿防护服的六个，保安四个，排队的人数不过来。救护车开进来两辆，又开出去一辆，警笛没响，车顶的灯转着，无声无息。","城东方向传来几声闷响，像很远的地方在放炮。排队的人没人抬头。过了一会儿，又响了几声，这一次近一点，连地面都跟着抖了一下。有人往东边看了一眼，又低下头。","队伍里有人站不住了，蹲下去，又被旁边的人拽起来。一个穿防护服的人走过来，在队尾说了句什么，队伍往后退了两步。没人大声说话，连咳嗽都是捂着的。","我数到第四遍的时候，队伍里有人倒下去了。穿防护服的人跑过去，把人抬到一边，摘了手套，又换了一副。排队的人往后让了让，没人上前。","\"直接进去？\"李瀚问。","\"先找易爽。\"我说，\"住院部在后面。\"","老周把车绕到侧门。侧门也拉了警戒线，但没人守。我们停好车，从侧门进去，穿过门诊大厅。大厅里比外面安静，挂号窗口全关了，导诊台空着，地上散着几张化验单，被风吹得贴着地皮滑。电梯门开着一半，里面的灯一闪一闪。","易爽跟我说过，住院部晚上十点熄灯，走廊里只留地灯，她怕黑，就整夜开着床头那盏小灯。","我推开九床病房的门。床上空着，被褥叠得整整齐齐，床头柜上的水杯还在，杯壁上贴着一张胶布，写着她的名字。","\"易爽呢？\"我问路过的一个护士。","\"昨晚转移了。\"她说，\"医院组织转移重症病患，往西送，临水那边有接收点。\"","\"她病得那么重，能转移？\"","\"组织上安排的。\"她说，\"说是临水那边条件好。\"","我站在病房门口，看着那张空床，半天没动。李瀚拍了拍我：\"徐乐。\"","\"我知道。\"我说。","护士站里坐着一个人，穿着护士服，胸前的工牌上写着：阿宁，肿瘤科。","\"你们找谁？\"她抬起头。","\"九床的易爽。\"我说，\"她去哪了？\"","\"昨晚转移了。\"她说，\"医院组织转移重症病患，往西送，临水首站。\"","\"她身体能撑住吗？\"","阿宁看了我一眼，没直接回答：\"你是她什么人？\"","\"男朋友。\"","她点了点头，从抽屉里翻出一张登记表，递给我：\"转移名单。昨晚十点走的，车是白色的，挂军牌。\"","我接过登记表，上面写着易爽的名字，后面跟着一个编号。那个编号跟床号、病历号都对不上，是一串字母加数字，跟我抽屉里那张知情同意书上的格式一模一样。我盯着它看了很久。再往下，是李桂芳。","我顿住了。李桂芳，李瀚的妈妈。","\"李桂芳也在这？\"我问。","\"在。\"阿宁说，\"发热门诊的护士长，昨晚一起转移的。\"","我回头看李瀚。他站在原地，脸色发白。","\"我妈在发热门诊。\"他说，\"我找了她一早上。\"","阿宁看了他一眼，又翻出一张表：\"李桂芳，昨晚随第二批车队走的。\"","李瀚攥着那张纸，指节发白。他没说话，把纸折好，塞进兜里。","阿宁看着我们，忽然问：\"你们这车，能坐几个人？\"","\"四个。\"我说，\"加上你，正好。\"","她想了想：\"行。我回值班室拿点东西。\"","她回来的时候，手里多了一个包。她当着我们的面，从值班室抽屉里翻出几卷纱布、两盒注射器和一板退烧药。\"值班室的东西，我拿了一半。\"她说，\"剩下一半，留给后面来的人。\"","李瀚靠在车门上，半天问了一句：\"临水，远吗？\"","\"一百多公里。\"老周说，\"路况好，两个钟头。\"","\"那就走。\"李瀚说。","车驶出医院侧门的时候，门口那两个保安已经不见了。警戒线被扯断了一截，垂在地上，被风吹得啪啪响。","阿宁坐在后座，看着窗外，忽然说：\"发热门诊的人呢？\"","\"都在。\"我说。","\"护士长也调过去了。\"她顿了顿，\"他们不知道自己有没有带来什么。\"","车厢里安静了一会儿。老周从后视镜里看了她一眼，没接话。","出城的路口设了检查站。武警和民警并排站在路中间，防暴车横着，留出一条车道。车排成长队，一辆一辆过。轮到我们的时候，一个武警敲了敲车窗：\"去哪儿？\"","\"临水。\"阿宁把护士证递出去，\"医疗转移批次，送家属。\"","武警看了她一眼，又看了看车里，挥手放行。","城东的方向又响了一串枪声，这次近了很多，像有人在河对岸放鞭炮。队伍里有人蹲下去，被武警扶起来：\"继续走，别停。\"","车往西开。没走多远，一列装甲车从对面开过来，碾着路中间的双黄线，往城东去。车顶的机枪手戴着风镜，脸被风吹得发红。后面跟着几辆卡车，车斗里坐满了全副武装的士兵，有人抱着枪，有人闭着眼。车队过去以后，城东又响了几声闷响，一下一下，像砸墙。头顶一架直升机低空掠过，机腹下挂着东西，追着车队的方向去了。","又开了一段，路过一个路口的时候，我看见一辆白色的依维柯停在路边，车身上印着红十字，车门开着，地上散着几卷绷带。旁边没有人。","\"白车。\"阿宁说，\"转移车队用的就是这种。\"","我放慢车速，看了一眼。那辆车空着，像被人扔在这里。","\"走了。\"老周说。","我踩下油门。后视镜里，那辆白车越来越小，最后变成一个白点，消失在灰蒙蒙的街道尽头。","\"易爽。\"我说，\"你等我。\"","车窗外的城市，人声正在一点一点安静下来。可枪声没有。城东的方向，枪声一阵接一阵，中间夹着爆炸的闷响，像很远的地方在砸墙。","昨晚是没有人声。今天，是枪声替人声在响。"]},{"title":"第八章 救援","body":["8月8日，出城的路，比想象中好走。爆发后的第二十四个小时。","上午的国道还堵得水泄不通，下午就空了。路边的车被推到沟里，留出一条道，道面上还有履带碾过的痕迹，深深浅浅，一路往西。","城东的方向，烟柱一根一根竖起来。有的粗，有的细，烧到一半散了，又重新竖起来。枪声从夜里就没断过，密的时候像下雹子，稀的时候像有人一根一根拔钉子，中间夹着爆炸的闷响。","\"部队在清。\"李瀚说。","\"清得完吗？\"我问。","他没回答。","李瀚蹲在路边，手指摸着那道履带印：\"装甲车。\"","\"你怎么知道？\"","\"我在部队见过。\"他说，\"这是步战车的履带印，不是坦克。\"","我抬头往前看。远处的天边，有直升机低空掠过，机腹下挂着东西，往西飞。","\"部队进城了。\"阿宁说。","我们跟着履带印走。翻过一道坡，前面的景象让所有人都安静下来。","国道边停着一列军车，装甲运兵车、轮式步战车、卡车，排成一条线。车旁边站着士兵，全副武装，有人拿着喇叭，正在朝路边的人群喊话。","\"河西方向，临时收容点，有需要的群众跟我走。\"","人群是乱的。有人拎着箱子，有人抱着孩子，有人赤着脚。士兵们站成一道人墙，把人群和国道分开，一个一个放行。","有人问城里还有人吗。士兵没回头，只说：\"有。部队在里面接。\"城东又响了一串枪声，这次近了很多，人群低着头，脚步快了两分。","我放慢车速，看着那列军车。","\"军队。\"李瀚说，\"真的是军队。\"","\"嗯。\"我说。","一个年轻的士兵跑过来，敲了敲我们的车窗：\"老乡，河西有收容点，有吃的，有水，跟部队走安全。\"","\"我们不去收容点。\"我说，\"我们往西，找个人。\"","士兵愣了一下：\"现在往西？西边在打仗。\"","\"打什么仗？\"","他张了张嘴，没回答，只说：\"你们最好跟部队走。\"","我摇了摇头：\"谢谢。我们赶路。\"","他看了看我们的车，又看了看车里的人，最后说：\"那你们小心。前面过桥的时候，听部队指挥。\"","车继续往西。走了不到十公里，前面的车又停了。","前方传来枪声，一阵一阵的，不密，但每一枪都敲在人心上。路边的人往两边跑，有人抱着头蹲在沟里，有人喊：\"往后退！往后退！\"","我下车，往前挤了几步，看清了状况。","国道在这里拐了个弯，一辆装甲运兵车横在路中间，车尾对着我们。它前面二十米，路边的排水沟里趴着一个东西，比公交上那个大了一号，皮肤泛着一层灰白的光，像一层硬壳，两个包从后背鼓起来，有什么东西要从里面撑出来。","它没看我们。它盯着那辆装甲车，四肢压低，喉咙里滚着低吼，被枪声逼住，随时要扑。","几个士兵端着步枪，枪口对着它，一步一步往后退。有人朝天上开了一枪，它连眼皮都没抬。","\"怎么不打？\"有人喊。","\"打了！\"一个士兵吼回来，\"打不进去！\"","\"那堵着干什么？\"","\"它在等我们停火。\"士兵说，\"枪一停，它就扑。\"","我盯着它，忽然明白过来。它不是在等人，它是在等声音。直升机把它从楼群深处引出来，装甲车的动静又把它引到这里。它追着声音走，走到哪，哪里就是猎场。","然后，我的眼睛又开始发烫。","影子浮起来，比现实快半步：它下一个动作，是扑向装甲车侧面那两个士兵。它的爪子会先抓到那个擦枪的士兵。不，那个士兵正蹲在车边，手搭在扳机上，他已经不是擦枪了。他正在和民警协调，试图维持秩序。另一个士兵在跟驾驶员说话。","它感觉得出来，人群里谁对它威胁最大。","它动了。","人群炸开，喊声、哭声、脚步声混在一起。它几步蹿出排水沟，抬手，把一个挡路的中年人撕成两半，然后头也不回，朝那两个士兵去了。","\"趴下！\"我喊。","声音淹没在枪声里。我拉开弓，箭离弦，钉在它后颈。它顿了一下，回头，看见了我。","那双眼睛浑浊，可浑浊底下有一层东西，像隔着水看灯。它认得我。","它改变方向，朝我冲过来。","我往车后跑，一边跑一边搭箭。它比我快，几步就到了我身后。我转身，箭对着它的眼睛射出去。它偏头，箭擦着它的颧骨过去，划出一道口子，渗出一线黑红色的血。","它停下来，摸了摸那道口子，低头看了看手上的血。","就在这一瞬，装甲车上的机枪响了。","重机枪的动静跟步枪完全不一样。那声音把空气撕开，连地面都在抖。子弹打在它身上，终于撕开那层硬壳，把它打得踉跄着往后退。它低头看了看自己身上多出来的弹孔，第一次露出迟疑。","它看了我一眼，然后转身，几个起落，消失在路边的树林里。","机枪手还在追着扫，扫断了半排树。","我蹲在车边，喘着气，低头看自己的手臂。一道划痕，从肘弯一直拉到小臂，不深，但渗着血。是刚才它扑过来的时候，爪子带的。","阿宁蹲下来，皱眉：\"爪子抓的？\"","\"嗯。\"","\"抓得挺干净。\"她说，\"没有碎布。奇怪。\"","她往伤口上倒碘伏的时候，我盯着那道划痕。伤口边缘，有一种说不出的颜色，暗红，发黑，血里像掺了东西。","李瀚走过来，看了一眼，没说话。","装甲车上的士兵跳下来，跑到我们面前。是个年轻的班长，脸上还带着刚才的尘土。","\"你们没事吧？\"他问。","\"没事。\"我说。","他看了看我手里的弓，又看了看我手臂上的伤：\"刚才那个，你射的？\"","\"我射的。\"","\"眼睛确实好使。\"他说，\"不过那东西，不是你们老百姓能对付的。前面河西有部队守桥，你们跟车队走，安全。\"","\"我们不去河西。\"我说，\"我们往西找人。\"","他看了我一会儿，没再劝，只说：\"那你们记着，过桥的时候听指挥。桥上，有部队。\"","他转身跑回装甲车。车重新发动，履带碾过地面，往东去了。","装甲车往东开了没多远，又停下来，车顶的机枪对着路边的楼群扫了一梭子，然后继续往前，消失在烟尘里。城东的方向，枪声一直没有停过。","车开出去没多远，我们车里的车台忽然响了。没有呼号，直接是一个女声，不带一点感情：\"识别到民用车辆……依维柯欧胜……驾驶员徐乐。编号 B-5，纳入战时观察名单。\"声音很短，说完就断。","李瀚的手按在车台上，半天没动：\"他们怎么知道你的名字？\"","我没回答。我知道那串编号从哪来。","我站在路边，看着那列军车走远。","他们不知道，我看见了。在那东西扑出去之前，我就看见了它要杀谁。","可我不能说。","我也不能说，我手臂上这道划痕，到现在还在隐隐发烫。"]},{"title":"第九章 河西·门户","body":["8月9日，过桥的时候，天已经大亮。爆发后的第四十八个小时。","桥东桥头封了。拒马、沙袋、铁丝网一层叠一层，哨兵站在沙袋后面，枪口朝东。桥面上往西走的车一辆接一辆，没人按喇叭，也没人插队。武警的防暴车停在桥头，车顶的喇叭喊着：\"过桥后听从安排，物资统一登记，车辆按指定位置停放。\"","桥东的天际线烧着。烟柱一根一根竖起来，粗的细的，把半边天熏成灰黄色。枪声从夜里就没断过，远一阵，近一阵，中间夹着爆炸的闷响。桥东的路口，还有人在往桥这边跑，跑几步，回头看一眼。一辆装甲车压在他们后面，车顶的机枪朝楼群扫，扫一阵，停一阵，给人开路。","过桥的车排成长队，一辆一辆从登记桌前过。有人在桌上数物资，有人往车窗上贴编号。轮到我们的时候，登记的战士看了房车一眼：\"改装车？\"","\"是。\"","\"留一辆，往西站运人用。剩下的油，倒给运油车。\"","老周当场就想骂，被李瀚按住：\"周叔，人在屋檐下。\"老周把油管递过去，嘴里骂骂咧咧的，手上的动作却是一点没慢。","我们的房车被编进后勤车队。老周跟着一辆运油车走了，走之前从车窗里探出头：\"车要是让人刮了，我找你们算账。\"阿宁被医疗点的人喊走，她拎着那个白帆布包，头也不回地摆手：\"我在河西医院那边，伤员往那儿送就行。\"","李瀚和我站在桥西的空地上，看着这座刚醒过来的河西。","河西像一座兵营。","江面上，橘子洲和月亮岛亮着灯，岛上是前哨，有人影在跑。更远处，无人机的灯光排成三排，正在往河东推，机腹下的枪管一闪一闪。机器狼蹲在桥头的阴影里，一排一排，背上的枪管朝天，等着天亮以后第一声枪响。","沿江一线，沙袋码到齐胸高。桥头架着双管高炮，炮管压得很低，平平地指着桥面。江岸公路上，步战车散成一排，炮口朝东。再往远处，一排排卡车停在空地上，车斗里全是弹药箱，蒙着帆布，还没开封。民兵穿着迷彩服，袖章是红布条，正从卡车上往下卸铁丝网。民警站在路口，手里的喇叭换了三块电池，嗓子还是哑的。","\"演习的东西。\"李瀚说，\"真多。\"","\"演习正好碰上了。\"我说。","李瀚盯着无人机排出的队形看了很久，忽然说：\"演习的时候，无人机航线不是人排的，是一套系统在排，人只负责最后确认。\"","\"什么系统？\"","\"他们叫它天枢。\"","橘子洲桥头停着一列古怪的车队：前头是一辆六轮军卡，后面拖着一台半挂拖车。拖车中央立着一座低矮的遥控炮塔，塔身向前伸出十一根炮管，三十毫米口径，围成一圈，像一束收拢的金属麦秆，又像把海军的1130近防炮整个搬上了岸。炮塔顶上鼓着两个舱，一个是小型搜索雷达，一个是光电观瞄球，像一双睁着的眼睛。拖车后部是发电机舱，舱门开着，电缆拖出去老远，接进旁边一辆方方正正的指挥车里。","拖车中段，三个半人高的弹药柜一字排开，柜门锁着，两个士兵守在边上。没人喊它的名字，可路过的人都会多看它一眼。一个老兵蹲在炮塔边，擦那十一根炮管，擦得很慢，一根一根，一下一下。","\"那是什么？\"李瀚问。","\"压箱底的。\"老兵头也不抬，\"能别响就别响。\"","一个排长从沙袋后面钻出来，脸上还带着过桥时蹭的灰。他看了我们一眼：\"会开枪？\"","\"会。\"李瀚说。","\"会射箭。\"我说。","\"射箭？\"他愣了一下，\"桥头不缺箭。会射箭的，桥头倒是头一个。\"","他盯着我看了两秒，忽然问：\"昨晚救援队里，先喊出那个大家伙的，是你？\"","\"是我。\"","\"眼睛确实好使。\"他说，\"不过桥头不缺眼睛，雷达、夜视、无人机都有，晚上打仗我们照样打。\"","\"那要我干什么？\"","他指了指桥东：\"机器管远，人管近。那东西要是贴着沙袋爬上来，雷达看不见，无人机转不过来。你得管最后一米。\"","\"管多远？\"","\"桥头这一段。\"他说，\"机器报大的，你报小的。\"","\"行。\"","\"桥头观察位。\"他说，\"跟我来。\"","观察位在橘子洲大桥西桥头的路灯杆边上，一摞沙袋垒成半人高的窝。窝里有一部望远镜、一部对讲机，和一排压好弹的弹匣。李瀚被分到隔壁机枪位，他走的时候回头看了我一眼：\"别逞能。\"","\"你也是。\"","河西沿江的防线，一眼望不到头。三座桥，三个门：橘子洲大桥居中，银盆岭在北，福元路更北。桥头都是高炮和机枪，桥面用拒马封了一半，留出单车道。桥东的路口，民警还在把最后一批人往桥西赶，有人拖着行李箱跑不动，被人架着走。防线往后，岳麓大道和西二环的路口堆着沙袋，再往后，长沙西站方向停着长长的大巴车队，车窗上贴着编号，一辆接一辆，等着装满人往西开。","\"三道。\"排长说，\"沿江一道，二环一道，西站一道。守不住沿江，就守二环；二环守不住，西站就是最后的车。\"","\"能守几道？\"李瀚问。","\"谁知道。\"排长说，\"反正车先备着。\"","我们领到两个身份牌，一张纸，上面写着编号和火力点。排长说，牌子别丢，撤的时候按牌子登车。李瀚把牌子塞进兜里，问：\"撤的时候，车够吗？\"排长说：\"先想着怎么守，再想怎么撤。\"","隧道口的动静是上午九点多传来的。","先是几声闷响，像有人在地底下敲鼓。然后，三个隧道口同时冒起烟柱：湘雅路、营盘路、南湖路，灌浆、封门、爆破，一气呵成。有人站在防线上看着烟柱，没说话。隧道一封，河东的东西想过来，就只剩桥了。","\"炸了也好。\"李瀚说。","\"炸了，就只剩三座桥。\"我说，\"三座桥，三个口子。\"","上午十点，一列坦克从西边开过来。","打头的是三辆96A主战坦克，炮塔上糊着迷彩布，车体两侧还挂着演习用的红蓝标牌，没来得及摘。履带碾过国道，把柏油路轧出一道道白印。后面跟着两辆步战车，再后面是弹药车，车斗里码着一摞摞细长的炮弹箱。","车队停在江岸公路的预留位上，车头朝东。车长从炮塔里钻出来，摘掉耳机，对着桥东看了一会儿，又钻回去。装填手掀开炮塔后的盖板，把炮弹一枚一枚压进自动装弹机的弹仓，动作很快，像练过一千遍。","\"坦克。\"李瀚说，\"连坦克都调来了。\"","\"装甲营是省外那支部队的。\"排长站在旁边，看着车队说，\"演习本来是红蓝对着打。爆发以后，红蓝合了。他们的坦克，我们的高炮，武警的防暴车，全捏在一起，归指挥营一个口子下令。\"","\"它们不上桥？\"我问。","\"上不去。\"他说，\"桥面是按民用重车加固的，坦克压上去，压不塌也堵死一条道，后面的人就别想走了。它们守引桥，哪个口子先顶不住，开过去堵上，当堡垒用。\"","\"炮弹带了多少？\"","\"一辆四十一发。\"旁边一个扛弹箱的战士接话，\"穿甲、破甲、榴弹，混着装。打完了，就剩那挺7.62并列机枪和一挺12.7高射机枪。\"","\"够打多久？\"","\"看怎么打。\"他说，\"省着打，能打一仗；敞开打，一顿饭的工夫。\"","中午，太阳白晃晃的，我趴在观察位上，觉得不对劲。","先是太阳穴跳。然后是整条小臂疼，疼得从骨头里往外冒。我卷起袖子，纱布底下那道划痕在发烫，烫得发狠，像烧红的铁丝贴在皮肤上。","李瀚在隔壁喊我，我听见了，可答不上话。眼前的东西开始晃，桥、河滩、沙袋，全都蒙上一层影子。影子叠着影子，有的往前走，有的往后退，我分不清哪一重是真的。","以前不是这样。以前我只能看见眼前的东西：看着陆远，他身上就会浮起一层影子，那影子是他下一步要做的动作。现在影子不再跟着眼前的人走，它们散开了，铺到我看不见的角落。","阿宁被叫来的时候，我已经烧糊涂了。她拿手背贴了贴我的额头，说了句什么，我没听清。她把纱布剪开，看见那道划痕的时候，手停了一下。","\"这不是普通抓伤。\"她说。","划痕裂开了，边缘发黑，渗出来的血是暗红色的，粘稠。我盯着那道口子，看见一层薄薄的影子从伤口里浮起来，像蛇蜕下的皮。","\"你会不会变？\"李瀚问。","阿宁没回答。","我烧了三个小时。三个小时里，我一直在看影子。桥东的河滩、桥下的水面、远处的楼顶，一层一层叠着，都在我眼前。它们混在一起，分不出先后，只是同时存在着。","等烧退下去，我睁开眼，发现自己能同时看见三处地方：桥东的河滩，沙袋后面的阴影，银盆岭桥头那门高炮的弹链。它们隔得很远，可我全看得见。","\"好了？\"李瀚问。","\"好了。\"我说。","我没敢告诉他，我看见的东西，比他多。我也没敢告诉他，那道划痕现在摸着，不像自己的皮肤。","午后，指挥营那边开来一辆方舱车，车顶支着七八根天线。车没熄火，尾门开着，里面一摞屏幕，一个女声在报数据：\"蜂群一号营，余电百分之六十二，弹药剩余三成。机器狼连，在线六十四台，弹药剩余四成。\"","李瀚说：\"这就是排航线的那套系统。\"","\"天枢？\"","\"嗯。\"他说，\"人在里面只按最后一下确认。找目标、分任务、排先后，都是它干。演习的时候，这套东西一天排几千条航线。\"","\"现在呢？\"","\"现在排的是生死。\"","方舱车旁边，机器狼蹲成一片。一个连，六十四台，分八个班。四足，半人高，背上驮着短管自动步枪，头顶顶着一个小光电头。士兵管它们叫机器狼，也有人管它们叫电子狗。它们不叫，也不动，光电头冲着河东，像一群等哨的狼。","下午，桥东沿江那一片房区先动了。","机器狼一个连压过桥，八台一班，一班一片楼区。它们踩着碎玻璃上楼，逐层搜，逐间看，光电头扫过每一扇门。楼里有动静，枪先响。枪一响，头顶的蜂群就钻进去，顺着窗户补一轮，再把下一栋交给下一班。","\"查打一体。\"李瀚看着屏幕上的光点，\"狗在前面逐楼探，机在后面跟着打。演习的时候，这套东西一天能清一片街区。\"","\"里面有活人怎么办？\"我问。","李瀚没接话。他看了一会儿，说：\"狗会先看到。\"","第一个口子，是下午从河滩那边撕开的。","桥面还稳着，河东岸的河滩先动了。残影来得很短。它没给我看整张战场，它只给我看了一瞬间：河滩的淤泥里，有什么东西一层一层地拱出来，密密麻麻的洞同时往外吐东西，往桥墩的方向涌。","\"河滩！\"我抓起对讲机，\"河滩有东西！往桥墩去了！\"","对讲机里安静了两秒。然后排长的声音：\"知道了。\"","高炮响了。可先响的不是高炮。","三架无人机的灯光从桥西压过去，贴着河滩低空扫了一轮，机腹的火光一闪，把淤泥里刚拱出来的东西犁回去一片。高炮的弹幕跟着接上，像三把扫帚，把剩下的东西往水里扫。整个过程一气呵成，没有断档。","我趴在观察位上，手心全是汗。","高炮打完一个长点射，炮手把耳朵从护耳里摘下来，冲我喊：\"眼睛，桥东路口那个拐角，看见什么没有？\"","我没看见。残影也没来。","\"没有。\"我说。","\"那就好。\"他重新戴上护耳，\"怕的就是你看见。你一说看见，准没好事。\"","对讲机里，排长的声音又响起来：\"你喊的时候，无人机已经过去了。\"","\"我知道。\"我说。","\"那你还喊？\"","\"它们还没出来。\"我说，\"我就已经看见了。我能感觉到，它们要出来。\"","对讲机里安静了很久。排长没回话。","河滩战打到一半，坦克开了火。","三辆96A一辆接一辆开上引桥侧的预留位，车头压向桥东。炮塔慢慢转过来，125毫米的炮管压平，指着桥东一栋塌了半边的楼。楼顶站满了东西，正顺着脚手架往下爬。炮长报了一句什么，我没听清，炮口火光一闪，整辆车往后一坐。楼顶那一层，整个没了。","第二炮打的是河滩。炮弹落进黑浪中间，先炸开一片，然后泥沙、碎肢、江水一起掀起来，落下去的时候，河滩上多了一个坑。车里的人没停，炮塔又转了半圈，12.7毫米的高射机枪抬起来，扫桥东桥头的楼顶，把刚爬上去的东西又扫下去。","\"省着打。\"对讲机里，一个没听过的声音压着嗓子说，\"坦克连，一个基数四十一发，打完就没了。二连，预备。\"","李瀚趴在机枪位上，听着对讲机，说：\"上面在轮着用。\"","\"什么？\"","\"火力。\"他说，\"远的先打，近的后打。远火打完了，炮营接上；炮营没弹了，坦克顶上；坦克再打完，就轮到桥头这些铁管子了。一层一层往回收，收到最后，就是我们。\"","\"收到底呢？\"","他没接话。","机器狼是在坦克开火之后动的。","一个班八台压上河滩，四条腿贴着焦土，光电头一明一暗。它们背上那支短管自动步枪开火的时候，声音比高炮细，比机枪密，像一排在敲铁皮。冲在最前面那台，把刚从坑里爬出来的东西又压回坑里，跟上去，枪口抵着坑口打完一梭子，才撤回来。","\"压住了！\"有人在喊。","\"没压完。\"我说。","残影在炮声里又来了两次。","第一次，它给我看的是银盆岭桥头那门高炮。炮管正打着，弹链眼看要见底，桥面上的东西正趁着弹幕断档往沙袋上爬。","\"排长，\"我抓起对讲机，\"银盆岭，弹链要见底了，桥面有东西在往上爬。\"","\"知道了。\"","两秒后，对讲机里换成了另一个频道的声音：\"银盆岭，换弹！\"","换弹的三十秒里，沙袋后面的人往后缩了缩，等弹链接上，桥面上的东西已经被压回桥东。命令是排长转过去的，中间隔了一个人，可该到的时候，到了。","第二次，它给我看的是桥墩。水线以下，有个东西扒着桥墩往上爬，水淋淋的，比普通丧尸快得多。","\"桥墩！\"我朝头顶喊，\"你脚底下！\"","蹲在桥墩上方的战士探头往下看了一眼，一梭子打在水面上。那影子沉下去，没再上来。近的，我还能直接喊；远的，得靠人转。","残影又来了。这次它给我看的是一瞬间：桥东桥头，拒马后面，一个机枪手正低头换弹链。他背后，沙袋堆的阴影里，有个东西在往上爬。它比普通丧尸大一号，爪子抠进沙袋，一声不响。","\"排长，\"我抓起对讲机，\"三号桥头，机枪位后面，沙袋上有东西！\"","排长没回话。三秒后，他的声音从各火力点的频道里传出来：\"三号桥头，机枪位后方，注意！\"","机枪手这才扔下弹链，回身，枪口抵住沙袋后面那个东西，一梭子打进去。那东西从沙袋上摔下来，滚进桥面的尸堆里，不动了。","机枪手隔着桥面，朝我竖起一根拇指。","\"眼睛毒。\"排长在对讲机里说，\"记住了，三号火力点，桥头观察位。\"","第一波压下去的时候，天快黑了。","河滩上清出一大片，弹壳在沙袋脚边铺了一层。高炮的炮管红了，有人提着水桶往炮管上浇，水浇上去就冒白烟。守军从沙袋后面钻出来，有人蹲在地上抽烟，有人靠着坦克轮子喝水，有人把空弹箱踢到一边，又拖来一箱新的。","清点的人扯着嗓子报数：\"蜂群全天四个波次，出去两百多架次，回来一百零七架。电池见底的过半，整备到明早，最多再凑两个波次。\"","机器狼也回来了。一个连出去，回来的不到一半，完好的更少。有一台是拖回来的，右后腿断了，被东西拽掉的。剩下的两条腿撑着地，光电头还冲着河东，枪管还热着。","\"机器狼也见底了。\"操作员从方舱车里探出头，\"弹药不多了。\"","排长蹲在桥头，看着它们，说：\"电池就够打一个多小时。弹药也见底了。明天要是还有第三波，只能靠人。\"","他看了我一眼，没说下去。","黄昏过了一半，排长从指挥所那边回来，把一部新对讲机递给我。它比观察位上那部沉，频道旋钮上贴着一圈白胶布，写着\"营\"。","\"指挥营要你的频段。\"他说。","我接过来，没说话。","\"今天下午那三次，\"他蹲下来，声音压得很低，\"你喊的时候，东西还没露头。桥头不缺眼睛，雷达、夜视、无人机，哪个都比我看见得多。可它们看见的是'已经有的'。你是'还没发生的'。\"","\"我把你报上去了。\"他说，\"指挥营给你留了个呼号：猎眼。以后你报的，先到营里，营里核实，再往各火力点下。\"","\"那我还喊吗？\"","\"喊。\"他说，\"但喊给我听，喊给营里听。别喊给整条防线听。该谁动，营里会下令。你的话再准，也只是情报。命令，得从该下的地方下。\"","我攥着那部对讲机，点了点头。","\"还有，\"他站起来，\"你那道划痕，医疗点的人报上去了。上头说，明天有辆车来接你去做检查。\"","\"我不去。\"我说。","\"由不得你。\"他说，\"桥头观察位，猎眼，是营里定的。人也是营里要的。\"","他没再说下去，转身走了。","直升机是傍晚来的。","两架，贴着江面飞过来，机腹的火炮扫了一遍河滩，又拉起来，往北边去了。机翼下挂着的东西我没看清，可它们飞过去以后，河滩尽头的黑影明显缩了一截。有人在防线上欢呼，老兵没抬头，还在擦那根炮管。","\"压不干净的。\"他说，\"水里的东西，你永远不知道还有多少。\"","\"那压箱底的呢？\"李瀚问，\"什么时候用？\"","\"等桥头撑不住的时候。\"老兵说，\"它一响，就是告诉大家，后路该断了。\"","天擦黑的时候，老周开着一辆运油车从后边上来，停在桥头。他跳下车，扔给我一箱水：\"桥头喝这个。油我送到西站去了。\"他看了我一眼，\"你那眼睛，别光看河东，也看看自己脚下。\"","阿宁那边托人带话过来：医疗点收了三十多个伤员，血够用，纱布不够。排长听完，让人从弹药车里匀了两箱急救包送过去。","我站在观察位上，往河东看。桥东的路灯还亮着，一栋一栋楼的窗口黑着。再往远，河滩尽头的阴影里，有什么东西在动。那一片东西铺得很远，远到整条地平线都在动。","\"李瀚。\"我喊。","\"嗯？\"","\"第二波来了。\"","李瀚把机枪架好，回头看了我一眼：\"你那眼睛，还能用几次？\"","\"不知道。\"我说，\"够用多久算多久。\"","河东的黑浪翻过一个浪头，又翻过一个。老兵站起来，把手里的布叠好，塞进口袋，看了一眼那辆方方正正的军车。","它该响了。"]},{"title":"第十章 火焰之河","body":["8月10日，第二波来的时候，天还没全亮。爆发后的第七十二个小时。","探照灯的光柱先扫到河滩，然后是桥东的路口，然后是河滩尽头的公路。光柱所到之处，全是黑浪。上一波是河滩，这一波是整座河东。有人数过，上一波是从河滩来的，这一波是从整座城来的。城有多大，这一波就有多大。桥东的路口站满了东西，一层叠着一层，后面的踩着前面的肩。光柱往上抬，照到楼顶，楼顶也站着东西，密密麻麻，铺满了天台。","天没全亮的时候，李瀚被调去了银盆岭。北边桥头吃紧，排长点了他。他走的时候没回头，只朝我摆了摆手。","高炮先响。","三座桥头的高炮一起开火，弹幕在河滩上拉出三道火线。可这一次，火线明显比昨天短。有人提着水桶往炮管上浇，水浇上去，冒出来的烟是灰的。炮管的寿命快到头了。","\"压不住！\"有人喊，\"太多了！\"","\"远火！\"对讲机里，排长的声音压过了炮声，\"命令下来了，远火营，预备！\"","我抬头看河西方向。山脊后面，有什么东西在亮。","然后天亮了。","几十道尾焰从山脊后面升起来，把天照成橘红色。火箭弹一排一排升空，横跨天空，像一条烧着的河。它们掠过我们头顶的时候，声音压得人抬不起头，沙袋上的土簌簌往下掉。有人捂住耳朵，有人仰着头看，没人说话。","落点在东岸。","几十个点同时亮起来，先是一排一排地亮，然后连成一片，把桥东的河滩、路口、整条公路都裹进白光里。白光里有什么东西被掀起来，又落下去，又掀起来。气浪过了好几秒才到，从江面那边推过来，吹得拒马哗哗响，吹得人站不稳。","\"一个营。\"老兵扶着炮管，\"三十秒，够它喝一壶。\"","后来我才知道，那叫远火。单门齐射能盖住六十七公顷，一个营三十秒能把五平方公里犁一遍。演习的时候他们舍不得打，现在没人提演习了。装填手蹲在发射车边上，等第二轮命令，手一直在抖。","远火要重新装填。这二十分钟里，桥头不能干等着。","\"炮营，上！\"对讲机里有人喊。","山脊后面又亮了一次。这次换成了闷雷一样的连续炮声。155毫米自行榴弹炮，一轮急促射，三发十五秒，从我们头顶飞过去，落在桥东的路口和河滩纵深。老兵数着炮声，说：\"远火管大片，炮营管近口。一层接一层，省着用。\"","\"接得住吗？\"李瀚问。","老兵没回答。他看了一眼山脊后面，炮声没停，可明显比第一轮稀了。","第一轮打完，河东安静了整整四十秒。四十秒里，没人说话，连炮声都没有。然后黑浪又从焦黑里翻上来，这一回，它们不往桥上冲了，它们顺着桥墩往桥下涌。","第二轮来得比想象中快。山脊后面又亮了一次，这一次是朝北边望城方向去的，尾焰划出半个圈，落进北边的公路。望城方向的枪声停了几秒，又响起来，弱了一截。","火光散掉以后，河滩上清出一片焦黑。黑浪从中间断了一截，像一条河被人拦腰切了一刀。防线上有人欢呼，有人把帽子扔上天。","\"没完。\"我说。","高炮又响了，可这次弹幕短了。第二波没有停下来等，它们踩着焦黑的河滩，踩着同伴的灰，一层一层往桥头涌。机枪手换了第三次弹链，手在抖。","直升机来了。","两架武直贴着江面飞过来，机腹的火炮扫了两遍河滩，拉起来的时候，机翼下的挂架一松，几枚燃烧弹落进桥东桥头。落地先冒白烟，然后火从白烟里长出来，一堵两百米长的火墙，把桥东整个围住。火墙里有人在动，动几下，就不动了。","\"烧五分钟。\"老兵说，\"烧完就没了。\"","火墙没烧完五分钟。第四分钟，桥东的路口塌了一块，黑浪从塌口涌进来，绕过火墙，往桥面爬。高炮压不住，机枪压不住，防线的火力开始往后缩。这一波的火力持续了三个小时。三个小时里，高炮换了三次炮管，机枪换了五挺，坦克一辆接一辆开上预留位，打几炮，退回去，把位置让给下一辆。弹壳在桥头堆成一座小山。有人搬弹药，有人抬伤员，有人把打空的弹箱扔进江里。没有人问还要打多久，答案写在河东那层没散的黑浪上。","三个小时里，有人倒下，也有人被从沙袋后面拖走。","拖走的是一个机枪手。他不是被打中的。桥面上一只断手抓了他一把，手腕上划开一道口子，他没当回事，撕了块布缠上，继续打。不到十分钟，他开始发抖，枪法飘了。旁边的人问他怎么了，他说冷。","后来他站起来了。他站起来的时候，整个人是僵的，脖子歪着，喉咙里滚出那种声音。排长喊他的名字，喊了两遍，他没回头。他朝最近的战友扑过去，战友往后退了两步，被他按在沙袋上。","开枪的是另一个老兵。一梭子，短促，打在他胸口，把他从战友身上打下去。他倒在沙袋后面，手脚还在抽，抽了几下，不动了。","开枪的老兵蹲下去，枪口还冒着烟，半天没站起来。排长走过去，拍了拍他的肩，没说话。","\"他不是空气传的。\"老兵说，\"我们验过血，空气碰不着我们。可血，血会传染。\"","\"伤口沾了血，就是倒数。\"阿宁蹲在一边，白大褂上又多了几道血，\"报不报都一样，几分钟的事。报，是让别人有个数。\"","我低头看了一眼自己手臂上的纱布。那道划痕，是陆远的爪子留下的。","天彻底亮的时候，方舱车把最后两个波次的蜂群放了出去。","四十几架无人机贴着河面飞过去，分三层：最前面一层找目标，中间一层打，后面一层兜底。操作员说，这是天枢排的航线，人在里面只按确认。屏幕上的光点像一把撒出去的芝麻，铺满桥东。机器狼跟在后面，四条腿压着地，贴着河滩的焦土往前推。","然后光点开始灭。一个，两个，一片。操作员喊：\"三号链路断！两架回不来！\"没人应。断了的链子，捡不回来。","电子狗先掉线的。桥头剩的那几只里，有一只忽然原地转了两圈，趴下了，光电头一暗。操作员上去踢了一脚，没动：\"它跟天枢断联了。\"机器狼连打到这会儿，还剩三台能动的，全放了出去。第一台冲进桥东，把爬上桥面的东西赶回去。第二台冲进河滩，没回来。第三台，拖着半条断腿，从黑浪里爬回来，背上的枪管还在响，然后彻底不动了。有人把它拖到沙袋后面，没人说话。","上午，医疗点那边传话过来：昨天说好的那辆检查车堵在桥东，过不来了。我听见这句话，说不清是松了口气，还是别的东西。","老周又上来了，这次开的是我们的房车，车厢里塞满了人。他停下车，朝我喊：\"西站的巴士装不下了，这车再跑一趟，把人往宁乡送！\"阿宁从车窗里探出头，白大褂上全是血：\"徐乐，李瀚伤了没有？\"\"擦伤。\"\"擦伤也过来，我给你缝两针。\"李瀚说：\"不缝，还要打仗。\"阿宁没理他，扔过来一卷纱布：\"先缠上，别到时候血糊糊地吓人。\"","战斗机是跟着武直来的。","两架，从云层下面钻出来，投下的东西在河东炸开的时候，先是一团白光，然后白光猛地往回缩，像把周围的空气都吸了进去，再猛地炸开。地面震了一下，桥身在抖，桥面上的沙袋跳起来又落回去。","\"温压。\"老兵说，\"别抬头。\"","我没抬头。白光散了很久，我的眼睛才恢复。桥东那一块，连烟都没了。温压炸过的地方，桥东的楼塌了两栋。有人看见楼塌的时候，窗口还有灯。","\"陆盾！\"有人喊，\"陆盾该响了！\"","橘子洲桥头那台拖车上的炮塔终于响了。","指挥车里的雷达先转起来，炮塔顶上的光电球跟着压低。发电机吼起来，整台拖车跟着一起震。然后，那十一根炮管开始转，越转越快，快成一圈模糊的银环。老兵听见喊声，站起来，把布塞进口袋，说：\"来了。\"声音跟高炮完全不同，像有人把一整条街的雨都倒进一个铁桶里，密得没有缝隙。它开火的时间不长，十几秒。十几秒之后，桥东桥头到河滩那一片，清空了。","桥面上安静了两秒。有人跪在沙袋后面，把头埋进臂弯，肩膀抖。有人数弹壳，数到一半不数了。整个桥头安静得没有声音。","火光最亮的时候，我忽然想起易爽。她坐的那批车队，走的是西边的路。河西这一夜的火，要是烧到她那边，我攥着对讲机，没往下想。","\"一万发。\"老兵说，\"它一分钟一万发。\"","\"打完了呢？\"李瀚问。","老兵没说话。他看了我一眼，又看了一眼前方。装弹的人推着三个铁柜子过去，撬开柜门，里面空了一多半。","对讲机里，那个没有感情的女声忽然插进来：\"火力单元状态：远火营，剩余一个基数。炮营，剩余零点三个基数。坦克连，余弹四发。陆盾，弹药余量百分之二十五。蜂群，剩余可出动两架。建议：压缩正面，优先保障橘子洲方向。\"","\"听见没有。\"老兵说，\"连机器都在算账。\"","\"算得过来吗？\"","\"算不过来。\"他说，\"算不过来，也得算。\"","残影又来了一次。","这次它给我看的是一瞬间：桥西，陆盾军车的发电机后面，有个东西从阴影里钻出来，正往电缆上爬。它要断陆盾的电。","\"车后面！\"我抓起对讲机，\"陆盾车后面，电缆！\"","守在车尾的两个士兵回头，一梭子打过去。那东西从电缆上摔下来，滚进桥下的阴影里。","老兵看了一眼电缆，又看了我一眼：\"现在机器还在，往后未必。光电、装甲都吃补给，补给一断，全是废铁。到那时候，能看远的，就剩你这种眼睛了。往后这种东西，只会越来越少，越来越金贵。\"","第二波第三次站起来的时候，天彻底亮了。","这一次，它们从三个方向来。正面是桥东，北边是望城方向，南边是含浦方向。三个方向的枪声同时响起来，防线被拉成一条越绷越长的线。","北边望城方向的枪声从密集变成稀疏，又从稀疏变成零散。零散的意思，是那边没人了。南边含浦方向的哨子声一直没停。天快亮透的时候，哨子声忽然断了。断了几秒，又重新吹响，这一次，是在往这边移。南边也在退。","\"北边顶不住了！\"对讲机里有人喊，\"银盆岭，弹尽！\"","李瀚在银盆岭。","\"你那眼睛，\"他缠着纱布，问我，\"到底能看多远？\"","\"不远。\"我说，\"就看一会儿以后的事。\"","\"一会儿？\"","\"几秒。\"我说，\"够喊一嗓子。\"","他沉默了一会儿：\"几秒也够了。\"","对讲机里，营里的声音插进来：\"猎眼，北翼吃紧，去银盆岭。\"我抓起弓，往北跑。","残影来的时候，我已经跑过半个桥头。它没给我看整张战场，它只给我看了一瞬间：银盆岭桥头，第二道沙袋墙后面，一挺机枪的枪管正从沙袋缝里伸出去，枪管边的弹药箱空了，墙外的黑浪已经堆到墙头。","\"银盆岭！\"我抓起对讲机，\"第二道墙后面，机枪位，往后撤！\"","对讲机里没回话。炮声太大。","我跑到银盆岭桥头的时候，李瀚正趴在沙袋后面，枪管烫得冒烟，弹匣打空，他在摸腰上的刀。墙头的黑浪已经翻上来了，一只手从沙袋缝里伸进来，指甲抠着沙袋边缘。","\"李瀚！\"我喊。","他回头看了我一眼，把刀往那只手上一扎，拔出来，又扎。那只手缩回去，又伸进来，又扎。墙外的东西越堆越高，沙袋被挤得往下塌。","\"坦克连！\"对讲机里有人喊，\"银盆岭引桥，坦克连顶上！\"","那辆96A横在银盆岭引桥口的时候，我已经把李瀚从沙袋后面拖出来了。炮管压平，一发一发打。四发打完，炮口停住。车长从炮塔里探出半个头，喊：\"没弹了！\"","然后他回头看了一眼桥面，又钻回去。炮塔慢慢转了半圈，炮管压平，对准桥面。第五发没有出来。弹仓已经空了。车长带着人从车里钻出来，每人只带一支步枪，贴着桥栏往后跑。坦克留在原地，炮塔还朝东，像一座封死的铁堡垒。","\"撤！\"有人喊，\"银盆岭撤！\"","李瀚被两个人拽下沙袋。他回头看了一眼那挺打空了的机枪，骂了一句，跟着往后跑。我冲过去，把他架起来，往橘子洲方向跑。","\"机枪。\"他说。","\"没了就没了。\"我说，\"人还在。\"","身后，银盆岭的桥头被黑浪吞没。爆破的闷响传来的时候，烟柱从桥面中间升起来，半座桥塌进江里。北边的口子，封了。","\"福元路也炸了。\"有人在跑，\"就剩橘子洲了！\"","我架着李瀚跑过桥头。对讲机里，排长的声音断断续续：\"收缩！全体收缩！桥面清空！橘子洲桥头准备起爆！\"","我回头看了一眼。","河东的方向，黑浪还在翻。桥东桥头，那辆方方正正的军车还在响，炮管转着，弹链像雨一样往外泼。老兵站在车边，看着它，一动不动。","\"它还没停。\"李瀚说。","\"快了。\"我说。","对讲机里，排长的声音又响了一次，这次很清楚：\"橘子洲桥头，最后一批人过桥。桥面清空，十分钟后起爆。\"","李瀚站起来，看了一眼江面：\"桥那头还有人吗？\"","没人回答。"]},{"title":"第十一章 断桥","body":["8月10日，最后一批人是天亮以后开始过桥的。爆发后的第七十二个小时。","桥头的广播已经断了大半天。先是电流声，然后是杂音，再然后，那个没有感情的女声插进来，把同一句话重复了三遍：\"按顺序过桥。按顺序过桥。按顺序过桥。\"有人骂了一句，有人跟着念了一遍。","排长在对讲机里喊了几声，没有回音。他摘下耳机，看了看，又戴上。后来传令靠跑腿的，桥头到桥尾，两个通信兵轮着跑，鞋都跑掉了一只。","大巴、卡车、面包车，还有拉着板车走的人，挤在橘子洲桥面上，一辆挨着一辆往西岸挪。桥东桥头的黑浪还在翻，可桥面上没有人回头。有人抱着孩子，有人扛着行李，有人空着手，把手插在口袋里，走得很快。一只狗被人牵着，夹在人群里，尾巴垂着，一声不吭。","车队两侧，装甲车和运兵车压着阵。车顶的机枪扫着桥东的黑浪，扫出一条缝，车队就从缝里过。直升机在头顶压着高度，机腹的火炮追着车队两侧打。无人机只剩两架，贴着桥栏飞，机腹下的枪管一闪一闪。操作员说，这两架飞出去就不回来了。炮火的声音太大，桥面在抖，可没有人停。有人摔倒了，装甲车上的战士探出半个身子，一把把人拽起来，塞进车厢。","\"快！\"民警在桥头喊，\"别停！过桥就上车！\"","桥头摆着一张登记桌，桌子后面坐着两个战士，谁过桥就记一个名字。记到一半，笔没水了，战士换了一支，又接着记。有人问记名字干什么，战士头也不抬：\"找人方便。\"","\"人都没了，找谁？\"那人又问。","战士没回答，笔尖在纸上停了一瞬，又落下去。","队伍里忽然乱了。","一个男人走着走着，腿一软，跪下去。旁边的人去扶他，他再站起来的时候，脖子歪着，喉咙里滚出那种声音。扶他的女人还在喊他的名字，他一低头，咬在她手臂上。","枪响了。桥头哨兵开的枪，一枪打在他后脑，把他打回桥面上。女人抱着手臂蹲在地上，被人拽起来，塞进运兵车。","\"他刚才过桥的时候被挠的，没当回事。\"有人小声说。","没人接话。","一辆面包车从面前开过去，车窗里趴着一个孩子，问开车的妈妈：\"我们还能回家吗？\"妈妈没回答，把他按回座位上。车开上桥，没停。","我们的房车被塞得满满的。老周坐在驾驶座上，阿宁挤在后排，中间还夹着两个老人和一个孩子。李瀚和我没上车，站在桥头，看着桥东。","\"你们呢？\"老周问。","\"殿后。\"我说。","\"殿什么后。\"老周说，\"桥炸了，你们跑得过水吗？\"","\"跑得过。\"我说，\"桥墩子结实，能撑到我们过桥。\"","老周看了我一眼，没再说话。他把车开上桥，开出二十米，又停下来，从车窗里探出头：\"你们要是过不来，我就把车开回来。\"","\"周叔。\"李瀚喊。","\"开你的车！\"老周吼了一声，油门一踩，车往前走了。","桥头还横着一辆坦克。","是银盆岭那辆的僚车。炮塔上糊着焦黑，履带上挂着不知道什么东西。它没炮了。炮弹箱在它旁边堆了一地，全空。乘员没弃车，车长站在炮塔上，拿着望远镜往桥东看。排长跑过去喊：\"撤！车不要了！\"车长说：\"车堵这儿，他们上不来。你们先走，我们殿后。\"排长还要喊，车长已经钻回炮塔，把舱盖从里面锁上了。","桥东的黑浪第三次翻上来的时候，陆盾的弹药打完了。","装弹的人撬开最后一个铁柜子，里面空空的，最后一发也打出去了。老兵站在车边，看着那根慢慢停下来的炮管，一句话没说。炮管慢慢停住，垂下。发电机还在吼，吼着吼着，也停了。","\"哑了。\"老兵说。","他蹲下去，把炮管又擦了一遍，擦完，把那块布叠好，塞进口袋。车斗里的电缆还拖着，拖到桥面上，被人踩来踩去。","\"车不要了？\"李瀚问。","\"要不了了。\"老兵说，\"走吧。留不住的东西，别回头看。\"","桥东的黑浪涌上桥面。拒马被撞开，沙袋被推倒，铁丝网被踩进桥面的裂缝里。机枪手还在打，打到枪管冒烟，打到弹匣见底，打到身边的人把他往后拖。桥面上有人倒下，有人把他架起来，继续往前跑。","方舱车里的屏幕亮着最后两个光点。操作员说，蜂群只剩这两架，电不够返航，问怎么用。排长说：\"放出去，往桥东打，别回来。\"","两架无人机贴着桥面飞过去，没有回来。桥东炸了两声，不大，像两粒石子落进水里。","机器狼还剩一台。别的都回不来了。它被人抬上运兵车，趴在车厢里，光电头还冲着车尾的方向，一暗一明。","炸桥的顺序是上面定的：福元路先炸，银盆岭第二，橘子洲最后。头两道命令下来的时候，桥上还有人喊，说再等等。第三道命令下来，没人喊了。","残影又来过一次。","它给我看的是一瞬间：桥面中段，一个工兵正蹲在地上收拾炸药，他背后，黑浪已经从桥面的裂缝里翻上来，无声无息地往他脚边爬。","\"中段！\"我喊，\"那个工兵，后面！\"","工兵听见了。他扔下炸药包，就地一滚。黑浪从他刚才蹲的地方翻过去，抓了个空。他爬起来，脸白了一瞬，又弯腰去捡炸药包。","残影来了一次。","它没给我看整张战场。它只给我看了一瞬间：桥面东段，一块桥板被黑浪压得往下塌，塌口正好在撤离的人群脚下。","\"东段！\"我抓起对讲机，\"桥面东段要塌，人群往中间撤！\"","对讲机里传来民警的喊声，人群从东段往中间涌。几秒后，那块桥板塌下去，黑浪从塌口翻上来，抓了个空。有人回头看了一眼，脚步没停。","\"撤！\"排长的声音从对讲机里传出来，\"桥面最后清空！工兵班，准备起爆！\"","我往桥头跑。李瀚跟在我后面。","工兵班的人正在往桥墩上放炸药。炸药包一包一包码好，电雷管插进去，起爆线一路收到桥头，接进一台铁皮起爆器。李瀚跑过去，从工兵手里接过起爆器：\"我来。\"","工兵打量了他一眼：\"会用？\"","\"炸过一次桥。\"李瀚说，\"接过线，转过柄。\"","工兵没再问。他指了指桥墩方向，说：\"线都接好了。听命令，拔保险，压手柄，别提前压。\"","残影又来了。","这次它给我看的是一瞬间：桥墩下的阴影里，一个东西从黑浪里爬出来，正往工兵班的方向去。它比普通丧尸大一号，爪子抠着桥墩，水淋淋的，爬得很快。","\"桥墩！\"我抓起对讲机，里面全是杂音。我扔掉对讲机，扯着嗓子喊，\"桥墩下面有东西！往工兵班去了！\"","声音淹在炮声里。","李瀚听见了。他把起爆器往旁边工兵怀里一塞，摸出那把刀，往桥墩边上跑。可桥墩边上太黑，黑浪已经漫过脚面。那个东西从阴影里钻出来的时候，工兵班的人刚回头，枪口还没抬平。它一把抓住最靠桥墩那个工兵的脚踝，把人拖进黑浪里。","工兵的喊声只出来半截，就断了。李瀚赶到的时候，水面上只剩一圈波纹。他骂了一声，一刀扎进水里，扎了个空。","机枪响了。一梭子打在那个东西背上，它晃了晃，松开手，沉下去。可那个工兵没有浮上来。桥面上多了一卷散开的起爆线，和一个没人捡的头盔。","\"炸！\"工兵班长喊，声音哑了半截，\"李瀚，起爆！\"","李瀚跑回桥头，从工兵手里接过起爆器，拔掉保险。他没急着压，等最后两个工兵跑过身边，才两只手压在那根红柄上。","残影在他身后又闪了一下。它给我看的是几秒以后：李瀚站起来，跑过桥面，跑进桥西的人群。他会活着。","我攥着拳头，没喊他。他本来就没打算等谁。","\"跑！\"李瀚喊，\"都跑！\"","我们往桥西跑。跑出去五十米，身后传来一声闷响，然后是第二声、第三声。桥墩一根一根塌下去，桥面像被从中间抽掉一截，先是往下陷，然后整座桥往江里倒。烟柱冲天，碎石砸进江里，溅起的水花泼到我们背上。","没人喊那个工兵的名字。他的头盔躺在桥面上，跟着塌下去的桥一起翻进江里。","断后的机枪手是最后下桥的。他打完最后一匣子弹，把空枪往肩上一挂，顺着桥栏滑下来。桥面在他身后塌下去，他落地的时候，膝盖磕在碎石上，人没停，爬起来继续跑。","那辆坦克没有跟上来。","烟尘落定以后，桥东的桥头塌进江里，它也没了。有人往江里看了一眼，水面上浮着一截炮管，漂了几下，沉下去。没人说话。","\"长沙这地方，烧过一回。\"老兵不知道什么时候站在我们旁边，看着塌下去的桥，\"民国二十七年，烧了五天五夜。那时候，全城人都往湘江跑。\"","\"今天呢？\"李瀚问。","\"今天也一样。\"老兵说，\"跑吧。\"","烟尘落下来的时候，桥东的黑浪还在往江边涌。它们涌到塌口，停下来，站了一会儿，又一层一层地翻进江里。江水是灰白色的，吞下去的东西，再也没有浮上来。","江面上漂着的东西越来越多，有木板，有箱子，有一截一截的桥栏。水把它们往下游带，带出很远，带到探照灯照不到的地方。","往西撤的时候，有人清点过：高炮全哑，机枪能响的不到十挺，步枪子弹一人不到二十发，坦克打完，陆盾打完，蜂群打完，机器狼只剩一台断腿的。河西这一仗，把所有能响的东西都打空了。","\"西站集合，往宁乡撤。\"对讲机里先响起排长的声音，断了一截，换成杂音，又换成那个没有感情的女声，把同一句话重复了三遍。","我们跟着人流往西跑。路过医疗点的时候，阿宁正帮着抬人。她看见我们，喊了一声：\"李瀚，你的手！\"","李瀚低头一看，他的右手臂上，不知道什么时候被划开一道口子，血顺着袖子往下淌。他自己都没注意。","\"没事。\"他说，\"皮肉伤。\"","阿宁没理他，一把拽过去，撕开他的袖子，往里倒碘伏。李瀚疼得吸了口气，没躲。阿宁剪开纱布，一圈一圈往上缠，缠到第三圈，才开口：\"你这种皮肉伤，我一天见二十个。\"","\"那你手艺练出来了。\"李瀚说。","\"练出来了。\"阿宁说，\"都是你们这种人给练的。\"","\"桥那头的人，\"阿宁问，\"都过来了吗？\"","李瀚没说话。","远处，断后部队的卡车一辆一辆开过来。有一辆车的车厢里，躺着一个人，被白布盖着，看不清脸。押车的战士说，是三连的连长，炸桥的时候被气浪掀下桥，捞上来的时候还有气。","\"三连？\"我问。","\"嗯。\"战士说，\"往宁乡送，看能不能救。\"","我站在路边，看着那辆卡车开过去。白布下面，一只手垂在车厢边上，指节发白。押车的战士说，捞上来的时候，人还攥着对讲机，对讲机里全是杂音。","我摸了摸自己口袋里的身份牌，还在。","\"走吧。\"李瀚说。","我们往西走。西站出口，老周把房车停在路边，车没熄火，看见我们，按了一下喇叭。车门打开，阿宁把李瀚塞进后排，又朝我喊：\"上车。\"","\"车满了吗？\"我问。","\"满了。\"老周说，\"多你一个，挤挤就有了。\"","我爬上副驾。房车汇进往西的车流，一辆跟着一辆，往宁乡方向开。身后，湘江还在流，断桥的烟柱还在往天上顶。河西的公路两旁，全是往西走的车和人，没人回头，也没人哭。天边的云烧成一片，像要下雨。","\"油还剩半箱。\"老周说，\"宁乡要是有油站，能续上。没有，就得靠两条腿了。\"","\"宁乡有。\"我说，\"排长说，那边有个演习补给点。\"","\"演习。\"老周哼了一声，\"演习的东西，倒救了不少人。\"","路上有抛锚的车，车门开着，人已经走了。有挎着篮子的人，篮子空着，站在路边看着车流，不知道该往哪走。民兵在路口拦车，一辆一辆问：\"能捎人吗？\"能捎的车，后座塞满，才放行。","\"宁乡还有多远？\"李瀚在后排问。","\"排长说，过了宁乡，就是山。\"我说，\"山里面，有口子可以守。\"","李瀚沉默了一会儿：\"那就守。\"","我回头望去。断桥的方向，烟柱已经散了大半，江水还是灰白色的，流得很快。桥那头的东西，一层一层地往江里翻，翻下去，又涌上来，涌上来，又翻下去。","我摸了摸口袋里那块身份牌，把它放回原处。","车窗外面，山影开始从地平线上升起来。宁乡快到了。车队都往那儿去，像一群往巢里飞的鸟。","往前开。"]},{"title":"第十二章 宁乡西·二道","body":["8月10日，宁乡西的山口，是两座山夹出来的一道缝。","公路从缝里穿过去，两边是陡坡，坡上全是灌木和碎石头。车到山口的时候，天已经擦黑。山口的公路上堵着车，一辆挨着一辆，有人下来抽烟，有人蹲在路边啃干粮。民兵拿着喇叭，在山口外头喊：\"车停外面，人走进去，行李自己扛！\"","山口外面停着一排大客车，车头朝西，车门开着，司机坐在方向盘后面打瞌睡。车身上贴着编号，从一到三十，有些编号空着。有人问空号的车去哪了，民兵说：\"拉人走了，还会回来。\"","\"二道到了？\"李瀚问。","\"到了。\"我说。","山口里面比外面乱。沙袋、铁丝网、砍倒的树，把公路堵成一条弯道。弯道两边架着机枪，枪口朝外。败退下来的士兵三三两两坐在路边，有人裹着毯子，有人胳膊上缠着绷带，有人靠着树，闭着眼，不知道睡没睡着。民警和民兵混在一起，拿着一张纸，一个一个地登记人名。","弯道前面，民兵正往路边堆反坦克锥。锥子不够用，有人把路边的石头撬起来，一块一块码到路口。有人拿砍刀劈树，劈断的树往路上拖，横着码成一道墙。墙后面，新挖的战壕还没干，土还是潮的，踩一脚一个印。","登记的长队排到弯道外面。有人抱着孩子，有人拖着行李箱，有人把最后一口干粮掰成两半，一半塞进嘴里，一半塞进口袋。一个老太太站在队尾，手里攥着一张照片，照片上的人已经看不清脸，她每隔一会儿就低头看一眼。","\"姓名。\"登记的战士头也不抬。","\"徐乐。\"","\"职业。\"","\"大学生。\"","\"会干什么？\"","\"会射箭，会开车，眼睛还行。\"","战士抬起头，在纸上写了几个字：\"桥头观察位来的？\"","阿宁把护士证递过去：\"护士，会包扎，会打针，会用碘伏。\"战士在纸上写：医疗组。老周走过去，把驾驶证拍在桌上：\"司机，二十三年驾龄，开过货车。\"\"半挂也开过。\"\"那你待会儿去停车场，帮着挪车。\"老周骂骂咧咧地去了。","\"你怎么知道？\"","\"三连的登记册上有你。\"他说，\"昨晚河西退下来的，都在册子上。\"","李瀚凑过去：\"有我们俩？\"","\"有。\"战士翻了一页，\"徐乐，三号火力点，桥头观察位。李瀚，三号火力点，机枪位。旁边还有一行备注，说你俩是房车带来的。\"","\"房车呢？\"老周的声音从后面传过来，\"登记就登记，车不能登没了。\"","\"车在停车场。\"战士说，\"油抽出来统一调配。\"","老周当场就要骂，被阿宁按住：\"周叔，人在屋檐下。\"","\"你学我。\"李瀚说。","\"我学你什么？\"阿宁说，\"我学你嘴硬。\"","高连长是夜里出来的。","他被两个人扶着，从山口里面一间瓦房里走出来。左胳膊吊着绷带，腰上缠着一圈纱布，纱布上渗着血。他走得慢，一步一停，可腰挺得很直。小宋跟在他后面，怀里抱着一个头盔，看见我们，愣了一瞬，又喊了一声：\"连长，是那个大学生。\"","高连长停下，隔着几步路看我。他看了很久，忽然说：\"又是你。\"","\"你认识我？\"我问。","\"救援队那天，喊出那个大家伙的。\"他说，\"房车是你家的，对吧？\"","\"是。\"","\"那天喊'全体过桥'的，是我。\"他说，\"你那辆房车，装了半车人。\"","\"您呢？\"我问，\"桥上那个三连的？\"","\"三连连长，高建军。\"他说，\"炸桥的时候，被气浪掀下去的。\"","\"对讲机呢？\"李瀚忽然问。","高连长愣了一瞬，摸向腰间，摸了个空。小宋从口袋里掏出一部对讲机，递过去：\"连长，在这儿。你昏迷的时候攥着，我们掰都掰不开。\"","高连长接过对讲机，按了按开关，滋滋的电流声从里面传出来。他听着那阵杂音，没说话，把它别回腰上。","\"信号还能收到吗？\"我问。","\"时有时无。\"他说，\"北边传过来的多。往北，还有人。\"","小宋把头盔放在膝盖上，说：\"这是福元路守桥那个班长的。他让我带回来，说连长腰上有伤，夜里凉，戴着暖和。\"高连长没接话，伸手摸了摸盔沿，又收回去。小宋也没再说话，把头盔抱回怀里。","夜里，我们被编进二道的守备班。","山口外面，探照灯的光柱扫过山谷。山下的公路像一条黑带子，看不到头。高连长坐在瓦房门口，腰上靠着沙袋，看着山口的方向，对讲机搁在膝盖上。小宋蹲在旁边，用袖子擦那个头盔，擦一会儿，又放下。","房车被拖进停车场，老周绕车检查了一遍，把油管拔下来，又插回去，骂了一句：\"半箱油，跑不到邵陵。\"阿宁说：\"跑到山口就够本了。\"老周说：\"你倒是想得开。\"阿宁说：\"想不开的人，都在桥上没下来。\"","停车场里停着几十辆车，有的没油了，有的没钥匙，有的车门开着，人不知道去了哪儿。老周一辆一辆看过去，回来的时候，手里多了一把扳手：\"有两辆还能开，就是没油。油都在西站，西站没了。\"","守备班的弹药，是半夜清的。机枪两挺，步枪几十支，子弹按人头分，一人一百发，剩下的锁在瓦房里。有人问锁着干什么，班长说：\"留给后面的人。\"","\"河西打光了弹，二道没多少弹。\"高连长说，\"演习补给点在西站，西站撤了，油和弹都在那边，没带出来。\"","\"那守什么？\"李瀚问。","\"守时间。\"高连长说，\"把口子收窄，让后面的人走远一点。能拖一小时，就拖一小时。\"","他看了我一眼：\"你那眼睛，在这儿比桥上管用。山口窄，机器够不着的地方多，你盯夜里。\"","我点点头。","下半夜换岗，李瀚坐到我边上，把纱布拆了又缠上：\"高连长那腰，撑不了几天。\"","\"他知道。\"我说。","\"他知道还站那么直。\"","\"就是知道才站直。\"我说，\"他要是一垮，这条口子就没人守了。\"","李瀚没说话。半晌，他说：\"你那眼睛，明天借我使使。\"","\"借你干什么？\"","\"看哪边能活。\"他说完，自己笑了，\"算了，看你自己都看不明白。\"","半夜，残影来了一次。","它没给我看整张战场。它只给我看了一瞬间：山口外，公路边的排水沟里，有个东西正贴着沟底往上爬，往哨位摸。它比普通丧尸大一号，动作很轻，可它的影子在月光底下，拖得很长。","\"排水沟！\"我喊，\"山口外排水沟，有东西摸哨！\"","哨位上的机枪手回头，枪口压下去，对着排水沟扫了一梭子。那个东西从沟里跳出来，往山坡上跑，被第二梭子打中，滚进灌木丛里。","\"机器管不到的地方。\"高连长说，\"你管上了。\"","后半夜，残影又来过一次。","它给我看的是一瞬间：山口西坡，一棵被雷劈断的老树根下面，有个东西正扒开土往坡上钻。土是软的，它钻得很快，眼看就要翻过坡顶，从侧翼摸进来。","\"西坡！\"我抓起对讲机，\"老树根底下，有东西在钻坡！\"","对讲机里传来一声骂。山坡上亮起手电，两把枪口对着树根底下扫。那个东西被从土里逼出来，滚下坡，滚进山口的黑浪里。","\"钻地的也有。\"小宋说，\"这日子，连土里都不安全了。\"","\"土里不安全。\"高连长说，\"就守到土里不安全为止。\"","天亮之前，山谷外的黑浪压到了山口。","探照灯扫过去，山口外的公路上，密密麻麻全是东西，从山脚的拐弯一直铺到看不见的地方。有人数过，河西那夜只是九百多万里的一小截。二道面前这一截，光是山口外头，就数不清。","\"来了。\"李瀚说。","高连长把对讲机别回腰上，站起来。他的腰弯了一下，又挺直了：\"来了就来了。守时间。\"","我坐在哨位上，把手机掏出来。没电了。我盯着黑屏看了半晌，想起易爽。她要是活着，这会儿大概也在某个山口后面，等着天亮。","我摸了摸口袋里的身份牌，把它放回原处。","守时间。","对讲机在静默里响了一声。","高连长按住听筒。电流声里，断断续续有人说话，说的是地名，全是北边的。他听了一会儿，把对讲机贴在耳朵上，又听了一会儿，才放下来。","\"有人还活着。\"他说。","\"西边也有台子在喊。\"小宋说，\"贵阳方向，说有个要塞，还在收人。\"","高连长把对讲机别回腰上，没接话。他站了一会儿，说：\"先活过今天，再想明天。\"","第一声枪响是二十分钟后。","探照灯扫过山口外，黑浪已经涌到弯道口。机枪手架好枪，回头看了我们一眼，又把头转回去。","高连长站在瓦房门口，对讲机贴在耳边，听了一会儿，放下来，说：\"北边来人传话，邵陵还能进。守住今天，明天往邵陵走。\"","小宋站起来，把头盔扣在自己头上：\"守得住。\"","没人接话。","山口外，黑浪翻过第一个弯道。","机枪响了。","第一梭子扫出去，山口外的黑浪顿了一下，又继续往前涌。第二梭子，第三梭子。探照灯的光柱在弯道口来回扫，扫到哪儿，哪儿就有东西翻上来。","高连长没有开枪。他站在瓦房门口，看着山口，腰挺得笔直。","明天，往邵陵走。"]},{"title":"第十三章 邵陵收容点","body":["8月11日，邵陵收容点设在旧体育馆。","车还没到，就看见警戒线，线后面排着长队，从馆门口一直排到马路对面。队伍里的人大多背着包，有人抱着孩子，有人扶着老人，没人说话，都低着头，像在等什么。","老周把车停在队伍末尾，下去问了一圈，回来说：\"登记、体检，合格了才让进。一人发一个手环，吃饭住宿都靠它。\"","\"手环？\"李瀚问。","\"跟小区门禁差不多的东西。\"老周说，\"说是积分，干活的加分，吃住的扣分。\"","我手臂上的划痕还包着纱布。我低头，没说话。","\"排队。\"阿宁说，\"有地方登记，就是还有政府。\"","\"政府。\"老周哼了一声，没接话。","队伍挪得很慢。太阳晒着，地上的人影一点一点往东偏。轮到我们的时候，已经是下午。","登记台后面坐着两个人，一个穿白大褂，一个穿制服。白大褂的问：\"姓名，身份证，从哪来？\"","我报了名字和身份证号。他低头登记，头也没抬：\"几个人？\"","\"四个。\"","\"受伤的没有？\"","\"没有。\"我说。","白大褂抬头，目光落在我手臂的纱布上，停住，又移开。他从台子下面拿出四只手环，灰白色，像医院腕带，中间嵌着一小块屏幕。他挨个往我们手腕上一扣，手环\"嘀\"地亮了，屏幕上跳出几个数字。","\"初始积分。\"他说，\"体检过了按身体再调。吃饭、住宿、医疗，都刷手环。攒不够分，就得出力换。\"","\"怎么出力？\"老周问。","\"巡逻、搬运、清障、种地、修东西，都有活。\"他说，\"会开车的，分高。\"","\"我开二十年货车。\"老周把手环一亮，\"半挂也开过。\"","白大褂在键盘上敲了两下，老周的手环又\"嘀\"了一声。老周低头一看，眯着眼念：\"五十？\"","\"初始四十，司机加十。\"白大褂说，\"进去吧。体检在左边，行李放右边。\"","我低头看自己手环上的数字：十二。李瀚的也是十二，阿宁的三十。","\"凭什么她三十？\"李瀚问。","\"护士。\"白大褂头也不抬，\"医疗是紧缺工种。\"","体检室是体育馆的杂物间改的。一个中年医生让我撸起袖子，看向纱布：\"怎么弄的？\"","\"划的。\"我说，\"铁丝网。\"","他没再问，用棉签蘸了点碘伏，在纱布边缘擦了擦，看了看颜色，说：\"换药勤点。进去吧。\"","出门的时候，他叫住我：\"手环别摘。摘了，系统当你是逃员。\"","我捏着手环，点头。","体育馆里被隔成一片一片，用布帘子和铁架隔开。食堂窗口排着队，有人在刷手环：白面馒头三个积分，糙米粥一个积分，咸菜半积分。有人盯着屏幕上的数字，算了一遍又一遍，把馒头换成了粥。","\"积分能换药吗？\"有人问窗口后面的人。","\"换。\"那人说，\"消炎药十个积分一板。\"","\"抢钱。\"","\"活人价。\"","住宿也按手环分区：有孩子的家庭区、成年单人间、伤病区。阿宁的手环能刷开医疗区的门，我们几个的刷不开。她晃了晃手腕：\"三十积分，就值这一扇门。\"","我攥着手环，没说话。手环屏幕暗着，可我知道它记着什么：我进来时报的名字，我手臂上那道纱布，和体检医生多停的那一秒。","李桂芳不在登记名单上。","阿宁借着护士身份，在医疗组的值班室里转了一圈，回来说：\"医疗组的名单上，有李桂芳。她在里面帮忙。\"","\"能见吗？\"","\"她说忙完这阵，晚上过来。\"","晚上七点，李桂芳来了。","她比一年前老了很多，头发用卡子别着，白大褂洗得发白。她看见李瀚，先是一愣，然后眼圈就红了。","\"妈。\"李瀚喊。","她走过去，抬手摸了摸李瀚的脸，又看了看他肩上的伤：\"怎么弄的？\"","\"没事。\"李瀚说，\"皮肉伤。\"","她没多问，从兜里摸出一包药，塞给李瀚：\"消炎的，一天三次。\"","然后她转向我，张了张嘴，半天说了一句：\"易爽……易爽被人接走了。\"","我愣住：\"接走？谁接走的？\"","\"前天晚上，一辆白车。\"她说，\"挂军牌，有人拿着单子，说是转移重症病患。我看着她上车，车往西边去了。\"","\"往西？\"","\"湘西方向。\"她说，\"跟着观察组的车队。\"","我攥着拳头，指甲掐进掌心。\"什么观察组？\"","李桂芳摇了摇头：\"我不知道。我只知道，来接她的人，手腕上都系着一根绿带子。\"","绿带子。","我在公交门口捡过一截绿带子，上面印着B-3。那是陆远的。","\"那根带子，\"我说，\"是不是上面有编号？\"","李桂芳愣了一下：\"你怎么知道？\"","我看着她，没回答。","夜里，体育馆熄了大半的灯。我躺在垫子上，闭着眼，脑子里全是那辆白车。易爽被接走了，往西，跟着一群系着绿带子的人。","我翻身坐起来，摸出手机，屏幕亮了又暗。没有信号。手腕上的手环屏幕也暗着，可我总觉得它在发烫。","黑暗中，我听见有人在低声说话。体育馆的墙外，忽然传来一声闷响，像什么东西撞在围墙上。","然后是警报声。","哨兵端着枪，从墙头探出去，喊：\"墙外有东西！\"","人群一下子炸开。有人尖叫，有人往馆里跑，有人蹲在原地抱着头。","我抓起弓，往墙边跑。李瀚跟在后面。跑到一半，探照灯的光柱扫过墙头，照出一个弓着背的影子：它比普通丧尸大一号，爪子抠着墙缝，已经爬过半截墙。","\"趴下！别靠墙！\"我喊。","哨兵端着枪，对着墙外比了两下，又收回去。那东西贴在墙外壁，他的枪口压不到。","墙根堆着几摞旧座椅。李瀚拖过一把，我踩上去，扒住墙头，探出半个身子。那东西正往上爬，离墙头不到一臂远。我拉开弓，弦响，箭钉进它的后颈。它晃了晃，爪子从墙缝里松开，摔了下去。","我滑下墙头，靠着墙喘气。","哨兵从墙头上探下来，看了我一眼，没说话。他手腕上也扣着一只手环，跟我的一模一样。","手臂上的划痕又开始发烫。","手环屏幕忽然亮了，没有消息，又暗下去。","收容点没有我想象的那么安全。","可易爽在往西走，我在这里，什么也做不了。"]},{"title":"第十四章 收容点寻人","body":["8月12日，猴子是第二天早上出现的。","他蹲在馆外的花坛边上，黄毛，瘦，手腕上套着一串塑料珠子，面前摆着半包烟和一块不知道从哪弄来的电子表。看见我们走过去，他先咧嘴笑，露出一口烟牙：\"哥们儿，找东西还是找人？\"","\"找人。\"我说。","\"谁？\"","\"易爽，女的，肿瘤科转出来的。\"","猴子把电子表拿起来看了看，又放下：\"姓易的，肿瘤科，是不是有个护士陪着？\"","\"她一个人。\"我说。","\"那我不知道。\"他说，\"不过前两天夜里，医疗组那边确实来了一辆车。白车，挂军牌，下来几个人，系着绿带子。\"","\"你看见了？\"","\"我蹲在这，什么看不见。\"他拍了拍花坛，\"收容点就这么大，谁进谁出，我都记着。\"","我盯着他看了两秒：\"你还知道什么？\"","他伸出两根手指，搓了搓：\"哥们儿，这年头，消息是要钱的。\"","我从兜里摸出一包烟，扔给他。他接住，揣进怀里，又把手环亮出来：\"烟收下了，积分再转五个。手环碰手环，快。\"","\"系统都记着。\"我说。","\"记着就记着。\"他说，\"你怕记，就别在这打听人。\"","我拿手环碰了他的手环，屏幕上跳出一个减五。他低头看了一眼，满意地收回手腕：\"那辆车，往西去的。湘西方向，有个地方叫三号站。我听说，被白车接走的人，都送那去。\"","\"三号站？\"","\"嗯。\"他说，\"具体在哪，我不知道。但我有个哥们儿，以前跑货运，见过那个牌子。\"","他从兜里摸出一张皱巴巴的纸，递给我。上面画着几条线，标着\"落雁镇\"\"三号站\"，歪歪扭扭。","\"谢了。\"我把纸折好，收进兜里。","他叫住我：\"哎，哥们儿。\"","\"嗯？\"","\"你们要是真去湘西，\"他说，\"路上小心点。我听说，三号站进去的人，没几个出来的。\"","我看着他，没接话。","\"还有，\"他压低声音，\"以后有消息，别用手环转。手环碰一下，系统全记着。收容点里有种纸券，一张一积分，反着来的，系统查不到。\"","\"纸券？\"","\"你迟早会见到。\"他说，\"到时候，找我。\"","我把他的话记下了。","中午，李桂芳来送饭。她看了看四周，压低声音说：\"我查到一点东西。易爽在医疗组的记录上，写的是'观察组'，不是'转移组'。\"","\"观察组？\"","\"嗯。\"她说，\"我在医疗组待了这么多年，从来没听过这个组。它不在公开名单上。\"","\"还有什么？\"","\"来接易爽的那个人，\"她说，\"我在医院见过他。去年，他来医院做过一次体检，抽了三管血。当时陪他来的，还有一个戴眼镜的，叫沈医生。\"","沈医生。","这个名字让我后背发凉。三年前，我签知情同意书的时候，给他抽血的，就是一个姓沈的医生。","下午，我找到阿宁，让她帮忙查一件事。","\"帮我查个人。\"我说，\"B组，七个人，三年前登记的志愿者。\"","阿宁看了我一眼，没多问，点了点头。她的手环刷开医疗区的门，门在她身后合上。","傍晚，体育馆墙外又响了。","这次不是一只。探照灯扫过去，墙根下蹲着七八个影子，弓着背，爪子抠着墙缝，正在往上爬。","哨兵拉响警报。枪声密集起来。有人翻过墙头，被子弹打回去；有人从缺口钻进来，被守在墙边的士兵用枪托砸倒。","我站在墙边，拉开弓。残影浮起来，比现实快半步：东边，探照灯扫不到的死角，一个东西正贴着墙檐往上爬，已经翻过墙头，爪子悬在半空。","\"东边死角！\"我喊，\"墙檐上！\"","一个士兵扑过去，枪口对着墙檐。那个东西刚落地，被两梭子顶回去，摔在墙外。","哨兵回头看了我一眼，没说话。他抹了一把脸上的汗，把弹匣换了。我认得他，昨晚墙头那个，手腕上的手环跟我的一样。","半夜，墙外安静了。","我躺在垫子上，手臂上的划痕又开始发烫。我闭上眼，眼前全是那辆白车，往西开。","手环屏幕暗着。可我知道，它把今天记下来了：五个积分，给了一个卖消息的猴子。","收容点不能久留。","天亮之前，我做了一个决定。"]},{"title":"第十五章 收音机自己亮起","body":["8月13日，采血在早上八点。","医疗组的地下室里，灯是白的，桌子也是白的。沈医生坐在桌子后面，面前摆着采血管和登记本。他拿读卡器在我手环上扫过，才让我撸起袖子，用橡皮管扎住小臂，拍了两下，针尖扎进去。","血是红的。正常。","他把采血管贴上标签，写了个编号，放进身后的铁皮柜里。柜子里已经放了几管，标签都是新的。","沈医生没急着让我走。他坐在桌子后面，看着我：\"三年前那批志愿者，你还记得多少？\"","\"记得一点。\"我说，\"体检，抽血，签知情同意书。\"","\"吃的药呢？\"","\"胶囊。\"我说，\"每周一板，说是什么免疫调节的营养补充剂。\"","他点了点头，在登记本上写了一行字。我侧头，看见那个编号：","B-5。","我的编号，三年前签的，三年没变。","\"沈医生。\"我说，\"B-5，还在册子上？\"","他头也没抬：\"你记得很清楚。\"","\"我记得的东西不多。\"我说，\"就这个，忘不了。\"","他没接话。我穿好袖子，站起来，往外走。走到门口，他叫住我：","\"注意休息。\"","\"嗯。\"","出了地下室，太阳晃得我眯起眼。我站在台阶上，把那句话在脑子里翻了一遍。注意休息。他说的是休息，还是别的？","李瀚在墙根下等我，看见我出来，问：\"怎么样？\"","\"抽了管血。\"我说，\"别的没什么。\"","我撒了谎。我没告诉他，我看见了那个编号。","晚上，老周把短波收音机拿出来，放在桌上，拧开。","电流声。沙沙的，像雨落在铁皮屋顶上。","老周调了几个频段，都是杂音。他正要关掉，忽然，收音机自己亮了。","老周的手停在旋钮上。信号是自己撞进来的。","一个声音从喇叭里传出来，很轻，很稳，像是从很远的地方传来的：","\"……他们还活着……\"","声音断了一瞬，然后变成一串摩斯电码，长短音交错，同一组敲了三遍。老周拿笔尖在纸角上记，笔停住，说：\"四零八。\"","我盯着那台收音机，后背发凉。老周也愣住了，他伸手去调，那声音又响了一次，这次更清楚：","\"他们还活着。\"","然后又是那串摩斯电码，长短音交错，三遍，还是四零八。","然后彻底安静了。","李瀚问：\"刚才那是什么？\"","没人回答。","老周把收音机拿起来，翻来覆去看了两遍：\"这机器，我刚才拧的是军用频段。可这个声音，不是军用频段的声音。\"","\"那是什么频段？\"","\"我不知道。\"他说，\"我开了二十年货车，从来没听过这种信号。\"","我盯着那台收音机。\"四零八。\"我说，\"这个数字，我没见过。\"","\"那你怎么知道它有用？\"李瀚问。","\"因为那条英文帖子。\"我说，\"VX-9，34.05,-118.24，还有一句：他们在云层之上。帖子没给高度，电台给了。\"","\"可电台这条不是坐标。\"老周说，\"这是摩斯码。\"","\"四百零八公里，近地轨道。\"我说，\"低轨卫星、空间站，都在这个高度上下。\"","\"你是说，他们还在天上？\"李瀚问。","\"他们还在天上活着。\"我说。","云层之上。四零八。","我把那行字抄进备忘录，和M的那条英文信息排在一起。","凌晨三点，我躺在地上，闭着眼，脑子里全是那台收音机。","他们。四零八。","云层之上，那是他们待着的地方。","天亮之前，我做了决定。","\"去湘西。\"我对老周说，\"落雁镇，三号站。\"","老周看了我一眼：\"为了那个观察组？\"","\"为了易爽。\"我说。","他沉默了一会儿，把收音机塞进包里：\"走。\""]},{"title":"第十六章 名单上的名字","body":["8月14日，阿宁是下午把名单带回来的。","她借着护士身份，在医疗组的值班室里待了半天。出来的时候，手里夹着几张纸，上面抄着一串编号。","她说，值班室的文件柜没锁，她趁着没人，翻到一本旧册子。册子封面写着\"志愿者登记\"，纸页发黄，边角卷着。她不敢拍照，就一个字一个字地抄。","\"B组，一共七个人。\"她说，\"三年前登记的那批志愿者，编号从B-1到B-7。\"","\"七个？\"我问。","\"剩下五个，都在册子上。\"她把纸摊开，\"B-1，B-2，B-4，B-6，B-7。\"","我盯着那串编号。\"B-3呢？B-5呢？\"","阿宁看了我一眼：\"B-3，陆远，册子上写'转出'。B-5……\"她顿了顿，\"册子上没有B-5的记录。\"","\"没有？\"","\"没有。\"她说，\"就像这个人从来没登记过。\"","我坐在床沿，看着那串编号，半天没说话。","B-3转出，B-5消失。剩下的五个，都在册子上。","\"三号站收的是B组的人？\"李瀚问。","\"不知道。\"阿宁说，\"但册子上，B-1到B-7，后面都跟着同一个地址：三号站。\"","三号站。又是三号站。","傍晚，收容点的广播响了。","\"招募志愿者，协助部队巡逻、搬运、清障。有意者到东门登记。\"","李瀚站起来：\"我去。\"","\"你去干什么？\"","\"领一把枪。\"他说，\"我当过兵，他们会要。\"","我跟在他后面，走到东门。登记台后面坐着两个军人，看了李瀚一眼：\"当过兵？\"","\"两年，侦察连。\"","军人的眼睛亮了一下：\"会打枪？\"","\"会。\"","登记台边放着一台读卡器。李瀚把手环按上去，屏幕上跳出两个字：军功。军人说：\"巡逻、出勤、清障都计分，攒够了能换子弹。\"","他从后面箱子里拿出一把步枪，递给他：\"子弹省着用。\"","李瀚接过枪，掂了掂，拉了一下枪栓。动作干净利落。","军人看了我一眼：\"你呢？\"","\"我会射箭。\"我说。","\"射箭？\"他愣了一下，\"桥头不缺箭。\"","李瀚说：\"他眼睛好使。\"","军人看了我一会儿，从箱子里摸出一把弓弩，递给我：\"弩，比弓好使。会用？\"","\"会。\"","我接过弩，试了试。他点了点头：\"晚上跟巡逻队走。\"","晚上，巡逻队在墙根下集合。我背着弩，站在队伍末尾。李瀚挎着步枪，站在前面。","墙外，探照灯扫过，光柱落在空地上，什么都没有。","\"昨晚那波，不是普通的。\"领队的班长低声说，\"有东西会爬墙了。\"","我握着弩，没接话。","残影在黑暗里浮起来。这一次，它给我看的是东边。收容点外面的公路上，一辆车正往这边开。","一辆车，车灯亮着，正在往收容点开。车上坐着一群系着绿带子的人。","他们在往这边来。","\"东边。\"我说，\"有车。\"","班长看了我一眼：\"车？\"","\"嗯。\"我说，\"白车。\"","所有人安静下来。班长抬手，示意队伍散开。","公路尽头，两道光柱亮起来，越来越近。","是白车。"]},{"title":"第十七章 湘西方向","body":["8月15日，出邵陵的时候，天还没亮透。","房车从停车场开出来，车厢里坐着我们四个。老周开车，李瀚坐副驾，阿宁和我挤在后排，中间堆着两箱压缩饼干和一袋纱布。","车开出收容点的大门，门口的哨兵看了一眼车牌，挥了挥手。","\"三号站。\"我说，\"落雁镇，白房子，大槐树。\"","\"知道了。\"老周说，\"地图放在你那儿，你指路。\"","出城的路比想象中好走。收容点外面清过场，公路两边的车被推到沟里，留出一条道。可出了城，路就难了。","路边的车越来越多，有的烧过，只剩下黑黢黢的壳。一辆小货车侧翻在路边，车斗里的东西撒了一地，米、面、几件衣服，还有一个奶粉罐，滚到排水沟边上。","阿宁看着那个奶粉罐，没说话。","再往前，是一辆翻倒的大巴。车窗全碎，座位上没人，只有几摊暗红色的东西，在太阳底下发黑。","我们把车速放慢，从大巴旁边绕过去。","走了不到两公里，路边有人招手。","是个女人，三十来岁，怀里抱着一个孩子。孩子很小，看不出几个月，被裹在一件大人的外套里。女人站在路边，旁边放着一个行李箱，看见我们的车，拼命挥手。","老周没停车。","\"周叔。\"我说。","\"路边的人，十个有九个有问题。\"他说，\"你知道她为什么站在路边？她老公刚才在后面拦车，让我们先走。\"","我回头看。那个男人正站在大巴旁边，朝我们摆手，示意我们别停。","\"他们不是坏人。\"我说。","\"我没说他们是坏人。\"老周说，\"我说的是，现在这个世道，好人比坏人更危险。\"","他踩了刹车。车停在女人面前。","\"上车。\"老周说，\"抱着孩子，坐后面。\"","女人愣了一下，然后抱着孩子跑过来。阿宁拉开车门，把她让进来。她坐稳，把孩子往怀里拢了拢，低声说：\"谢谢。\"","\"你老公呢？\"我问。","\"他……\"女人顿了顿，\"他说他拦下一辆车再走。\"","\"他还没回来。\"阿宁说。","\"会回来的。\"女人说。","她抱紧孩子，不再说话。","中午，我们在一个废弃的服务区停下来。老周给车补油，阿宁给水箱加水。女人抱着孩子坐在树荫下，喂了孩子一点水。","我蹲在车边，把地图摊开，指给老周看：\"落雁镇，在湘西，翻过这道山就是。三号站，在镇子边上。\"","老周眯着眼看了一会儿：\"山路不好走。\"","\"不走山路。\"我说，\"国道绕，远一点，但路好。\"","他点了点头。","出了服务区，国道边出现一片厂房。门口的字锈了一半，看不清厂名，围墙塌了一段，院子里停着几辆蒙灰的车。","李瀚说：\"找点零件？\"","老周把车停在厂门口。我跳下车，往里走了几步。配电间的门虚掩着，里面有个人蹲在墙角，面前摊着一台拆开的机器。他抬起头，四十岁上下，胡子拉碴，眼睛里全是血丝。","\"你们是活的？\"他问。","\"活的。\"我说。","他低头又去拧螺丝：\"活人现在比机器稀罕。\"","我给他留了半瓶水，问他走不走。他摇了摇头：\"产线停了，人还得在。\"","\"你呢？\"他问。","\"湘西。\"","\"那地方是往山里去的。\"他说，\"你要是回来，往配电间看一眼。\"","我把他这句话记下了。","回到车上，李瀚问：\"认识？\"","\"不认识。\"我说，\"以后可能认识。\"","下午，公路边的河沟里，三四个东西正顺着水流往下游走，动作迟缓，可数量在增多。","李瀚把车窗摇上去。阿宁看了外面一眼，把孩子抱紧了些。","\"巡飞弹。\"老周忽然说。","我抬头。天边一个黑点，飞得很低，像一只鹰。它悬停了一下，然后俯冲，消失在河沟的方向。","一声闷响，从很远的地方传来。","\"无人机。\"阿宁说，\"部队的。\"","\"嗯。\"我说，\"他们在清。\"","可清得完吗？我盯着窗外，看着那三四个东西被炸散，可更远的地方，还有新的影子从水里爬出来。","傍晚，我们在一个废弃的村庄边上扎营。","村里没人。门都开着，有的锁着，有的被踹开。灶台上还有半锅冷饭，筷子搁在碗沿上，人却不见了。","女人抱着孩子，在火堆边坐下。孩子醒了，没哭，睁着眼睛看火。","\"你叫什么？\"阿宁问。","\"叫我小刘就行。\"女人说。","\"你老公呢？\"","她没回答。过了一会儿，她说：\"他说他会跟上来。\"","夜里，我靠着墙，半睡半醒。残影来了一次，给我看的是明天的事：一辆翻倒的车，横在国道上，车斗里堆着箱子，箱子上的字被血糊住。","我睁开眼，天还没亮。","易爽在三号站。我离她，还有一天的路。"]},{"title":"第十八章 陆远的影子","body":["8月16日，落雁镇在山的背面。","车翻过那道山梁的时候，太阳刚偏西。镇子不大，一条街走到头，街边的房子大多是木头的，屋顶压着瓦。街上没人，也没车，只有几只鸡在路边的草丛里啄食，看见车过来，扑棱着翅膀跑开。","\"这镇子还活着？\"李瀚说。","\"人不在。\"我说，\"鸡在。\"","车慢下来，从街这头开到那头。理发店的镜子碎了一面，粮油店的门虚掩着，门口撒着几粒米。有人在墙根下烧过一堆火，火堆还温着，灰里埋着半截玉米。","\"刚走不久。\"老周说。","地图上标的\"三号站\"，在镇子边上，白房子，门口一棵大槐树。","车停在槐树底下，熄了火。","\"就是这儿？\"李瀚问。","\"地图上标的就是这儿。\"我说。","我刚要下车，残影来了。","它给我看的是大槐树的树冠。树冠里，有什么东西蹲在枝杈上，正往下看着我们。它的眼睛在阴凉里发着暗红色的光，像两粒烧着的炭。","\"树上有东西！\"我喊，\"都别下车！\"","老周踩住油门。可晚了。","树冠里那个东西跳下来，落在车前盖上。车盖被压得凹下去一块，整个车身晃了一下。","是它。","比公交上那个大了一号，皮肤泛着一层灰白的光，像一层硬壳。两个包从后背鼓起来，比上次更明显。它低头看了看车里的我们，又抬起头。","它认得我。","\"倒车！\"李瀚喊。","老周挂上倒挡，油门踩到底。那东西从车前盖上跳开，落在路边，没有追。它站在那，歪着头，隔着车窗看着我。","李瀚手心里全是汗：\"它怎么不动？\"","\"它在看。\"我说，\"它在看我。\"","我盯着它的眼睛。那双眼睛浑浊，可浑浊底下有一层东西，像隔着水看灯。它在认我。","\"它还记得你？\"李瀚问。","\"我不知道。\"我说，\"可它没动手。\"","老周手搭在方向盘上：\"要不要倒车？\"","\"不用。\"我说，\"它要是想动手，刚才就动了。\"","它看了我很久，然后转身，走到墙根下，停了一下，翻墙进了院子。墙那边，是白房子的院子。","我从口袋里摸出那截绿带子。B-3，公交门口捡的，从那天起我一直带着。带子上的字被汗磨得有点糊了，可编号还在。","\"它认得我们。\"李瀚说。","\"它认得这条带子。\"我说，\"更认得我。\"","\"那它是带我们进去？\"","\"不确定。\"我说，\"可易爽在里面。\"","白房子的门虚掩着。我推开门，院子不大，晒着一绳衣服。里面的人听见动静，走出来，站在台阶上。","是个女人，三十多岁，穿着白大褂，胸前别着一支笔。","\"你找谁？\"她问。","\"易爽。\"我说，\"她应该被送到这里。\"","她看了我一眼，目光落在我手里的绿带子上，停了一下。","\"你是她什么人？\"","\"男朋友。\"","她沉默了一会儿，侧身让开：\"进来吧。\"","我跨进门槛。她在我身后，把门关上了。","\"B-5，\"她说，\"你终于来了。\"","我停住脚步，回头看她。","\"你认识我？\"","\"三号站的登记册上有你。\"她说，\"B-5，三年前签的。\"","我攥着绿带子，没说话。","她伸出手：\"叫我许护士就行。三号站的。\"","我握住她的手。她的手很凉。","\"易爽呢？\"我问。","她没回答。她转身，往走廊深处走：\"你跟我来。\""]},{"title":"第十九章 秘密医疗点","body":["8月16日傍晚，三号站的走廊，比外面看着长。","白墙，日光灯，地砖擦得很干净。墙上的牌子上写着：观察一室、观察二室、处置室、档案室。","走廊尽头，墙角印着一个圈，圈里一片叶子，绿漆的，很淡，像盖章盖上去的。","许护士走在前面，脚步声在走廊里回响。","\"这地方，\"李瀚说，\"像个医院。\"","\"本来就是医院。\"许护士说，\"康复观察站。\"","\"观察什么？\"","她没回答。走到走廊尽头，她推开一扇门，门后是一间大病房，摆着六张床。床上躺着三个人，都盖着白被单，手腕上系着绿带子。最里面那张床，床头放着一台氧气机。","\"易爽呢？\"我问。","许护士走到那张床边，拉开白被单。床上空着。","\"她不在。\"她说。","\"她去哪了？\"","\"前天晚上，被送走了。\"她说，\"往北。\"","\"往北是哪儿？\"","她没直接回答。她走到窗边，看着外面的山：\"三号站只是第一站。采血，测反应速度，体质好的，往北边送。\"","\"送哪儿？\"","\"火种前站。\"她说，\"在河谷那边，有个大坝。\"","\"为什么要送？\"","她回头看我，目光落在我手臂的纱布上：\"因为她血样里的东西，在显微镜下会动。\"","我愣住。","\"会动？\"","\"嗯。\"她说，\"B组的人，抽出来的血，在显微镜下会动。反应速度越快，动得越明显。\"","我攥着拳头，指甲掐进掌心。","\"易爽的反应速度，怎么样？\"我问。","许护士没回答。她走到墙角，拉开一个抽屉，从里面拿出一本登记册，翻到其中一页，递给我。","上面写着：易爽，B组观察对象，反应速度A，转送火种前站。","\"A。\"我念了一遍。","\"最好的那一档。\"许护士说。","我站在窗前，看着外面的山，半天没说话。","李瀚走到我身边，低声说：\"她还在。只是换了个地方。\"","\"嗯。\"我说。","晚上，许护士带我们去见了一个人。","病房的角落，床上躺着一个男人，戴着氧气面罩，手腕上系着绿带子。他闭着眼，呼吸很浅，像睡着了一样。","我认得他。","\"周凯。\"我说。","他眼皮动了一下，没有睁。","\"三年前，你分我半个馒头。\"我说，\"你说你妈每天傍晚坐在门口择菜。\"","他睁开眼，看着天花板，声音很轻：\"徐乐？\"","\"是我。\"","\"你怎么在这儿？\"","\"来找人。\"我说，\"易爽，被送走了。\"","他沉默了一会儿：\"我看见她走的。前天晚上，白车来接的。她上车的时候，回头看了一眼。\"","\"她说什么了吗？\"","\"她没说。\"周凯说，\"她只是看着南边。\"","南边。她看着南边。","那是星城的方向。","许护士站在门口，看着我们收拾东西。她说：\"你们要回青石镇？\"","\"先回。\"我说，\"易爽的事，我记下了。\"","她点了点头，从口袋里摸出一样东西，递给我。是一根天线，短波的。","\"这个，你拿着。\"她说，\"路上用得上。\"","\"谢了。\"","\"别谢。\"她说，\"B-5，你还没被送进去，就该好好活着。\"","我攥着那根天线，没接话。","凌晨，广播响了。","那个女声，念的还是同一句话：\"青石镇方向，青石镇失守，镇内无幸存者，请周边居民勿前往。\"","那个女声，比在邵陵时又冷了一点，像在念菜单。","我站在院子里，听着那声广播，浑身发冷。","青石镇失守。","我爸妈在青石镇。","我把天线塞进背包，转身往车上走。","\"回去。\"我说，\"回青石镇。\""]},{"title":"第二十章 青石镇失守","body":["8月17日，我们是在第二天早上离开落雁镇的。","许护士站在门口，没有送。她只说了一句：\"往东走，别回头。\"","老周把车倒出槐树底下，我坐在副驾，看着后视镜里那栋白房子越来越小。","易爽被送走了。陆远翻墙进了院子。周凯躺在床上说\"别来\"。","回程的路，比来的时候安静。","国道上没人，没车，连巡飞弹都没再出现。路边的东西越积越多，有的烧过，有的烂在沟里。李瀚把收音机拧开，里面全是杂音。老周伸手关掉，又拧开，又关掉。","中午路过一个镇子，镇口的路牌倒了，横在路中间。老周把车停下来，李瀚下去搬路牌，回来的时候说：\"镇子里没人，门都开着。\"","\"进去看看？\"阿宁问。","\"不进了。\"我说，\"赶路。\"","下午的路，越走越静。人、车、鸟，一样都看不见。树上的叶子全黄了，可这个季节，不该黄。","\"这地方，像是被抽空了。\"阿宁说。","\"不是被抽空。\"老周说，\"是东西都走了，或者都倒了。\"","\"青石镇，\"老周说，\"你真要回去？\"","\"我爸妈在镇上。\"","\"广播说，镇里没活人了。\"","\"广播说的。\"我说，\"广播还说，三号站是康复观察站。\"","老周没再说话。","下午，我们在一座废弃的加油站停下。老周给车补油，阿宁检查水箱。我蹲在加油站门口，拨我爸的座机。","拨了三遍，没人接。","第四遍，通了。","电话那头先是一阵杂音，然后是我爸的声音。他的声音很轻，像怕被谁听见：\"别回来。\"","\"爸！\"","\"别回来。\"他说，\"家里，家里锁着门。你别回来。\"","\"你们在哪儿？\"","电话断了。","我攥着手机，站在加油站门口，半天没动。我爸的声音，听着不像害怕，像在压着什么。他说别回来，他说家里锁着门。","\"他们还在？\"李瀚问。","\"在。\"我说，\"我爸不会说假话。他说别回来，就是他们还没走，或者刚走。\"","\"那广播呢？\"","\"广播是假的。\"我说，\"或者，广播是给外面的人听的。\"","夜里，残影来了一次。","它没给我看整个青石镇。它只给我看了一瞬间：我家门口那两棵柚子树，一棵倒了，树根连着土，翻在外面。院门开着，门槛上有一双脚印，往山的方向去。","脚印是新的。","我睁开眼，天还没亮。我躺在房车的后舱，盯着车顶，把那片影子又过了一遍。柚子树倒了，门开着，脚印往山里。","他们走了。他们自己走的。","可爸在电话里说\"别回来\"。如果他们已经进山了，为什么要接电话？除非，电话是他专门回来接的。","就为了跟我说那三个字。","车台响了一声，没头没尾，又断了。老周把手按在车台上，听了一会儿，说：\"有信号在跟着我们。\"","\"部队的？\"李瀚问。","\"不知道。\"老周说，\"可它跟了一路了。\"","天一亮，车继续往东。","中午，广播又响了。","还是那个女声，念的还是同一句话：\"青石镇方向，青石镇失守，镇内无幸存者，请周边居民勿前往。\"","那个女声念得比昨天更平，一个字一个字往外吐。","\"第二遍。\"李瀚说。","\"嗯。\"","\"广播说镇里没活人，可你爸接了电话。\"","\"所以广播是假的。\"我说。","李瀚没接话。他看了一眼窗外，说：\"那你回去，找什么？\"","\"找人。\"我说，\"找脚印。\"","下午，车翻过那道山梁，青石镇在望。","镇口的老槐树还在，理发店的门关着，街上的玻璃碎了几扇。车开进镇子，停在老宅门口。","街上有两具尸体，已经没人收拾。一辆三轮车翻在路边，车斗里的菜烂了，招着苍蝇。李瀚把车窗摇上去，谁都没说话。","我下车的时候，腿有点软。","院门没锁。推开门，院子里晾着一绳衣服，风一吹，袖管空荡荡地晃。","柚子树倒了一棵。树根连着土，翻在外面，像被什么连根拔起来的。院门开着，门槛上有一双脚印，往外，往山的方向。","我蹲在门槛边，看那双脚印。脚印很深，走得急，可方向很清楚。","山里。","\"他们走了。\"我说。","\"往哪儿？\"","\"山里。\"我说，\"我爸留了记号。\"","门槛旁边，泥地上画着一个圈，圈里一道箭头，指着山的方向。那是我爸的习惯，他下地干活，怕迷路，总在岔路口画这种记号。","我蹲下去，把那个圈又看了一遍。圈画得圆，箭头画得直，是拿着树枝一下一下刻出来的，不慌。","\"你爸走得急，但不慌。\"老周说。","\"嗯。\"","\"那他就是自己走的。\"老周说，\"不是被抓的。\"","我站起来，看着山的方向。","\"明天进山。\"我说。","老周在旁边，点了根烟，吸了一口，说：\"陪你走这一趟。输了算我的，赢了算你的。\"","\"周叔。\"","\"别叫。\"他说，\"我答应过你爸，不让你半路掉头。\"","我站在门口，看着那棵倒下的柚子树，看着门槛上的脚印，看着远处的山。","明天，进山。"]},{"title":"第二十一章 进山","body":["8月18日，天没亮，我们就进山了。","车停在镇口的老槐树底下，再往里，路走不了车。老周把房车上的东西分了两份：水、压缩饼干、一包纱布、一把工兵铲，剩下留在车上。阿宁把车钥匙收进兜里，说：\"我留下看车。\"","\"你一个人？\"李瀚问。","\"镇上没人了。\"阿宁说，\"比山里安全。\"","老周看了她一眼，从后备箱里摸出一把铁棍递给她。","\"拿着。\"","阿宁接过去，掂了掂，说：\"我在这等你们，三天。三天不回，我就开车走，不找你们。\"","\"好。\"我说。","进山的路，是我爸踩出来的。","他下地干活，怕迷路，总在岔路口画记号。这次也是。走出二里地，路边的松树上，树皮被刀划了一道，箭头指向上山的方向。又走一里，一块石头上压着三块小石头，也是往山上去。","\"你爸留记号，留得挺勤。\"李瀚说。","\"他怕我看不见。\"我说。","\"他不是怕你看不见。\"老周说，\"他是怕你不来。\"","山路越走越窄。两边的树挤过来，把天遮得只剩一条缝。林子里飘着一股味，腥的，混着土腥气，像有什么东西在林子里烂了很久。","\"小心点。\"李瀚把枪端起来，\"这味儿，我闻过。\"","\"哪儿？\"","\"上次那波尸潮，就是这味儿先来的。\"","我们放慢了脚步。林子里静得不正常，没有鸟叫，也没有虫声。只有鞋底踩在落叶上的声音，一步，一步。","走了两个钟头，山路到头了。","前面是一个山坳，坳里有片空地，空地中央塌着一座土房子。房子是旧的，墙皮剥落了大半，门框上钉着几块木板。房子门口，停着一辆拖拉机，车斗里堆着半车白菜，白菜已经烂了，招着苍蝇。","我蹲在路口，找记号。","没有。","这条路到头了，我爸的记号也到头了。最后一处记号，是山坳口那块石头，三块小石头压着，箭头指着这个方向。可坳里除了那座塌房子，什么都没有。","\"会不会走岔了？\"李瀚问。","\"不会。\"我说，\"记号没错。\"","老周绕着土房子走了一圈，蹲下来看地上的土。他看了半天，站起来说：\"这房子，前两天有人住过。\"","\"你怎么知道？\"","\"火塘是凉的，可灰是新灰。\"他说，\"门框上的钉子，是刚钉的，锈都没起。有人在这住过，住了没两天，走了。\"","\"走了？往哪走？\"","老周没回答。他盯着拖拉机底下，忽然说：\"过来看看。\"","拖拉机底下，土是翻过的。翻开的土里，露出半截布条，蓝的，洗得发白。","我认得那布条。","我妈的围裙上，系着一条蓝布带子。她做饭的时候总系着，说是干活方便。那布条在土里埋着，被雨水泡过，颜色已经发灰，可边上的补丁还在。补丁是她拿旧衣服的布头缝的，形状我记得。","我把布条从土里挖出来，攥在手里。","\"你妈来过这。\"老周说。","\"嗯。\"","\"来过，又走了。\"他说，\"布条埋在翻过的土里，是埋的，不是掉的。\"","\"她自己埋的？\"","\"要么是她埋的，要么是替她埋的人。\"老周说，\"总归不是抓她的人。抓人的人，不埋东西。\"","我攥着那条布带子，在坳口站了很久。","山里的风从坳口灌进来，吹得那棵烂白菜上的苍蝇乱飞。我忽然想起来，我妈埋东西有个怪习惯。她从来不会把东西埋在一处，总是埋在路两边，一边埋一点，说是\"留个念想，也留个后路\"。","我蹲下去，在拖拉机另一边的土里翻。","翻了没两下，手指碰到一个硬的东西。刨出来，是一块塑料布，裹着一只旧搪瓷缸。缸里放着三样东西：一张身份证，一张银行卡，还有一卷用橡皮筋扎着的钞票。","身份证是我妈的。照片上的她，比现在年轻些，头发没白。","银行卡是废的，卡号被磨掉了一截。","钞票是卷着的，五块十块的，一共数了数，一百二十七块。橡皮筋扎得紧，是新的。","\"这是她留给你的。\"老周说。","\"嗯。\"","\"她把你爸的记号，留到了这。\"他说，\"记号到这就断了。可她自己的念想，还在这。\"","我把搪瓷缸放进背包里，站起来，看着山坳对面那道岭。","\"过了这道岭，是什么地方？\"我问。","老周眯着眼看了一会儿：\"过了岭，是国道。国道往北，能到宁乡西边。\"","\"宁乡西边有什么？\"","\"以前有个粮库。\"他说，\"现在不好说。\"","李瀚把收音机拧开，拧了半天，只有杂音。他把收音机关了，说：\"这地方，信号也不好。\"","\"不是信号不好。\"我说，\"是没人发电了。\"","我们翻过那道岭。","岭那边的国道，比想象中安静。路上没有车，也没有人，只有风卷着枯叶，从路这头刮到路那头。路边的电线杆上，缠着几根断了的电线，垂下来，像吊着什么东西。","我走了一段，停下来。","国道边，有一道岔路口，岔路往北，通向一片山坳。山坳口拉着铁丝网，网上挂着一块牌子，白底黑字，写着四个字：","\"防疫检查。\"","铁丝网后面，有车辙，有脚印，还有人踩出来的小路。小路尽头，影影绰绰立着几排房子，房顶上竖着天线，天线在风里转。","我站在铁丝网外，看着那几排房子。","我爸的记号，断在进山的地方。我妈的念想，埋在拖拉机底下。他们一个留记号，一个留后路，都往同一个方向走。","这个方向，是这里。","\"进不进？\"李瀚问。","我看着那几排房子。房顶上没有红旗，门口没有哨兵，可那铁丝网是新拉的，网上的刺是亮的。","\"进。\"我说，\"天黑之前，看清楚里面是干什么的。\"","天色开始暗了。山坳里的风，把铁丝网上那块牌子吹得晃了晃。","\"防疫检查\"四个字，白的，很干净。","可铁丝网下面的土里，埋着一截蓝布条一样的、没烧干净的东西。我蹲下去，没敢碰。","我认得那种布。","那是我妈围裙上的蓝布，一块，两块，三块。它们被烧过，没烧透，半截埋在土里，半截露在外面，像一排不说话的路标。","老周也看见了。他点了根烟，吸了一口，说：\"这地方，不是防疫站。\"","\"那是什么？\"","\"你爸你妈，往这儿跑。\"他说，\"跑进来的，要么是躲灾的，要么是逃命的。可这牌子，是给外面的人看的。\"","烟头在风里亮了一下，又暗下去。","\"里面的人，大概不想让外面的人知道，他们在干什么。\""]},{"title":"第二十二章 借调","body":["8月20日，我们回到设备厂的时候，厂区已经被围了。","围墙塌的那段，现在堵着一排翻倒的车。车后面，十几个东西贴着铁门往里挤，铁门被挤得哗哗响。配电间的小窗还亮着一点光。那人还没走。","\"他还在里面。\"李瀚说。","\"嗯。\"我说。","老周把车停在两百米外。李瀚端着步枪，跟我摸到墙根。铁门边的东西听见动静，转过头来。李瀚一梭子扫过去，把它们从铁门边撕开一片。我趁空翻过矮墙，贴着墙根跑到配电间门口。","门从里面闩着。","\"开门！\"我拍门，\"是我！那天给你留水的那个！\"","门开了一条缝。那人站在门里，胡子拉碴的脸上全是灰：\"你怎么回来了？\"","\"路过。\"我说，\"走吧，车在那边。\"","\"我这机器还没修好。\"","\"机器修不好，人先活。\"我说，\"你妻女埋在后山，她们不会希望你死在配电间。\"","他看着我，看了几秒，把门闩拔了。","我们翻出矮墙的时候，李瀚已经换了一匣子弹。老周把车门拉开，那人钻进车厢，坐在工具箱上，半天没说话。","\"名字。\"老周问。","\"陶一鸣。\"他说，\"设备科的。\"","\"会修什么？\"","\"会修你们修不了的。\"他说，\"也会修你们能修的。\"","车开出厂区的时候，陶一鸣回头看了一眼配电间，没再说话。","下午，国道前面设了卡。","不是收容点那种卡。两辆装甲车横在路中间，车顶的机枪对着我们。一个穿迷彩的军官站在车前，手里拿着一张纸，纸上是打印的照片。","他走到车窗边，看了我一眼，又看了一眼手里的纸。","\"徐乐？\"","\"我是。\"","\"猎眼。\"他说，\"B-5。\"","李瀚的手按在步枪上。老周没动。","\"别紧张。\"军官说，\"南部战区特战三队，姓顾。你的战绩记录在案：河西桥头观察位，猎眼呼号，三次预警全部命中。\"","\"然后呢？\"","\"然后，\"他说，\"国家需要你。\"","\"国家需要我？\"我说，\"国家需要我的时候，我在桥头。现在国家想起来我了？\"","\"现在不是想起来了。\"顾军官说，\"是打不动了。弹药不够，产线停着，电断了大半。我们要把丢掉的厂子拿回来，拿回来就得先恢复电。恢复电，就得先拿下一座水电站。\"","\"这跟我有什么关系？\"","\"那座水电站，\"他说，\"在湘西。你眼睛能看见别人看不见的东西。我们需要一个猎眼，进侦察组。\"","\"我有自己的事。\"","\"你的事，我们知道。\"顾军官说，\"易爽，白车，三号站，火种前站。你爸妈，青石镇，防疫检查站。\"","我攥着拳头。","\"我帮你查。\"他说，\"你帮我们打。打完了，我告诉你，他们在哪。\"","\"我怎么信你？\"","他抬起手腕，手环上亮着一个编号：\"顾长征，特战三队。手环做不了假，系统记着呢。\"","\"系统。\"我说，\"系统也记着我转给猴子的五个积分。\"","他笑了：\"那系统还真记着。\"","我回头看老周。老周点了根烟，吸了一口，说：\"他说得对，打不动了。这年头，有枪的国家机器，比什么都值钱。\"","\"周叔。\"","\"去。\"老周说，\"把电拿回来。拿回来，灯亮了，人心里就有底了。\"","李瀚没说话，把步枪往肩上一挂。","\"走吧。\"我说，\"带路。\"","陶一鸣从车厢里探出头：\"去哪？\"","\"水电站。\"顾军官说。","\"修什么的？\"","\"发电机组。\"","陶一鸣想了想：\"我修过。\"","车队往西开。路过一个山口的时候，我看见山脊后面，有一排高压线塔，塔上的线垂下来，断了一截，在风里晃。","\"电断了多久了？\"我问。","\"从爆发那天起。\"顾军官说，\"电网是连环的，一个点瘫，全线瘫。恢复一座电站，只能亮一小片。可亮一小片，就够让人相信，国家还在。\"","他把车窗摇上去，又说：\"对了，军功积分，任务期间翻倍。\"","我低头看了一眼自己的手环。屏幕上还是那个数字：七。","\"不够花。\"我说。","\"打完了就够花了。\"他说。"]},{"title":"第二十三章 水电站","body":["水电站藏在湘西的峡谷里。","车翻过三道山梁，才看见大坝。坝身灰白色，横在两山之间，泄洪道干着，坝顶的厂房空荡荡的。顾长征说，这座站装机不小，恢复它，能带起半个湘西的电网。","侦察组先上。","无人机贴着峡谷飞了一圈，回来的热成像显示：厂房里有东西，坝体检修廊道里也有，数量不少。机器狼进不去检修廊道，梯子太窄。","\"轮到你。\"顾长征对我说。","残影来得很慢。我盯着坝体看了一会儿，影子浮起来：检修廊道里，一个东西蜷在闸门控制柜后面，等我们进去。它比普通丧尸大一号，爪子抠着柜门。","\"闸门控制柜后面。\"我说，\"一个，大号的。\"","\"还有呢？\"","\"厂房里三层，每层都有，都不多。\"","顾长征点头。特战小组分成三队，从三个入口进去。李瀚跟着第一队，我跟第二队。陶一鸣留在坝顶，等电控室清出来。","枪声在廊道里响了二十分钟。","第一队清出厂房一层，第二队清出检修廊道。那个大号的，果然在闸门控制柜后面，扑出来的时候被两把步枪顶回去，又补了一梭子。它倒下去的时候，爪子把控制柜的门抓出一道印。","\"厂房里还有吗？\"顾长征问。","\"没有了。\"我说。","\"电控室。\"","陶一鸣背着工具包进去，半个小时后出来，手上全是油：\"机组没大伤，就是没人维护，轴承锈了。修能修，得三天。电控室能先亮灯。\"","\"先亮灯。\"顾长征说。","傍晚，厂房顶上那盏探照灯亮了。","光柱扫过峡谷，扫过坝面，扫过山下那条公路。公路尽头，有车灯跟着亮起来，是山下据点的人，看见灯，往这边开。","\"看见没有。\"顾长征说，\"一盏灯，比一个连的动员令都好使。\"","他看了我一眼：\"你要找的人，我让人查了。易爽，最后记录在火种前站。你爸妈，防疫检查站之后，往北去了。\"","\"往北？\"","\"河谷方向。\"他说，\"跟火种前站，一个方向。\"","我站在坝顶，看着那盏灯，没说话。","夜里，残影来了。","它给我看的是一瞬间：检修廊道深处，水线以下，有什么东西扒着闸门往上爬。水淋淋的，不止一个。","\"廊道！\"我抓起对讲机，\"水线下面有东西，往闸门爬！\"","对讲机里静了一秒。然后顾长征的声音：\"闸门组，撤！\"","闸门控制柜后面，两个工程师刚被拽出来。水线下的东西翻上来的时候，廊道里已经没人了。它们扑了个空，在灯光下站了一会儿，又沉回水里。","陶一鸣蹲在坝顶，看着那盏灯，说：\"这地方，水里的比陆地上的多。\"","\"那也得守。\"顾长征说，\"灯亮了，就不能灭。\""]},{"title":"第二十四章 产线","body":["水电站的机组修了三天。","第三天傍晚，厂房里的发电机转起来，坝顶的灯亮成一片。山下据点的广播连夜改了词：供电恢复，照明按积分优先。","顾长征没让我们歇。第二单在贵阳方向，一座无人机厂，自动化产线，战前专门给蜂群供过货。","\"厂子里没人。\"他说，\"机器还在，料库还在。就差人把它开起来。\"","陶一鸣坐在车厢里，把一张电路图摊在膝盖上看了很久：\"产线我熟。无人机我修过，机器狼也修过。\"","\"那你去开。\"顾长征说。","厂区比设备厂大得多。围墙完整，铁门锁着，钥匙在值班室。无人机先进去探了一圈，回来报：厂区干净，没有活物，也没有尸体。","\"太干净了。\"李瀚说。","\"干净还不好？\"","\"爆发那天，这厂子应该在运转。\"李瀚说，\"怎么也得留下点什么。\"","值班室里，桌上有一杯茶，茶早就干了，杯底积着一圈茶垢。椅子拖开一半，像人刚站起来。抽屉开着，里面没有钥匙。","残影来的时候，我正盯着那杯茶。","它给我看的是一瞬间：厂区北边的仓库，卷帘门半开着，门后面堆着几十个铁笼子，笼子里空着，笼门全开。","\"北仓库。\"我说，\"卷帘门半开，里面全是空笼子。\"","顾长征带着人过去。卷帘门拉开，灯光照进去，几十个铁笼子码成两排，笼门全开，地上有干涸的暗红色东西，拖痕从笼子门口一直拖到后门。","\"狗笼？\"有人问。","\"不是狗笼。\"陶一鸣蹲下去，摸了摸笼门上的锁扣，\"这尺寸，是机器狼的充电笼。\"","\"机器狼呢？\"","\"跑了。\"陶一鸣说，\"爆发那天，产线自己在跑。笼门是断电自动开的，它们自己出去了。\"","顾长征沉默了一会儿：\"机器狼会自己找路回家吗？\"","\"不会。\"陶一鸣说，\"可它们会自己找电源。\"","当天下午，我们在厂区后山找到了它们。","三十几台机器狼，蹲在一座废弃的变电站里，光电头朝外，排成一个圈。枪管都朝外，像一群守着窝的狼。听见动静，最外面那台抬起头，光电头亮了亮，又暗下去。","\"没子弹了。\"陶一鸣看了一眼，\"弹药架空了。\"","\"能修吗？\"顾长征问。","\"不用修。\"陶一鸣走过去，拍了拍最外面那台的背，\"它们自己守着电，守了三个月。接上产线的充电笼，喂饱了，就能带走。\"","当晚，要塞的庆功宴设在礼堂。","长条桌上，摆着白面馒头、罐头、一盆白菜汤。桌子最头上，多了一盘菜，盖着盖子。顾长征掀开盖子，里面是一盘切好的牛肉。","\"牛肉。\"他说，\"特战队的，一人一片。\"","陶一鸣看着那盘牛肉，没动：\"我三年没吃过牛肉了。\"","\"现在可以吃了。\"顾长征说，\"打下来的，就该吃。\"","我夹了一片，放进嘴里。牛肉是咸的，老得嚼不动，可它是牛肉。","散席的时候，顾长征把我叫到一边，递给我一个文件袋：\"答应你的，查到了。\"","里面是几张纸。易爽，火种前站，观察记录：反应速度A，血样标记阳性，转送日期，后面跟着一行小字：\"合格者，优先登船序列。\"","\"登船？\"我问。","顾长征没回答。他看着我，过了一会儿说：\"你也是B组。你知道的，比我多。\"","\"我不知道登船。\"我说。","\"那就当它不存在。\"他说，\"你先把电保住。灯亮了，别的都好说。\""]},{"title":"第二十五章 鹰眼","body":["8月26日，特战三队来了一个新队员。","女的，三十出头，短发，右眼上戴着一片浅灰色的镜片。顾长征介绍：\"贵阳要塞来的，代号鹰眼。她的眼睛跟你的眼睛，是反着长的。\"","\"怎么反？\"","鹰眼摘下镜片。她右眼的瞳孔是竖的，像猫。","\"我能看见人堆里的恶意。\"她说，\"隔着墙也能。\"","我盯着她看了两秒：\"疼吗？\"","\"看多了疼。\"她说，\"跟你们一个毛病。\"","傍晚，哨塔报告山下来了车。鹰眼趴在墙头看了一会儿，说：\"车里有七个，两个带枪，五个空的。带枪的想打我们。\"","顾长征派人下去。那两个带枪的果然摸到墙根，被缴了械，剩下的五个是逃难的，抱着孩子，蹲在路边不敢动。","\"准。\"李瀚说。","\"代价呢？\"我问。","鹰眼揉了揉眼睛，镜片底下，那只竖瞳里有血丝：\"看一次，疼半天。连着看，就瞎。\"她顿了顿，\"可瞎了，也值。\"","夜里，顾长征把我们叫到指挥室。桌上摊着一张地图，标着下一个收复点。","\"兵工厂。\"他说，\"在河谷北边。里面存着弹药复装的料，铜、铅、发射药。拿下它，前线的子弹能续上。\"","\"又是河谷。\"我说。","\"河谷是命脉。\"顾长征说，\"水电站、兵工厂、粮库、火种前站，全在河谷沿线。\"","\"火种前站是什么？\"鹰眼忽然问。","顾长征没接话。他看了我一眼，又看了她一眼，说：\"你们俩的眼睛，是这趟任务最值钱的东西。别的，别问。\"","夜里，我躺在帐篷里，听着远处的发电机声。","陶一鸣坐在门口，擦一台机器狼的光电头。他擦得很慢，一下，一下。","\"你在厂里守了三个月。\"我说，\"图什么？\"","\"图它还在转。\"他说，\"机器在，人就还能回来。\"","\"你妻女……\"","\"埋在后山。\"他说，\"我回去过一趟，给她们烧了纸。纸是湿的，烧不旺。\"他停了一下，\"可她们知道我回来了。\"","我躺下去，看着帐篷顶。","残影来了。","它给我看的是一瞬间：河谷北边的兵工厂，厂房顶上站着一个东西，弓着背，两个包从后背鼓起来。它没看厂房，它看着我们来的方向。","它在等我们。","我睁开眼，天还没亮。","\"河谷北边，\"我对顾长征说，\"兵工厂房顶上，有个大号的。它在等。\"","顾长征看着地图，看了很久，说：\"那就让它等。我们绕后路。\"","\"绕不过。\"鹰眼说，\"我能感觉到，河谷两边，都有东西。它们不是散尸，是成群的，有头领。\"","帐篷里安静了一会儿。","顾长征把地图折起来，说：\"天亮出发。硬打。\"","\"打完了呢？\"我问。","\"打完了，\"他说，\"你要找的人和答案，都在河谷里。\""]},{"title":"第二十六章 黑市与内鬼","body":["兵工厂是硬啃下来的。","房顶上那个大号的，果然在等。它没等来侦察组，等来的是从后山摸上去的爆破组。一声闷响，厂房顶塌了半边，它跟着瓦片一起摔下来，摔进厂房里的尸堆里，没再起来。","河谷两边的成群尸潮，被机器狼连和蜂群犁了三遍，才算压住。","清点的时候，顾长征说：\"弹药复装线还能用，铜和铅够打半年。发射药少，得从别处调。\"","\"调？\"我问。","\"要塞之间换。\"他说，\"弹药换粮食，粮食换药品。\"","晚上，我回要塞补给。","要塞比收容点大得多，街上有人，有灯，有广播。可街角蹲着的人，手腕上的手环都亮着同一个颜色，灰的，那是积分冻结的标记。","陶一鸣在旁边说：\"冻结的，是还不上账的。\"","\"还不上账会怎样？\"","\"送去清障队。\"他说，\"清障队就是拿命换积分。\"","我蹲在一个灰手环的老人旁边，问他借火。他看了我一眼，从兜里摸出一张纸券，卷成烟的样子递过来：\"用这个卷，比手环干净。\"","纸券。猴子的那句话，在这里应验了。","\"这东西哪来的？\"我问。","\"黑市。\"他说，\"一张抵一个积分，系统查不到。你要多少？\"","\"我不要。\"我说，\"我就问问，谁在发它。\"","他看了我一眼，把纸券收回去，没再说话。","夜里，有人敲我的帐篷。","是个通信兵，年纪不大，手腕上的手环上缠着一圈黑线。他进来，先没说话，把一张纸券放在桌上。","\"高连长让我给你的。\"他说。","我愣住：\"高连长？\"","\"他在湘中二道撤下来以后，一直在要塞之间走动。\"通信兵说，\"他让我告诉你：手环积分冻结名单，就是弃子名单。系统判你活不了，你就被划出去，当饵，当苦力，当补给。\"","\"谁判的？\"","\"天枢。\"他说，\"高连长说，天枢在筛人。它筛出来的'合格者'，送火种前站；筛不出来的，就地消化。\"","我盯着那张纸券，半天没说话。","\"高连长还让我告诉你，\"通信兵压低声音，\"下一个收复点，别去。那地方打开以后，不是产线，是筛选站。圈叶标志的，都是。\"","\"圈叶标志？\"","\"墙角的绿圈，圈里一片叶子。\"他说，\"你见过。\"","我见过。三号站的走廊尽头，墙角印着一个圈，圈里一片叶子。","通信兵站起来，把纸券收进口袋：\"话带到了。信不信，你自己掂量。\"","他走后，陶一鸣从帐篷外进来，手里拿着一台机器狼的充电模块：\"怎么了？\"","\"有人让我别去下一个点。\"我说。","\"去吗？\"","\"去。\"我说，\"我要看看，圈叶标志后面是什么。\"","陶一鸣没劝。他把充电模块放在桌上，说：\"那我先把机器狼喂饱。\""]},{"title":"第二十七章 底线","body":["下一个收复点，在河谷南边。","地图上标的是\"物资中转站\"，可到了外围，我看见墙角的圈叶标志。绿漆，很淡，跟三号站走廊尽头那个一模一样。","顾长征站在指挥车前，看一份刚到的电文，看了很久。","\"任务变了。\"他说。","\"什么？\"","\"中转站东边十五公里，有个收容点。\"他说，\"积分为负的人，都集中在那。上面命令：收容点划为弃子，把尸潮从河谷引过去，给中转站清出窗口。\"","我看着他：\"把人当饵？\"","\"命令就是命令。\"他说。","\"我不干。\"","\"你不是来干的。\"他说，\"你的任务是侦察。弃子的事，是工兵的事。\"","\"我看见了。\"我说，\"弃子名单，我见过。灰手环的人，系统判他们活不了，就划出去当饵。\"","顾长征沉默了一会儿：\"天枢算过。保中转站，能救三千人。弃一个收容点，几百人。算得过来。\"","\"算得过来？\"我说，\"那几百人里，有孩子。\"","\"有孩子。\"他承认，\"可打仗，就是算账。\"","\"那易爽呢？\"我说，\"她在火种前站，是不是也算过账？她反应速度A，合格者，优先登船。你们算的什么账，让她上船，让我上阵？\"","顾长征没回答。","晚上，第二份电文到了。","这次是加密的，顾长征看完，把电文纸烧了。他把我叫到指挥车后面，声音压得很低：\"上面点名，要你的血样，还有易爽的档案副本。\"","\"我的血样？\"","\"B-5。\"他说，\"你免疫，你反应快，你档案里写着：血清原型疑似。火种那边要复检。\"","\"我要是说不呢？\"","\"你说了不算。\"他说，\"上面说，这是任务的一部分。\"","我站在指挥车后面，看着河谷的方向，看了很久。","\"顾队长。\"我说，\"你替天枢算过账，那你替我算算：我这一路，从桥头活到这儿，靠的是猎眼，还是靠他们想抽我的血？\"","他看着我，没说话。","\"我不去。\"我说，\"收容点不去，血样不抽。你们要打，就自己打。\"","\"徐乐。\"","\"顾长征。\"我说，\"你也是人。你也有手环。哪天系统判你活不了，你也会在名单上。\"","他攥着拳头，站了很久。","\"明天天亮前，你带着你的人走。\"他说，\"我当你没来过。\"","\"你呢？\"","\"我执行命令。\"他说，\"执行完了，我再找你。\"","我转身走进帐篷。","陶一鸣已经收拾好了包，机器狼蹲在帐篷口，光电头亮着。","\"走？\"他问。","\"走。\"我说。","\"李瀚和阿宁呢？\"","\"我去叫他们。\"我说，\"天亮之前，离开河谷。\""]},{"title":"第二十八章 失控样本","body":["天亮前，我们离开了河谷。","车开上国道的时候，要塞的广播忽然响了。女声，一个字一个字地念：\"编号B-5，徐乐，拒不执行任务，擅自脱离部队，现列为失控样本。各地据点见之即报，不得收留。\"","李瀚坐在副驾，听着广播，骂了一句。","\"失控样本。\"阿宁在后排说，\"连个通缉犯都不算，算样本。\"","\"他们想要我的血。\"我说。","\"你给不给？\"","\"不给。\"我说，\"我自己的血，我自己说了算。\"","车没往南，也没往北。老周把车拐进一条乡道，在树荫里停了两个小时。广播又响了一遍，还是那个女声，还是那四个字：失控样本。","\"电台是通的。\"陶一鸣说，\"三级网，干线没断。这条消息，全国都听得到。\"","\"那正好。\"我说，\"省得一个个解释。\"","中午，我们在一个废弃的村口停下。李瀚下去找水，回来的时候，手里拿着一张纸，卷着，用橡皮筋扎着。","\"信箱里捡的。\"他说，\"上面写着你的名字。\"","我拆开。纸上只有一行字：\"河谷北，电站废址，明晚。有人带你去火种前站。\"","没有署名。纸是糙的，字是拿铅笔写的，压得很深。","\"谁的？\"老周问。","\"高连长。\"我说，\"除了他，没人知道我们会走这条路。\"","第二天傍晚，我们到了河谷北的电站废址。","断壁残垣，发电机锈成一堆。夕阳照在废墟上，拉出很长的影子。一辆蒙着灰的卡车停在厂房里，车上下来一个人，穿着便衣，脸上有一道旧疤。","\"猎眼？\"他问。","\"是我。\"","\"高连长让我接你。\"他说，\"火种前站，你去不去？\"","\"去。\"我说，\"易爽在那儿。我爸妈，也在往那儿走。\"","\"那儿不是好地方。\"他说，\"进去了，想出来就难了。\"","\"我进去，不是想出来。\"我说，\"我是想带人出来。\"","他看了我一会儿，拉开卡车后门：\"上车。\"","卡车往河谷深处开。夜里，路边的灯越来越少，最后只剩车灯。车灯扫过路牌的时候，我看见了三个字：","火种前站。","前方，大坝的轮廓从黑暗里浮出来。坝顶亮着灯，厂房亮着灯，像一座不夜城。","\"看见没有。\"开车的人说，\"电最足的地方，就是这儿。\"","我盯着那座大坝，没说话。","残影来了。","它给我看的是一瞬间：大坝底下，地下层，一扇铁门后面，一张病床。床上躺着一个人，手腕上系着绿带子，床头挂着一串编号。","B-5。","那是易爽的病房，还是我的？","我攥着拳头，没有告诉任何人。"]},{"title":"第二十九章 雇佣兵","body":["火种前站没让我们进去。","卡车在坝外三公里被拦下。便衣下车，跟岗亭里的人说了半天，回来的时候脸色不好看：\"口令换了。进不去。\"","\"那易爽怎么办？\"我问。","\"等着。\"他说，\"前站在筛人，每隔几天放一批进去。等广播通知。\"","我们在坝外的山坡上扎了营。那几天，广播里全是好消息：","\"西南植物工厂实现突破，无土栽培量产，粮食产量提升三倍，不依赖自然光照。\"","\"南方战区收复第三座水电站，区域电网恢复。\"","\"日本方向出现大规模船团，正在接近东海，我海军已进入警戒状态。\"","陶一鸣蹲在火堆边，听着广播，说：\"粮食不愁了，电不愁了。愁的是船。\"","\"船是来干嘛的？\"李瀚问。","\"逃命的。\"我说，\"他们那边，比我们这边烂得更早。\"","\"那他们是来打我们的？\"","\"不知道。\"我说，\"船上有人，就有感染。有人，就会开枪。\"","那几天，高连长的线人断断续续传话来：火种前站在做登船前的筛选，易爽的编号在第一批名单上。","\"登船？\"我问，\"船在哪儿？\"","\"云层之上。\"线人说，\"高连长说，你迟早会明白。\"","我在山坡上等了五天。","第六天，顾长征找到了我们。","他一个人来的，没带兵，手环上的军功标记亮着，可他脸上没有军人的样子。他坐在火堆边，先抽了半根烟，才开口：\"河谷那单，我执行了。收容点弃了，尸潮引过去了，中转站保住了。\"","没人接话。","\"那天晚上，\"他说，\"我在弃子名单里，看见了我弟弟的名字。\"","火堆噼啪响了一声。","\"天枢算过账。\"他说，\"算下来，我弟弟活不了。\"","\"你信吗？\"我问。","他摇了摇头，又点了点头：\"我不知道信什么了。\"","\"所以你现在来干什么？\"陶一鸣问。","\"请你们帮个忙。\"顾长征说，\"东边打起来了。日本船团冲过第一道封锁线，舟山要塞顶不住了。海军缺人，缺眼睛，缺能看见船底下东西的人。\"","\"我是陆军。\"我说。","\"船底下没有陆军。\"他说，\"可船底下有东西。水里的东西，比陆地上的多。\"","我看了陶一鸣一眼。他擦着机器狼的光电头，说：\"机器狼下水不行。可我能在岸上修。\"","老周把烟掐了：\"舟山，多远？\"","\"三天。\"顾长征说。","\"去。\"老周说，\"灯已经亮了，别让它灭。\"","我站起来，看着河谷方向。大坝的灯还亮着，像一座不夜城。","\"易爽呢？\"我问。","\"她一时半会儿走不了。\"顾长征说，\"登船序列，没那么快。你先把东边的船堵住，再回来接她。\"","我攥了攥拳头。","\"走。\"我说，\"去舟山。\"","天亮的时候，车队往东开。后视镜里，火种前站的灯光越来越远，最后缩成一个点，消失在晨雾里。"]},{"title":"第三十章 舟山","body":["舟山跟我想象的不一样。","没有灯火通明的城市，只有码头、渔港、和一圈一圈的铁丝网。海面上，渔船改装成巡逻艇，船头焊着钢板，架上机枪，在浪里一颠一颠。","接待我们的是海军的一个参谋，姓方，四十多岁，皮肤晒得跟铁皮一样。他看了顾长征的介绍信，又看了我一眼：\"猎眼？陆军的人？\"","\"看东西的。\"我说。","\"看陆地的，看不了海。\"他说。","\"试试。\"","傍晚，方参谋带我们上了一条巡逻艇。艇开出港湾，浪头一个接一个打上甲板。我趴在船头，盯着水面。","残影来得很慢。","海比陆地难。陆地上的影子，是贴着地面的；海里的影子，是贴着水底的，隔着几十米的水，模模糊糊，像隔着一层脏玻璃。","\"有东西。\"我说，\"船底下，左舷，三十米外，水底。\"","方参谋没说话。他让艇长打亮探照灯。光柱扎进水里，照出一片浑浊。浑浊里，有什么东西翻了个身，沉下去了。","艇上安静了一会儿。","\"你看得见水底？\"方参谋问。","\"看得见。\"我说，\"模模糊糊的。\"","\"够了。\"他说，\"船上的人，十个有八个看不见。\"","夜里，方参谋把地图摊开。海图上，舟山群岛像一串珠子，撒在东海里。","\"日本船团，已经过了第一道封锁线。\"他说，\"几千条船，武装的，民用的，全混在一起。船上的人，有一半是感染者，或者带着感染。\"","\"那怎么打？\"","\"不能打。\"他说，\"打，就是屠杀难民。不打，他们登陆，就是引一场新的疫病。\"","\"那怎么办？\"","\"检疫。\"他说，\"船团进来，一条条检疫。合格的靠岸，不合格的，隔离在海上。\"","\"他们愿意吗？\"","\"不愿意。\"方参谋说，\"所以需要你这样的人。看清楚哪条船是干净的，哪条船是烂的。\"","我站在海图前，看着那片蓝，半天没说话。","第二天，第一条船来了。","是一条渔船，锈迹斑斑，甲板上挤满了人。他们举着白布，摇着，喊着什么，听不清。船靠近检疫线的时候，我盯着甲板看了很久。","\"船上干净。\"我说，\"至少甲板上，没有变了的。\"","检疫艇靠上去，消毒，登记，放行。船上的孩子趴在栏杆上看我们，眼睛很亮。","傍晚，第二条船来了。","我盯着它看了很久，残影浮起来：船舱里，黑暗里，有什么东西一层一层地堆着，像一仓库的货，在等着开门。","\"这条不能进。\"我说。","\"确定？\"","\"确定。\"我说，\"船舱里全是。它们还没出来，因为门是锁着的。\"","检疫艇没有靠上去。船上的人举着白布，喊着，摇着。可我们没放行。","夜里，那条船的舱门开了。","海面上传来枪声，先是零星的，然后连成一片。探照灯扫过去，船上的东西一层一层翻进海里，顺着洋流，往舟山漂。","方参谋站在船头，看着那片海，说：\"你救了半条岛链。\"","\"我没救。\"我说，\"我只是看见了。\"","\"看见了，就是救了。\"他说，\"看不见的，都死在水里了。\"","海风咸得发苦。我站在甲板上，想起河谷，想起火种前站，想起易爽。","这世界，现在靠一双眼睛，一条一条地分活人。","我不知道这算不算救人。"]},{"title":"第三十一章 船团","body":["日本船团是在九月底来的。","第一天，海平面上先冒出一根桅杆。然后是第二根，第三根。到了下午，整条海平线都站满了船，大船小船，货轮渔船，拖着一道道黑烟，像一群往岸上爬的铁兽。","方参谋举着望远镜，看了很久：\"几千条船。他们把所有能浮的东西，都开出来了。\"","\"他们想干什么？\"","\"想活。\"他说，\"他们的岛上，已经没有安全的地方了。\"","船团停在检疫线外。广播用日语和中文轮着喊：接受检疫，按船序进入，不得擅自靠岸。","第一艘船靠上来的时候，我看见甲板上站着的人。老人、孩子、孕妇，举着白布，脸上没有表情。他们很安静，安静得让人发慌。","\"这条干净。\"我说。","检疫艇靠上去。消毒，登记，引航。船上的孩子趴在栏杆上看我们，眼睛很亮。","第二天，一艘货轮靠上来。","货轮很大，吃水很深，甲板上空空的，没有白布，没有喊声。我盯着它看了很久，残影浮起来：船舱里，黑暗里，有什么东西一层一层堆着，像一仓库的货。","\"这条不能进。\"我说。","\"确定？\"方参谋问。","\"确定。\"","检疫艇没有靠上去。货轮在原地停了一会儿，忽然转向，朝检疫线的缺口冲过去。","\"拦！\"方参谋喊。","岸防导弹的尾焰在夕阳里亮了一下。货轮中段炸开，断成两截，缓缓下沉。船舱里的东西翻进海里，顺着洋流漂。","海面上安静了半个小时。","然后，船团动了。","几百艘船一起动，像被惊醒的鱼群，朝检疫线的所有缺口涌去。武装船混在民用船里，机炮声和枪声响成一片。","\"他们疯了！\"有人喊。","\"他们没疯。\"方参谋说，\"他们知道，检疫不过去，就是死在海上。\"","当天夜里，船团突破了第一道封锁线。","舟山的灯全部亮起来。岸防阵地、雷达站、军港，一条火线沿着岛链拉开。海面上，爆炸的火光一团一团亮起来，像有人在海上放烟花。","我趴在阵地上，看着那片海，残影一次次浮起来。","\"左舷，三百米，水下有东西往岸上爬。\"","\"正前方，一条快艇，船头有机枪，要冲码头。\"","\"西北角，两条渔船靠上来了，甲板上有变了的。\"","方参谋站在我旁边，一条一条报给火力点。枪声和炮声从黄昏响到天亮。","天亮的时候，海面上漂着木板、油污、和白布。白布在浪里翻着，一片一片，像葬礼上撒的纸钱。","\"他们还是冲上来了。\"有人小声说。","\"冲上来多少？\"方参谋问。","\"南边，两个点。\"我说。","方参谋看着海图，半天没说话。","\"把第二道线拉起来。\"他说，\"海上守不住，就守岸上。\"","我攥着望远镜，看着南边那两个登陆点。","那是我第一次看见，几百万人想活命，是什么样子。"]},{"title":"第三十二章 东海大战（上）","body":["南边那两个登陆点，是硬啃下来的。","海军陆战队在滩头打了三天。第三天傍晚，滩头清空，可舟山要塞的南半段，已经烧成一片焦黑。军港里沉了两条护卫舰，桅杆斜出水面，像折断的手指。","方参谋站在防波堤上，看着那两条沉船，说：\"舰没了，人还在。人还在，码头就还能用。\"","夜里，指挥部接到一份情报：日本船团残部里，有一艘医疗船，船上有一个专家，姓山本，研究过这个病毒的血清。","\"专家？\"顾长征问，\"日本人，能信？\"","\"信不信，先弄到手。\"方参谋说，\"我们的血清在反推，缺一个关键步骤。他在东京做过实验，有数据。\"","\"船在哪？\"","\"漂在舟山以东四十海里的水域，挂着白旗。\"方参谋说，\"可那片水域，现在是尸海。船周围，全是漂过来的东西。\"","\"我去。\"我说。","方参谋看着我：\"你下过海吗？\"","\"没有。\"","\"那你去干什么？\"","\"看。\"我说，\"你们看不见水下的，我看得见。\"","快艇在天亮前出发。","海面上雾很大。快艇关了灯，贴着浪走。我趴在船头，眼睛盯着水面。残影一次次浮起来：水下，什么东西在跟着我们，不远不近，像一群等食的鱼。","\"后面有东西。\"我说，\"三条，不，五条。跟着，没上来。\"","\"别停。\"艇长说，\"停了就完了。\"","医疗船在雾里露出轮廓。","船身涂着白漆，红十字符号，烟囱里冒着黑烟。甲板上有人挥手，用日语喊什么。快艇靠上去的时候，我看见船舷边挂着一条条绳子，绳子上系着空救生圈。","\"专家在哪儿？\"顾长征问。","船上的人领我们下去。船舱里，几十个人挤在一起，发烧的、受伤的、裹着毯子的。山本专家坐在角落里，戴着一副圆眼镜，手里攥着一本笔记本。","\"你们要血清数据？\"他用生硬的中文问。","\"要。\"我说。","\"数据可以给。\"他说，\"可我得知道，你们拿它干什么。\"","\"救活人。\"我说。","他看着我的眼睛，看了很久，把笔记本递过来：\"我做了三年。数据全在里面。你们的人，比我们强，应该能接上。\"","我们带他上快艇的时候，医疗船的船身忽然晃了一下。","水里，有什么东西扒住了船底。","\"快走！\"我喊。","快艇猛地蹿出去。身后的医疗船，船身越晃越厉害，最后缓缓倾侧。甲板上的人往水里跳，水里翻起白沫，白沫里有什么东西在动。","山本专家趴在快艇尾，看着那艘船沉下去，一句话没说。","回到舟山的时候，天已经亮了。","方参谋接过笔记本，翻了几页，抬头看我：\"你知道这上面写的什么？\"","\"什么？\"","\"他们那边的血清，只对空气免疫的人有效。\"他说，\"血液感染，无解。\"","我站在防波堤上，看着海面。医疗船沉下去的地方，水面上还漂着白布。","\"无解。\"我说，\"那易爽的血，算什么？\"","方参谋没回答。","海风把白布吹得翻了个面，又翻回来。"]},{"title":"第三十三章 东海大战（下）","body":["东海大战的结局，是惨胜。","日本船团的主力被拦在岛链外，武装船被击沉大半，剩下的掉头往北，消失在雾里。可北边传来消息：船团残部在山东和江苏沿海抢滩，十几个登陆点同时上岸。海上疫区，变成了海岸疫区。","\"他们还是会活的。\"有人看着北边的海图说。","\"会活的，才能活。\"方参谋说，\"死的，都在海里。\"","舟山保住了，可半座要塞是废墟。","广播里，女声通报战损：护卫舰两艘，岸防阵地七个，阵亡名单念了整整十分钟。念到一半，声音断了一下，又接着念。有人听着听着，蹲下去，把头埋进膝盖。","夜里，通信兵跑进指挥部：\"武汉方向，干线断了。\"","方参谋抬头：\"断多久了？\"","\"三个小时了。\"通信兵说，\"短波也收不到。整个中部，静了。\"","指挥部安静下来。","\"武汉要塞，是干线枢纽。\"方参谋说，\"它要是没了，全国的电台，一半是哑的。\"","\"它不会没。\"我说。","\"你怎么知道？\"","\"我不知道。\"我说，\"可我认识的一个人，在武汉。\"","我说的是回声。","那次在要塞联席会议的电话里，我只听过她的声音。她负责武汉的干线中继，声音很轻，报数字的时候一个字都不差。她说：\"回声，武汉，中继正常。\"","现在，中继断了。","三天后，断断续续的消息传过来：武汉要塞内部出了事。有人打开了东边的闸门，尸潮涌进城；有人切了干线的电，三个小时没恢复。火种派和反火种派在城里打了一仗。","\"内鬼。\"顾长征说，\"肯定是内鬼。\"","\"谁的内鬼？\"","\"火种的。\"他说，\"武汉是中转站，火种要控制它，把登船序列的人往北送。反火种派要截住它。\"","\"截住了吗？\"","\"不知道。\"他说，\"城里还在打。\"","我站在电台前，一遍一遍调武汉的频段。","全是杂音。","第七天，杂音里忽然挤进来一个声音，很轻，带着电流声：","\"回声。武汉。中继……恢复了。\"","声音停了一下，又说：","\"城东没了。城西还在。\"","我攥着耳机，听着那阵电流声，半天没动。","顾长征走过来，看了一眼频率表，说：\"武汉，还活着。\"","\"活着。\"我说，\"可它被切成了两半。\"","广播里，女声开始报新的伤亡名单。念到武汉的时候，声音比平时慢了一点。","天枢也会难过吗？","我关掉电台，没再想。"]},{"title":"第三十四章 武汉半失守","body":["武汉的消息，一天比一天少。","先是广播里不再报它的伤亡，然后连地名都不提了。三级网里，武汉的节点还挂着，可没有人在里面说话，像一间亮着灯的空屋子。","\"干线没断。\"顾长征看着通信地图说，\"断的是人。\"","\"什么意思？\"","\"武汉的工程师，要么走了，要么死了。\"他说，\"设备还开着，可没人维护，没人应答。中继站一盏灯亮着，底下坐着一个死人，谁也听不见。\"","半个月后，回声的频段又响了一次。","声音很轻，比上次更累：\"回声。武汉。城西的闸门，还守着。\"","\"你一个人？\"我问。","\"还有七个人。\"她说，\"一个排，剩七个。\"","\"撤吧。\"","\"撤不了。\"她说，\"中继在这儿，全国的电台才能通。我撤了，武汉就真没了。\"","\"那你守到什么时候？\"","\"守到有人接替。\"她说，\"或者守到没电。\"","我站在舟山的电台前，听着那阵电流声，没说话。","陶一鸣走过来，说：\"机器修得完，人修不完。\"","\"嗯。\"","\"你在想什么？\"","\"我在想，\"我说，\"火种为什么要把武汉切开。\"","\"为了登船。\"陶一鸣说，\"登船的人，要往北送。武汉卡在中间，切一半，留一半，正好让船队过。\"","\"那城西守着的七个人呢？\"","\"他们挡的，就是船队。\"他说，\"可他们不知道，自己挡的是什么。\"","夜里，我收到一份密报。","纸券传的，通信兵塞在我的帐篷里。上面写着：火种前站登船序列已启动，第一批名单公布。名单上第一个名字，是易爽。","下面还有一行小字：S级血清原型，优先登船，舱位已备。","S级血清原型。","我攥着那张纸，指尖发白。","\"我不是样本。\"我说，\"她也不是。\"","顾长征站在帐篷口，没进来：\"你要回去？\"","\"回河谷。\"我说，\"在她上船之前，把她接出来。\"","\"武汉拦在中间。\"他说，\"东边的路，全是疫区。\"","\"那就绕。\"我说，\"南边走，贵州，昆明，翻山过去。\"","\"那是战区纵深。\"他说，\"你一个人，过不去。\"","\"不是一个人。\"我说。","帐篷外，李瀚把步枪扛在肩上。老周把车发动了。阿宁背着急救包。陶一鸣蹲在机器狼旁边，一台一台喂电。","顾长征看着我们，看了很久。","\"我也去。\"他说。","\"你是军官。\"","\"我弟弟死在弃子名单上。\"他说，\"我不是军官了，我是一个想找答案的人。\"","天亮的时候，车队往南走。","后视镜里，舟山的灯一盏一盏灭下去。海风追着车尾，卷着咸味。","我摸了摸口袋里那张纸。","易爽，等我。"]},{"title":"第三十五章 归途","body":["往南的路，比想象中难走。","出了舟山，沿海的公路断断续续，有的被海水淹了，有的被炸断了。车队绕进山区，走盘山道。山上冷，风从垭口灌进来，带着霜味。","\"入冬了。\"老周说。","广播里，北边的消息一条接一条：","\"沈阳要塞击退船团残部与尸潮联合攻势，我军依托严寒窗口期转入反攻。\"","\"重庆、贵阳要塞完成动员，南部防线进入冬季状态。\"","\"植物工厂量产第三批，粮食储备充足，请各据点按积分领取。\"","陶一鸣听着广播，说：\"粮食够了，电够了，子弹也够打半年了。\"","\"那还怕什么？\"李瀚问。","\"怕时间。\"陶一鸣说，\"这些够撑过冬天。冬天之后，尸潮会少，可人会多。人多，就得分。\"","分什么，他没说。","翻过一道垭口的时候，车队停下来。","路边有一块路牌，歪着，上面的字被风雨泡得发白。我蹲下去，用手抹掉泥，看见三个字：青石镇。","\"绕到这儿来了。\"老周说。","我站在路牌边上，看着山下的镇子。","镇口的老槐树倒了，横在路中间。理发店的招牌还挂着，被风吹得哐哐响。街上没有人，也没有尸体，只有风，卷着枯叶，从街这头刮到街那头。","\"进去看看？\"阿宁问。","\"不了。\"我说，\"我爸妈不在里面了。\"","\"在哪儿？\"","\"河谷。\"我说，\"防疫站之后，他们往北，去了火种前站。\"","顾长征站在我旁边，看着那片镇子，说：\"你爸妈，是被火种带走的。\"","\"我知道。\"","\"火种带走的人，\"他说，\"不是当人用的。\"","\"我知道。\"","\"你还要去？\"","\"去。\"我说，\"他们是我爸妈。\"","夜里，我们在镇外的山坡上扎营。","
