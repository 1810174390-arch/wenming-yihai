风很大，火堆压得很低。我坐在火堆边，把那张登船名单拿出来，又看了一遍。","易爽，第一批，S级血清原型。","我把纸折好，塞回口袋。","残影来了。","它给我看的是一瞬间：河谷大坝，地下层，铁门后面。易爽坐在床边，手腕上系着绿带子，床头挂着一串编号。她抬起头，隔着墙，看着我。","她看得见我。","我睁开眼，火堆还在烧。","\"她醒了。\"我说。","\"谁？\"李瀚问。","\"易爽。\"我说，\"她的能力醒了。她在看我。\"","火堆噼啪响了一声。","\"那她等着你。\"老周说，\"走快点儿。\"","天亮的时候，车队重新上路。","往北，往河谷。"]},{"title":"第三十六章 河谷","body":["河谷在十一月中旬到了。","大坝还是那座大坝，灯火通明，像一座不夜城。可坝外的铁丝网，比我们走的时候多了一圈。网上的牌子写着：火种前站，防疫重地，无通行证不得靠近。","\"通行证？\"李瀚问。","\"登船序列的人才有。\"顾长征说。","我们没有通行证。我们在坝外的山坡上扎了营，等。","第三天，高连长来了。","他瘦了很多，左胳膊吊着绷带，腰上缠着一圈纱布。他在火堆边坐下，先看了看我，又看了看顾长征：\"你们俩，一个失控样本，一个逃兵，凑一块了。\"","\"命硬。\"顾长征说。","高连长点了点头：\"命硬的人，才活得下来。\"","他带来了一张地图。","地图上，大坝的构造画得清清楚楚。厂房、发电层、检修廊道、地下层。地下层最深的地方，画着一扇门，门旁边标着三个字：三号出口。","\"三号出口，\"高连长说，\"是旧泄洪通道。火种不知道它还能用，或者知道，但封得不严。\"","\"通向哪儿？\"","\"坝外五公里，一条干河沟。\"他说，\"人能从那儿出去。\"","\"那火种前站里面呢？\"我问。","\"地下层，是筛选站。\"他说，\"采血、测反应速度、分级。S级的，送登船序列；A级的，留站观察；不合格的，送清障队。\"","\"我爸妈，什么级？\"","高连长没回答。他从怀里摸出一张纸条，递给我。","上面是我爸的字迹，笔画很重：小乐，妈在B区，我在D区。别来。守好你自己。","我攥着那张纸条，指节发白。","\"D区是什么？\"我问。","\"特殊种研究区。\"高连长说。","我抬头看他。","\"你爸，被验出特殊种反应。\"他说，\"B-3那一类。火种把他划进D区，研究。\"","我站在原地，半天没动。","\"你爸不是被抓的。\"高连长说，\"他自己去的。防疫站那晚，他看见车来了，把你妈推进B区，自己走进D区。\"","\"为什么？\"","\"因为你。\"高连长说，\"你是B-5。他大概想看看，你身上那点东西，到底是从哪儿来的。\"","夜里，我坐在山坡上，看着大坝的灯，看了很久。","陶一鸣坐在我旁边，把一张电路图摊开：\"地下层有通风井，电缆沟，排水管。我能把机器狼送进去。\"","\"机器狼进去干什么？\"","\"开路。\"他说，\"你救人，我开路。\"","我看着他。","\"你妻女埋在后山。\"我说，\"你为什么要跟我蹚这趟？\"","他低头擦着电路图，说：\"她们埋在配电间外头，我没能开门。\"","\"……\"","\"那扇门，\"他说，\"我这辈子关不上。可别的地方的门，我还能开。\"","我拍了拍他的肩，没说话。","天亮之前，我们把计划定了。","机器狼走通风井，进地下层，找易爽和B区。我们从三号出口进，从排水管撤。","\"进去以后，\"高连长说，\"能带几个带几个。带不出来的，别回头。\"","\"高叔。\"","\"别叫。\"他说，\"我是军人，我守过桥，守过山口，守过二道。这回，我守三号出口。\"","\"你一个人？\"","\"我有这个。\"他拍了拍腰间的对讲机，\"还有一口气。\"","我看着那座不夜城。","易爽在里面。我妈在B区。我爸在D区。","天亮，进坝。"]},{"title":"第三十七章 重逢","body":["三号出口比地图上窄。","旧泄洪通道，两个人并排走都挤，头顶的混凝土裂着缝，水从缝里渗下来，滴在脖子里，凉得像针。","高连长没跟我们进来。他蹲在出口，把对讲机举到嘴边：\"我在这儿。三小时不回，你们自己走。\"","通道走了一公里，到头了。","尽头是一扇铁门，门缝里透出光。陶一鸣把机器狼放出去，光电头贴着地面，先探了探。它回来的时候，背上多了一道灰印，门后面是地下层的设备间。","\"没人。\"他说。","我们钻进去。设备间的灯亮着，机器的嗡鸣声很响。李瀚端着枪走在前面，我贴着墙根，看着一扇一扇门。","第一扇门，B区。","门没锁。推开，里面是一排架子，架子上摆着采血管，标签都是新的。墙角坐着几个穿白大褂的人，抬头看我们一眼，又低下头，像没看见。","\"我妈在哪儿？\"我问。","一个白大褂指了指走廊尽头：\"B-7，观察室。\"","我跑过去，推开观察室的门。","我妈坐在床边，头发全白了，人瘦得只剩一把骨头。她看见我，先是一愣，然后眼圈红了。","\"小乐。\"","\"妈。\"我蹲下去，握住她的手。","\"你怎么来了？\"她声音发抖，\"你爸说，别让你来。\"","\"我爸在D区。\"我说，\"我来接你们出去。\"","她摇头：\"你爸走不了。D区的门，从外面锁着，钥匙在总控室。\"","\"我去拿。\"","\"小乐。\"她抓住我的手腕，\"你爸说，他要是能走，早就走了。他留在那儿，是想看看，你身上那点东西到底是什么。\"","我攥着她的手，半天没说话。","\"他在哪儿？\"我问。","走廊尽头，最后一扇门。门牌上写着：D区，特殊种研究。","我推开门。","房间里灯很白，像手术室。我爸坐在椅子上，胳膊上插着管子，管子连着一台仪器，仪器屏幕上跳着一条一条曲线。他看见我，眼睛亮了一下，又暗下去。","\"小乐。\"","\"爸。\"","他低头看了一眼自己胳膊上的管子：\"他们从我身上抽东西，抽了两个月。\"","\"抽出来什么？\"","\"他们说，是B-3的东西。\"他说，\"陆远身上那点东西，我身上也有。\"","我看着他，喉咙发紧。","\"你来接我，我知道。\"他说，\"可我走不了。管子拔了，我就没了。\"","\"那就不拔。\"我说，\"我连机器一起搬。\"","他笑了，笑得很轻：\"傻孩子。\"","他抬起另一只手，指了指仪器屏幕：\"你看看这个。\"","屏幕上，一条曲线在跳。曲线的形状，跟我在桥上见过的那些影子，一模一样。","\"他们管这个叫'预见波'。\"他说，\"你身上的东西，跟我身上的，是同一个。\"","\"……\"","\"我不是样本。\"他说，\"我是你爸。\"","我站在那间白房间里，看着屏幕上的曲线，很久没说话。","外面，警报声忽然响了。","广播里，女声一个字一个字地念：\"地下层发现闯入者。封锁所有出口。\"","陶一鸣的声音从耳机里挤进来：\"通风井被切了。三号出口，高连长在守。快走！\"","我看着我爸。","他伸手，把管子从胳膊上拔下来。血涌出来，他按住，说：\"走吧。妈在外面等你。\"","\"爸！\"","\"你身上那点东西，\"他说，\"是从我这儿来的。记住这个，比记住我，有用。\"","警报声越来越近。","我被人拽出那间白房间。","门在我身后合上。","我没有再看见我爸。"]},{"title":"第三十八章 易爽","body":["地下层的警报拉响之后，机器狼在前面开路，我们沿排水管往西跑。","我妈被阿宁扶着，走不动，李瀚背着她。管子里黑，水没到膝盖，冷得刺骨。","\"易爽呢？\"李瀚问。","\"登船序列，在B区东侧。\"顾长征说，\"离这儿还远。\"","\"我去。\"我说。","\"你去，就回不来了。\"","\"那我就不回来。\"我说，\"你们带我妈走，三号出口见。\"","我转身往回跑。","排水管尽头，是B区东侧。门开着，灯亮着，走廊里没有人。白大褂都跑了，只剩下仪器还亮着。","最后一间房，门上贴着一串编号：B-5。","不对。B-5是我。","我推开门。","房间里，灯光很暗。易爽坐在床边，手腕上系着绿带子，床头挂着一串编号。她抬起头，看见我，没有惊讶。","\"你来了。\"她说。","\"我来了。\"","她站起来，走到我面前，抬手摸了摸我的脸。她的手很凉，可她的眼睛很亮。","\"我梦见你往西走。\"她说，\"你带着一群人，一直走。\"","\"我不是往西走。\"我说，\"我是来接你的。\"","\"接我去哪儿？\"","\"哪儿都行。\"我说，\"只要不在船上。\"","她低头看了一眼自己手腕上的绿带子：\"他们说我合格。S级，优先登船。\"","\"不合格。\"我说，\"我说了算。\"","她笑了，眼睛弯起来，像以前在医院里笑一样：\"你说了算。\"","走廊里，警报声又近了。","我拉住她的手，往外跑。跑到拐角，我看见走廊尽头站着一个人。","穿着白大褂，戴着圆眼镜。","沈医生。","\"B-5。\"他说，\"你终于自己来了。\"","\"让开。\"","\"你走不了。\"他说，\"整个地下层都封了。你带着她，出不去。\"","\"我试过了。\"我说，\"每次你们都这么说。\"","我拉着易爽，从他身边跑过去。他没有拦，只是站在走廊里，看着我们跑远，说了一句：\"船上，有她活命的舱位。岸上，没有。\"","我停了一下。","\"岸上也没有我的。\"我说，\"可岸上有我爸，我妈，有她，有我。\"","我继续跑。","排水管入口，李瀚在等我。他看见易爽，愣了一下，然后笑了：\"行啊，真带出来了。\"","\"走。\"","我们钻进排水管。水比刚才涨了一点，漫到腰。易爽咬着牙，跟着我走，一句话不说。","管口的光越来越近。","三号出口，高连长蹲在洞口，身上全是血。他看见我们，咧嘴笑了一下：\"带出来几个？\"","\"一个。\"我说，\"S级的。\"","\"够了。\"他说，\"跑。\"","我拉着易爽钻出洞口。身后，高连长把铁门从里面关上，锁死。","\"高叔！\"","\"守门的人，\"他的声音隔着铁门，\"不回头。\"","我们往山坡上跑。","身后，大坝的灯一盏一盏灭下去。然后，一声闷响，整座大坝的灯全灭了。","火种前站，停电了。","易爽站在山坡上，看着那座黑下来的大坝，说：\"你爸，把电切了。\"","我站在她身边，看着那片黑暗，很久没有说话。"]},{"title":"第三十九章 真相","body":["火种前站停电后的第三天，顾长征带回一箱档案。","是从总控室抢出来的，纸页发黄，边角卷着，最上面一份，封皮写着：VX-9 项目。","我们围坐在火堆边，一份一份看。","VX-9，是空间站轨道武器的代号。发射轨道坐标，34.05，-118.24，洛城上空。档案里说，这套武器在爆发前就已经部署，轨道高度四百零八公里。","\"四零八。\"易爽说，\"收音机里那个数。\"","\"嗯。\"我说，\"近地轨道。\"","下一份档案，是血清项目的。","M 国党派，在爆发前给高层精英接种了血清。血清只对空气传播有效。接种过的人，不会被空气感染，但血液接触，一样会变。","\"所以 M 国先崩了。\"顾长征说，\"精英活下来了，可普通人都变了。他们带着血清，退到天上。\"","\"云层之上。\"我说。","档案里夹着一张纸条，字迹潦草，是英文：","\"THEY ARE ABOVE THE CLOUDS. TRUST NO ONE. M\"","\"M 是谁？\"李瀚问。","\"未来者。\"顾长征说，\"档案里叫他们'新人类'。他们提前知道爆发，提前上了天。M 是他们里头的一个人，一直在给地面上的人递消息。\"","\"递消息干什么？\"","\"档案上写的是：'轻推代发'。\"他说，\"不发通知，不发警告，只在关键时候，推一把。\"","我盯着那张纸条，想起论坛上那条帖子，想起四零八，想起收音机里那句\"他们还活着\"。","\"他推我们干什么？\"我问。","顾长征把最后一份档案推过来。","封皮上写着：B-5，徐乐，血清原型疑似，预见波阳性。","\"你是 M 选中的。\"他说，\"你是 B 组里，跟实验完全兼容的那一个。你身上的预见波，是实验成功的标志。\"","\"实验？\"","\"M 国的血清实验，不止在 M 国做过。\"他说，\"他们借志愿者项目，在很多国家铺过。你，陆远，都是铺进去的棋子。\"","陆远。","我把 B-3 的档案翻出来。上面写着：特殊种化完成，残余意识保留率百分之四十，状态：武器化。","\"陆远不是自己变的。\"我说。","\"不是。\"顾长征说，\"他是被做出来的。M 国用血清改造他，想做出一种能指挥尸潮的东西。结果做出来的，是一个还认得你的怪物。\"","我攥着那份档案，半天没说话。","火堆噼啪响了一声。","\"易爽呢？\"我问，\"她不是 B 组。\"","\"她不是实验品。\"顾长征说，\"她是天然的。她的身体对病毒有天然抗性，血样标记阳性，不用改造。所以火种叫她 S 级。\"","\"要她的血。\"","\"要她的血，也要你的血。\"他说，\"你是活的血清原型。你俩的基因加在一起，是火种登船之后，重建人类的关键。\"","夜里，我坐在山坡上，看着河谷方向。","大坝的灯又亮了几盏，不多，像几点烛火。","易爽坐在我旁边，把收音机拧开。电流声里，那个声音又响了一次：","\"他们还活着。\"","然后是摩斯电码。四零八。","易爽听了一会儿，说：\"他们还在天上。\"","\"嗯。\"","\"他们想让我们上去。\"","\"他们想让我们当种子。\"我说。","她关掉收音机，看着我说：\"那你呢？\"","我看着河谷的灯火，看了很久。","\"我先管好活着的。\"我说，\"天上的人，让他们先等着。\""]},{"title":"第四十章 倒计时","body":["登船倒计时，是十二月初宣布的。","广播里，女声第一次提到了\"登船\"：\"登船序列启动。合格者按编号分批登船。火种计划进入执行阶段。\"","顾长征把广播听完，说：\"五座要塞，五根柱子。基因库在贵阳，筛选站在河谷，产线在重庆，算力在武汉，发射场在舟山以西。他们要把种子送上去。\"","\"送上去干什么？\"","\"重建。\"他说，\"地面守不住，就守天上。\"","\"地面守得住。\"我说。","他看着我，没说话。","第二天，沈医生找到了我们。","他一个人来的，穿着便衣，站在山坡下，举着手，说想谈。陶一鸣端着枪，没让他靠近。他隔着二十米喊话：","\"B-5，登船序列里有你，也有易爽。你俩的舱位，是最好的。\"","\"我不上船。\"我说。","\"你的血清，能救几十万人。\"他说，\"你上了船，地面的人才有未来。\"","\"我的血清在这儿也能救。\"我说，\"你们要的是我的基因，不是我的命。\"","他沉默了一会儿：\"你不上船，三号出口就封死。普通人一个都走不了。\"","\"那就不走三号出口。\"我说，\"我们自己开门。\"","他看了我很久，说：\"你会后悔的。\"","\"我后悔的事多了。\"我说，\"不差这一件。\"","他走了。广播里，登船倒计时开始报数：七十二小时。","七十二小时。","夜里，高连长从泄洪闸那边爬出来，满身泥。他看见我们，先骂了一句：\"三号出口让火种封了。\"","\"我知道。\"","\"你打算怎么干？\"","我看着地图。河谷大坝，三号出口，泄洪闸，检修廊道，电缆沟。","\"断电。\"我说，\"我爸断过一次电。这次，断久一点。\"","陶一鸣摊开电路图：\"总闸在地下二层，需要人进去。\"","\"我去。\"顾长征说。","\"你是军官，火种认得你。\"","\"我弟弟死在弃子名单上。\"他说，\"火种认不认得我，我都得去。\"","高连长把对讲机别回腰上：\"我去北边，把贵阳的基因库门打开。那边有反火种派的人接应。\"","\"你一个人？\"","\"我守过桥，守过山口，守过二道。\"他说，\"这回守门。\"","天亮的时候，队伍分成三路。","顾长征带人下地下二层，断总闸。","高连长往北，开贵阳的门。","我带着李瀚、老周、陶一鸣、阿宁、易爽和我妈，守三号出口。","七十二小时，从这个时候开始倒数。","广播里，女声还在报数：\"六十九小时。\"","易爽站在我身边，把手腕上的绿带子解下来，叠好，放进我口袋里。","\"干什么？\"","\"登船序列里，已经没有我了。\"她说。","我看着那条绿带子，把它收好。","\"开门之前，\"我说，\"我得先把你妈带出去。\"","她笑了：\"我妈早就不在了。\"","\"那就把我妈带出去。\"我说。","她没再说话。风从河谷灌进来，带着雪味。","冬天来了。"]},{"title":"第四十一章 开门","body":["第六十个小时，总闸断了。","河谷大坝的灯，一盏接一盏灭下去。这一次，没有恢复。广播里的女声断了一截，变成杂音，杂音里挤出一句：\"备用电源启动失败。\"","\"走！\"我喊。","三号出口的铁门，被我们用机器狼顶着，从里面撬开。泄洪通道里，第一批人涌出来。他们不知道发生了什么，只知道门开了。","我妈站在洞口，扶着一个走不动的老人：\"慢点，别挤。\"","老周把卡车开进干河沟，一辆一辆装人。李瀚端着枪，守在通道口。陶一鸣蹲在配电箱边，拿胶带缠着几根线，说：\"火种的人五分钟内会来关闸。\"","\"五分钟够吗？\"阿宁问。","\"够装一车。\"老周说。","第二车装到一半，火种的人来了。","来的是机器。几台机器狼，光电头红着，冲进通道口。陶一鸣吹了一声口哨，我们带来的那台机器狼从暗处扑出来，挡在它们面前。","两台机器狼对上了，枪管互相抵着，谁也没先动。","\"它们认得我。\"陶一鸣说，\"产线是我修的。\"","火种的机器狼停了三秒。然后，最前面那台，把枪管垂了下去。","\"走！\"陶一鸣喊。","人群继续往外涌。火种的机器狼站在通道里，一台接一台垂下枪管，像一群让路的狼。","第四车装到一半，陆远来了。","他站在泄洪通道的出口，弓着背，两个包从后背鼓起来。人群看见他，尖叫着往两边散。","他看着我。","那双浑浊的眼睛底下，有一层东西，像隔着水看灯。","\"陆远。\"我说。","他喉咙里滚出一声低吼，没有动。","易爽往前走了一步。我拉住她。","\"他认得你。\"易爽说，\"他认得我们。\"","陆远看了我们很久。然后，他转身，走到通道口的闸门边，用背抵住闸门。","他在替我们顶门。","人群从他身边跑过去，他纹丝不动。火种的人追到通道口，看见他，停住了。","\"B-3！\"有人喊。","陆远没有回头。他的背抵着闸门，像一座桥。","第五车装满的时候，远处传来一声闷响。河谷大坝的地下二层，爆炸的火光从通风井里喷出来。","顾长征。","对讲机里，他的声音断断续续：\"总闸……烧了。发射场的电路……也断了。他们上不了天了。\"","\"你出来！\"","\"出不来。\"他说，\"我弟弟在弃子名单上。我给他报了仇。\"","对讲机里安静了一会儿，然后彻底断了。","我站在干河沟里，攥着对讲机，半天没动。","第六车，第七车。","人群还在往外涌。我妈在洞口，一个一个数着人头，嗓子哑了。老周的卡车，一辆接一辆往南开。","天亮的时候，通道空了。","陆远还抵着闸门。他的背陷下去一块，爪子抠着地面，光电头一样的眼睛里，那层光还亮着。","我走到他面前。","\"陆远。\"","他看着我，喉咙里滚出一声很轻的声音，像名字，又像告别。","然后，他松开闸门，转身，走进泄洪通道的黑暗里。","水声传来，很久很久。","广播里，女声终于又响起来，这一次，声音很轻：\"登船序列，中止。\"","易爽站在山坡上，看着河谷，说：\"他们上不了天了。\"","\"嗯。\"","\"那天上的人呢？\"","我看着东边。发射场的方向，有一道很细的光，在晨雾里亮着。","\"让他们等着。\"我说。"]},{"title":"第四十二章 种子","body":["冬天过去了。","开春的时候，河谷的水开始化冻。水电站重新转起来，坝顶的灯亮了一整夜。广播里说，植物工厂第三期投产，粮食够所有人吃到明年。","我们在河谷下游的一片台地上，搭起了新据点。","不是要塞，没有铁丝网，没有积分手环。几排板房，一口井，一片翻好的地。老周把房车停在台地边上，车门开着，谁累了就上去躺一会儿。","陶一鸣在板房后面搭了个棚子，棚子里堆着机器狼的零件。他蹲在地上，把一台断了腿的机器狼重新拼起来，拼了三天。","\"修得好吗？\"我问。","\"修得好。\"他说，\"腿断了，焊上就行。\"","\"我是问你自己。\"我说。","他停了一下，把焊枪放下，看着棚外那片地，说：\"我在这修东西，修到有人接我的班。\"","\"谁接？\"","\"后山那几个孩子。\"他说，\"他们天天来看我修机器，眼睛亮得很。\"","李瀚在台地边上挖了一条排水沟，挖完，又把枪架支起来，说：\"这东西还是得留着。\"","\"留着干什么？\"","\"留着防万一。\"他说，\"万一哪天，又有人想给我们发手环。\"","阿宁在据点里开了个卫生所。门框上挂着一块牌子，她自己拿木板钉的，上面写着：伤口沾血，立刻上报。报不报都一样，可报，是让别人有个数。","\"你这话，吓人。\"我说。","\"吓人，才能活人。\"她说。","我妈在菜地里种菜。她蹲在垄边，把种子一粒一粒按进土里，按得很慢。易爽蹲在她旁边，学着种。","\"你爸要是还在，\"我妈说，\"他会高兴的。\"","易爽没有接话。她低头把土按实，过了一会儿，说：\"他会高兴的。\"","那把铁皮哨子，我挂在房车的钥匙扣上。易爽那枚硬币，我也挂在上面。钥匙转起来的时候，硬币叮当响。","陶一鸣问过我一回：\"这硬币，什么讲究？\"","\"保平安。\"我说。","\"管用吗？\"","\"不知道。\"我说，\"可它一直在我兜里。\"","开春第三周，收音机自己响了。","老周正在擦它，手停在旋钮上。电流声里，那个声音很轻，很稳，像是从很远的地方传来的：","\"他们还活着。\"","然后是摩斯电码。四零八。","易爽坐在门槛上，听着那阵电码，说：\"他们还在天上。\"","\"嗯。\"","\"他们还会回来吗？\"","我看着东边。发射场的方向，已经看不见那道光了。","\"不知道。\"我说，\"可他们还活着。\"","收音机又响了一遍。四零八，四零八。","我伸手，把它关掉。","台地下面的水电站，灯还亮着。植物工厂的灯也亮着。菜地里，我妈和易爽种下的种子，已经冒了芽。","我站在台地上，看着那片新翻的地。","天上的人还活着。","地上的人也还活着。","这世界烂过一回，可种下去的，还会长。","我把硬币从钥匙扣上解下来，蹲下去，把它按进菜地边上的土里。","\"等它长出来。\"我说。","风从河谷灌上来，带着泥土的味道。","春天到了。"]}];
const N = BOOK.length;
const els = {};
['menuBtn','toc','tocBack','tocList','mask','content','prevBtn','nextBtn','posLabel','progressBar','fontMinus','fontPlus','themeBtn','toTop'].forEach(id => els[id] = document.getElementById(id));

let cur = 0;
function fontScale(){ try{return parseFloat(localStorage.getItem('wm_font')||'1')}catch(e){return 1} }
function applyFont(){ const s=Math.min(1.6,Math.max(.8,fontScale())); document.documentElement.style.setProperty('--content-font', s+'em'); els.content.style.fontSize=(17.5*s)+'px'; try{localStorage.setItem('wm_font',String(s))}catch(e){} }
function theme(){ try{return localStorage.getItem('wm_theme')||'light'}catch(e){return 'light'} }
function applyTheme(){ document.body.classList.toggle('dark', theme()==='dark'); els.themeBtn.textContent = theme()==='dark' ? '☀️' : '🌙'; }

els.tocList.innerHTML = BOOK.map((c,i)=>'<button data-i="'+i+'">'+c.title.replace(/</g,'&lt;')+'</button>').join('');
els.tocList.querySelectorAll('button').forEach(b=>b.addEventListener('click',()=>{ render(parseInt(b.dataset.i,10)); closeToc(); }));
els.tocBack = document.createElement('button'); els.tocBack.id='tocBack'; els.tocBack.textContent='✕'; els.toc.appendChild(els.tocBack);
els.tocBack.addEventListener('click', closeToc);
els.menuBtn.addEventListener('click', ()=>{ els.toc.classList.add('open'); els.mask.classList.add('show'); });
els.mask.addEventListener('click', closeToc);
function closeToc(){ els.toc.classList.remove('open'); els.mask.classList.remove('show'); }

function render(i){
  cur = Math.max(0, Math.min(N-1, i));
  const c = BOOK[cur];
  const parts = c.body;
  els.content.innerHTML = '<h2>' + c.title.replace(/</g,'&lt;') + '</h2>' + parts.map(p=>{
    const t=p.trim(); if(!t) return '';
    if(t==='---') return '<div class="break"></div>';
    return '<p>'+t.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')+'</p>';
  }).join('');
  els.prevBtn.disabled = cur===0;
  els.nextBtn.disabled = cur===N-1;
  els.posLabel.textContent = (cur+1)+' / '+N;
  els.progressBar.style.width = ((cur+1)/N*100)+'%';
  els.tocList.querySelectorAll('button').forEach(b=>b.classList.toggle('cur', parseInt(b.dataset.i,10)===cur));
  try{localStorage.setItem('wm_last',String(cur))}catch(e){}
  window.scrollTo(0,0);
  els.content.style.animation='none'; void els.content.offsetWidth; els.content.style.animation='';
  closeToc();
}

els.prevBtn.addEventListener('click', ()=>render(cur-1));
els.nextBtn.addEventListener('click', ()=>render(cur+1));
els.fontPlus.addEventListener('click', ()=>{ try{localStorage.setItem('wm_font',String(Math.min(1.6,fontScale()+.1)))}catch(e){} applyFont(); });
els.fontMinus.addEventListener('click', ()=>{ try{localStorage.setItem('wm_font',String(Math.max(.8,fontScale()-.1)))}catch(e){} applyFont(); });
els.themeBtn.addEventListener('click', ()=>{ try{localStorage.setItem('wm_theme', theme()==='dark'?'light':'dark')}catch(e){} applyTheme(); });
els.toTop.addEventListener('click', ()=>window.scrollTo({top:0,behavior:'smooth'}));
window.addEventListener('scroll', ()=>{ els.toTop.classList.toggle('show', window.scrollY>600); }, {passive:true});
document.addEventListener('keydown', e=>{
  if(e.key==='ArrowLeft') render(cur-1);
  if(e.key==='ArrowRight') render(cur+1);
});

let last=0; try{last=parseInt(localStorage.getItem('wm_last')||'0',10)}catch(e){}
if(!(last>=0&&last<N)) last=0;
applyFont(); applyTheme(); render(last);
</script>
</body>
</html>
