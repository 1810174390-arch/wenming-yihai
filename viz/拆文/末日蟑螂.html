<!DOCTYPE html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>《末日蟑螂》深度精读全档</title><style>body{background:#0d0a07;color:#f3ead9;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",system-ui,sans-serif;max-width:860px;margin:0 auto;padding:40px 18px 80px}h1{font-size:24px;letter-spacing:2px;border-bottom:1px solid rgba(243,234,217,.15);padding-bottom:16px;margin-bottom:24px}#doc{line-height:1.9;font-size:15px}#doc h2{font-size:18px;margin:26px 0 10px;color:#e2792f}#doc h3{font-size:15.5px;margin:20px 0 8px}#doc p{margin:8px 0}#doc hr{border:none;border-top:1px dashed rgba(243,234,217,.18);margin:22px 0}#doc ul{margin:8px 0 8px 22px}#doc blockquote{border-left:2px solid #e2792f;background:rgba(226,121,47,.08);padding:8px 14px;margin:10px 0;color:rgba(233,218,195,.8)}a.back{display:inline-block;margin-bottom:20px;color:#e2792f;text-decoration:none;font-size:13px}</style></head><body><a class="back" href="../index.html">← 返回工作台</a><h1>《末日蟑螂》深度精读全档</h1><div id="doc"></div><script>const SRC="# 第1章 深度拆解（末日蟑螂）\n\n字数约3300字 | 核心事件：D病毒爆发半个月后，宅男张小强在丧尸围城的家中醒来，清点物资、规划求生。\n\n**开篇钩子**：类型{代入感+感官冲击} | 手法：首句\"我闭上眼睛世界就不存在！\"——主角口头禅破题，随即用饥饿、死老鼠臭味、丧尸踩玻璃声构建末日清晨 | 效果：强——先给体感再给事实。\n\n**人物出场**：张小强 | 主角塑造{行为+心理+背景旁白} | 第一印象：34岁大龄宅男、WH市人、父母双亡妹妹失联、体重170斤、懒散怕死但会算账。\n\n**世界观铺设**：透露{D病毒：空气+接触感染、90%感染率、45分钟病变、攻击力1.5倍、破坏神经中枢才能杀死} | 隐藏{病毒的真正来源、张小强是否已感染} | 方式{新闻帖子一次性交代+主角亲眼目击吃人场景}。\n\n**结构拆解**：\n| 段落范围 | 功能 | 字数 |\n|---|---|---|\n| 醒来感官流+回忆半个月前 | 铺垫/状态 | 约1200 |\n| 爆发夜目击吃人、报警失败 | 冲突/恐惧 | 约900 |\n| 读新闻帖、恐惧死亡 | 世界观/压抑 | 约700 |\n| 清点物资、封窗、规划自学 | 收尾/微目标 | 约500 |\n\n**爽点分析**：类型{无传统爽点，真实感生存} | 抽象对抗型路由：核心对抗面{门外无尽丧尸+断粮倒计时} | 紧迫感来源{食物只够十天、楼下一片尸潮} | 升级机制{生存资源逐项收紧} | 叙事替代{用\"活下去\"的微小行动（封门缝、清物资）替代打脸爽感，读者代入的是纯生存焦虑}。\n\n**章尾钩子**：类型{新目标} | 内容：决定下载资料学习生存技能，\"想到就开始\" | 期待度：中。\n\n**可借鉴要素**：①物资清单精确到数字（17包方便面、12斤米、1.5桶水）——数字即压迫感；②感官优先级：饿→臭→声音→视觉，完全贴人真实感知顺序；③普通人恐慌写实（拨110记不起号码、腿软跪坐、吐到嘴角发苦）；④\"活着就有希望\"这类口号只用一次，不滥用。\n\n---\n\n# 末日蟑螂 第1-1章 灾难日（摘要）\r\n- 情节点：饥饿唤醒张小强，末日已成现实；楼下丧尸分食活人；电话全打不通；清点物资（17包方便面/12斤米/腊肉/鸡蛋/1.5桶水）；封门窗、下载资料学求生。\r\n- 角色动向：34岁宅男，父母双亡妹远嫁，怕死但求生欲强，从崩溃中强迫自己冷静规划。\r\n- 关键信息/扩写技法：D病毒规则全部借网帖+亲历碎片带出（45分钟变异、90%感染率、无视觉靠嗅听觉、断颈椎可杀），零上帝视角科普；物资精确到数字。\r\n- 逐章写法公式：生理饥饿感开场 → 回忆铺底色 → 楼下惨剧（声音/气味先于视觉）→ 物资清点 → 学习求存收尾。\n\n---\n\n# 第2章 深度拆解（末日蟑螂）\n\n字数约2200字 | 核心事件：食物耗尽，张小强为抢平台菜圃的白菜首次出门，锅盖为盾、榔头为刃，险杀丧尸夺回11颗白菜。\n\n**开篇钩子**：类型{压抑} | 手法：从\"想吃又不敢吃\"的饥饿开始，引出自杀念头与怕死的自我嘲讽 | 效果：强——把读者的心压到谷底再放出门。\n\n**人物出场**：张小强（深化）；对门邻居丧尸（非人形反派） | 主角塑造：心理戏（想自杀不敢、恨自己没用）+ 行动（自制武器、演练）+ 口头禅\"人死鸟朝天，不死万万年\"。\n\n**世界观铺设**：透露{丧尸外观细节（无瞳孔、黑牙如三角刮刀）、尸臭、家中平台地形} | 隐藏{病毒机制之外的东西} | 方式{主角观察+行动中带出}。\n\n**结构拆解**：\n| 段落范围 | 功能 | 字数 |\n|---|---|---|\n| 饥饿+自杀念头 | 铺垫/压抑 | 约700 |\n| 观察白菜、清点丧尸、选武器 | 铺垫/计划 | 约600 |\n| 出门抢白菜 | 冲突/紧张 | 约500 |\n| 楼道遇伏、砸烂丧尸、回家 | 冲突/爽点 | 约400 |\n\n**爽点分析**：类型{以弱胜强} | 抽象对抗型路由：核心对抗面{7只丧尸+断粮} | 紧迫感来源{白菜是未来几天唯一食物、丧尸逐只逼近} | 升级机制{第一次近战→第一次击杀} | 叙事替代{爽点=首杀+夺回食物后的\"对活下去有了信心\"——生存希望即最高爽感}。\n\n**章尾钩子**：类型{情绪转折} | 内容：\"张小强第一次，对活下去有了信心\" | 期待度：中（情感钩子而非剧情钩子）。\n\n**可借鉴要素**：①极小化目标（为几颗白菜拼命）让平凡战斗有巨大分量；②武器DIY（八磅锤太重→榔头+铁皮锅盖盾）写实且强化\"普通人\"设定；③第一次战斗不写英姿，写笨拙（腿软、盾牌撞飞、脑子空白、锤到稀烂）——笨拙即代入感；④丧尸外貌细节在战斗间隙给，不打断节奏。\n\n---\n\n# 末日蟑螂 第1-2章 为了白菜（摘要）\r\n- 情节点：断粮在即，主角决定出门；杀楼梯口丧尸；抢11颗白菜；对门丧尸偷袭，铁门被堵险死；榔头砸烂丧尸，夺路回家。\r\n- 角色动向：第一次正面杀\"人\"，从手脚发软到\"我做到了\"，活下去的信心初立。\r\n- 关键信息/扩写技法：极小目标写法（为几颗白菜拼命）；主角普通人锚点（八磅锤拿不动、锅盖当盾）；丧尸扑击速度与嗅味设定实战化。\r\n- 逐章写法公式：绝望（自杀念头）→ 决断 → 潜入-冲突-暴走 → 脱险余韵（信心）→ 门外挠门声卡点。\n\n---\n\n# 第3章 深度拆解（末日蟑螂）\n\n字数约2600字 | 核心事件：张小强体能训练、自制铁枪，用绳子门闩+门缝战术清掉门外六只丧尸。\n\n**开篇钩子**：类型{状态描写+微悬念} | 手法：闹铃惊醒→照例清点物资→门外丧尸撞门 | 效果：中——日常化开局，用\"物资越来越少\"压节奏。\n\n**人物出场**：张小强（深化）；门外丧尸群（非人形反派） | 主角塑造：练到脱力、烟丝卷烟、电话线灵光、翻老爸工具箱——把\"普通人求生智慧\"演到位。\n\n**世界观铺设**：透露{自来水停水、物资断烟、楼道地形} | 隐藏{外部世界局势} | 方式{主角清点+内心盘算}。\n\n**结构拆解**：\n| 段落范围 | 功能 | 字数 |\n|---|---|---|\n| 晨起清点+体能训练 | 铺垫/状态 | 约700 |\n| 想不出办法、烟丝卷烟 | 铺垫/人物 | 约500 |\n| 电话线灵感、自制铁枪 | 转机/智慧 | 约600 |\n| 门缝清尸六只、力竭 | 冲突/爽点 | 约700 |\n\n**爽点分析**：类型{以弱胜强+智慧破局} | 抽象对抗型路由：核心对抗面{门外六只丧尸+没有武器} | 紧迫感来源{食物不足、丧尸日复一日撞门} | 升级机制{单只→六只，走廊→门缝} | 叙事替代{爽点=自制武器成功+门缝逐一击破，靠\"计划成功\"而非战力碾压}。\n\n**章尾钩子**：类型{余波} | 内容：铁枪脱手落地，主角力竭 | 期待度：弱（压抑缓冲，无强钩子——本书早期靠生存危机本身牵引）。\n\n**可借鉴要素**：①\"电话线→绳子→门闩\"的灵感链写普通人思维的真实过程（灵光抓不住→再想→落地）；②工具DIY细节（三角锉刀+水管+铁钉）让生存智慧可信；③战斗写代价：掌握不了力道、磨死五只、枪都拿不住——胜利带着疲惫，不廉价；④丧尸外貌特写放在出手前，视觉信息跟着主角视线走。\n\n---\n\n# 末日蟑螂 第1-3章 守门犬？（摘要）\r\n- 情节点：门被6只丧尸堵5天；物资见底、烟断；疯狂体能训练；从电话线得到灵感，麻绳拴门留缝，计划逐一解决。\r\n- 角色动向：老烟民的自嘲式独居日常；为生存自我压榨（蛙跳2000/锤500）。\r\n- 关键信息/扩写技法：丧尸被血腥味吸引会\"守门\"（行为设定）；智慧型求生（门缝战术）；幻想解放军救援的情绪反差。\r\n- 逐章写法公式：日常压力铺垫 → 训练蒙太奇 → 瓶颈 → 灵感触发（电话线）→ 执行计划收尾。\n\n---\n\n# 末日蟑螂 第1-4章 为了食物（摘要）\r\n- 情节点：清理门外7具尸体；潜入对门搜刮（菜蛋肉烟酒）；厨房挠门声惊魂（原是肥猫）；摸清与丧尸的40米安全距离。\r\n- 角色动向：杀丧尸从恐惧转向麻木（\"像杀蚂蚁\"），只杀有威胁的目标。\r\n- 关键信息/扩写技法：安全距离设定（40米）；入室搜索的紧张节奏（声先于影）；不贪不恋战的生存逻辑。\r\n- 逐章写法公式：战后清场 → 入室搜索（伪惊悚）→ 物资清单 → 拖包归家收尾。\n\n---\n\n# 末日蟑螂 第1-5章 收获、武器（摘要）\r\n- 情节点：清点收获（50斤米/20斤肉/47包烟）；军迷遗屋找到MP9弩+军刀+望远镜；试射威力惊人；窗外丧尸开始\"木乃伊化\"；市中心浓烟冲天。\r\n- 角色动向：明确\"要逃出城市\"；小市民式自私但真实的求生心态。\r\n- 关键信息/扩写技法：丧尸20天变异迹象（干瘪、撞墙才转向）；武器参数具体化（48kg拉力/180m射程）；望远镜拉近远景制造观察层。\r\n- 逐章写法公式：物资满足 → 武器爽点（试射）→ 观察设定 → 远景悬念（浓烟）收尾。\n\n---\n\n# 末日蟑螂 第1-6章 一挑三（摘要）\r\n- 情节点：撬开八楼铁门上楼顶；遭遇3丧尸正面强杀；实验丧尸弱点（心脏无效、碎嘴无用、只有脑/颈椎）；望远镜看清面包车翻车、幸存者被分食；开始下雨。\r\n- 角色动向：成长标记——5天前怕1只，今天杀10只含3只正面强击。\r\n- 关键信息/扩写技法：弱点验证通过战斗行动呈现；幸存者惨剧用望远镜远景一笔带过（不切视角）；\"雨\"埋下重要伏笔。\r\n- 逐章写法公式：好奇心钩子 → 探索 → 战斗升级 → 实验信息 → 远景惨剧 → 下雨收尾。\n\n---\n\n# 末日蟑螂 第1-7章 爱洗澡的丧尸？（摘要）\r\n- 情节点：连雨11天；丧尸雨中仰头接水、皮肤回润；主角雨中连杀21只打通小卖部路线；扛水粮回家累瘫，笑中带泪。\r\n- 角色动向：体能飞涨（蛙跳3000）；第一次近距离试探雨中丧尸规则。\r\n- 关键信息/扩写技法：雨水对丧尸增益（核心伏笔）；雨中人类被腐蚀的暗示；体力极限用生理细节写（肩头火辣、腿软）。\r\n- 逐章写法公式：雨景日常 → 异常观察 → 雨幕冒险 → 收获与崩溃并存收尾。\n\n---\n\n# 末日蟑螂 第1-8章 被感染了？（摘要）\r\n- 情节点：淋雨+喝自来水后病毒爆发（灼烧与寒冰交替的地狱折磨）；自认必死；晕死一夜醒来未变异；雨停。\r\n- 角色动向：疑似变异/免疫体质初显，心态从崩溃到淡然。\r\n- 关键信息/扩写技法：雨水含病毒直接验证；主角未变异=特殊体质伏笔；痛感全部用生理反应写，无一句心理总结。\r\n- 逐章写法公式：寒湿体感 → 病毒爆发长段痛觉 → 濒死 → 醒来反差（没变丧尸）→ 雨停收束。\n\n---\n\n# 末日蟑螂 第1-9章 进化？（摘要）\r\n- 情节点：病愈恢复训练；观察到力量型（D）与敏捷型（S）丧尸出现，变异率约5%，推算全国基数心生寒意；楼顶遇力量型撞门，楼道反杀；进入其家发现全家惨剧。\r\n- 角色动向：5000次刺杀训练；开始系统化命名丧尸类型。\r\n- 关键信息/扩写技法：D/S型命名与设定（大力神/闪电侠）；\"D病毒+血肉+雨水=进化\"推测公式；蟑螂意象自我映射。\r\n- 逐章写法公式：训练日常 → 观察数数（推概率）→ 蟑螂意象 → 突然遭遇 → 反杀+悲剧现场收尾。\n\n---\n\n# 末日蟑螂 第1-10章 春节（摘要）\r\n- 情节点：末世第一个春节；大段童年回忆闪回；孤独绝望摔手机；独自做年夜饭摆三副碗筷；练弩；发现S型丧尸吃老鼠。\r\n- 角色动向：情绪低谷；对妹妹与家人的牵挂成为软肋。\r\n- 关键信息/扩写技法：\"D病毒只对人类有效？\"的疑问；节日孤独用回忆对比写；仪式感（摆碗筷）替代抒情。\r\n- 逐章写法公式：节日孤独（闪回）→ 崩溃（摔手机）→ 自我重建（一个人过年）→ 观察新信息收尾。\n\n---\n\n# 末日蟑螂 第1-11章 大狗（摘要）\r\n- 情节点：生日平淡；给丧尸取外号（炮灰/D大力神/S闪电侠）；S型守阴沟吃老鼠；街上幸存者被尸群围杀；两只变异苏联红犬清场，大狗喷白雾冻结丧尸后离去。\r\n- 角色动向：恶趣味命名记人设；幸灾乐祸到目瞪口呆。\r\n- 关键信息/扩写技法：动物变异分化（超犬+冰系能力）；丧尸领地性；\"人不如狗\"黑色幽默缓冲血腥。\r\n- 逐章写法公式：命名设定（记忆点）→ 观察 → 幸存者惨剧远景 → 变异狗战力展示 → 异能震憾收尾。\n\n---\n\n# 末日蟑螂 第1-12章 很像猫的豹子（摘要）\r\n- 情节点：全城停电（电网运行三个月后崩溃）；食物告急；花园丧尸一夜全失踪；被\"窥视感\"笼罩；小卖部补货；巨型豹子现身（疑似邻居肥猫）。\r\n- 角色动向：负重训练（40斤）；第六感预警明显增强。\r\n- 关键信息/扩写技法：停电=文明进一步崩溃；丧尸有地盘且会迁徙；\"被窥视感\"作为危险预警设定。\r\n- 逐章写法公式：断电末日感 → 反常（花园空）→ 未知恐惧 → 小收获 → 怪物亮相收尾。\n\n---\n\n# 末日蟑螂 第1-13章 是豹子还是猫？（摘要）\r\n- 情节点：与豹子苦战（弩箭中肩、多次被扑）；豹子喷火；近身军刀剖腹击杀；发现发热的\"猫结石\"；脱力晕厥。\r\n- 角色动向：万次刺杀练习的实战检验；战斗后武器报废、浑身是伤。\r\n- 关键信息/扩写技法：变异动物异能（喷火）；猫结石=重要道具（发热）；战斗写代价写笨拙，胜利不廉价。\r\n- 逐章写法公式：对峙回合制 → 火攻危机 → 军刀绝杀 → 战利品悬念 → 晕厥收尾。\n\n---\n\n# 末日蟑螂 第1-14章 大会餐？（摘要）\r\n- 情节点：饿醒暴食扫空半月存粮；伤口一夜结疤（自愈确认）；S/D丧尸被血腥味引来，反杀15只（含6D+2S）；下楼发现百尸围楼。\r\n- 角色动向：消化/自愈变异实锤；战术升级（引D撞普通丧尸制造混乱）。\r\n- 关键信息/扩写技法：主角体质变异确认；高级丧尸聚集规律（血腥味）；诱敌分化战术。\r\n- 逐章写法公式：异常体感 → 能力发现 → 连环战斗 → 战术展示 → 新危机（围楼）收尾。\n\n---\n\n# 末日蟑螂 第1-15章 离开前的准备（摘要）\r\n- 情节点：苦思破局；总结丧尸弱点（嗅觉是雷达）；自制辣椒毒气弹+胡椒面；熏散楼下尸群；小卖部扫货；打包行囊（地图/铁锹/军用水壶）。\r\n- 角色动向：从被动防守转为主动规划，决定明天离城。\r\n- 关键信息/扩写技法：丧尸设定应用（嗅觉刺激可致混乱）；物资精确到颗（钢珠40颗/弩箭6只）；离城动机明确。\r\n- 逐章写法公式：困境罗列（方案被否）→ 推理灵感 → 制作道具 → 实战验证 → 出发前夜收尾。\n\n---\n\n# 末日蟑螂 第1-16章 杀出重围与被围（摘要）\r\n- 情节点：3月27日（末日第90天）正式离家；放走瓶中蟑螂（意象告别）；白酒掩味潜行，射杀11只；十字路口被卡车墙挡住；改道江边街道，被D型偷袭，碎玻璃引来尸群合围。\r\n- 角色动向：\"以蟑螂为榜样\"的生存哲学确立，告别宅男身份。\r\n- 关键信息/扩写技法：离城路线逻辑（市中心堵死→江边）；潜行细节（酒味/30米安全距离）；蟑螂意象点题。\r\n- 逐章写法公式：告别仪式 → 出发 → 潜行游戏化 → 路线受阻 → 突然遇袭 → 合围绝境收尾。\n\n---\n\n# 末日蟑螂 第1-17章 最近的距离，最远的距离（摘要）\r\n- 情节点：被S型追逼翻上大巴顶；观察D2（青铜肤/两米多/撞动大巴）；弩箭破不了D2头壳；大巴被撞散；甩榔头挂防护栏，绳索将脱，吊在半空。\r\n- 角色动向：绝境利用环境求生；首次见识更高阶变异。\r\n- 关键信息/扩写技法：D2设定（吃人进化/装甲化皮肤）；\"车顶避难\"空间利用；黑色幽默（\"车震\"）减压。\r\n- 逐章写法公式：合围困境 → 避难所 → 观察BOSS → 攻击失效（反差）→ 环境逃生 → 半空绝境收尾。\n\n---\n\n# 末日蟑螂 第1-18章 风干腊肉（摘要）\r\n- 情节点：吊在防护栏上，窗内丧尸逼近；绝望自嘲（寻秦记老鼠啃藤蔓）；发现雨棚裂口逐层割开；最后一层是不锈钢雨棚，改砸膨胀螺丝，终翻上楼顶。\r\n- 角色动向：从歇斯底里（狂笑找老鼠）到机械坚持（麻木砸螺丝）。\r\n- 关键信息/扩写技法：绝境情绪三层递进（崩溃→安静→麻木）；用典故自嘲缓冲；问题分解思维（砸固定点而非钢板）。\r\n- 逐章写法公式：绝境罗列 → 心态崩塌 → 小转机 → 新绝境 → 灵光 → 脱险收尾。\n\n---\n\n# 末日蟑螂 第1-19章 又是它 + 第1-20章 逃出生天（边界表缺1-20行，合并）（摘要）\r\n- 情节点：楼顶杀女丧尸；借钥匙入陌生人家过夜（男童饿死干尸）；丰盛早餐并扫货；下楼见D2堵门；血印引敌、拆气窗结绳；半身卡窗险被D2抓头；坠楼砸丧尸，翻围墙逃出；江边独战十余丧尸（战力验证）；沙坑过夜，猫结石暖身。\r\n- 角色动向：生存能力大成（从怕6只到独战十余只）；\"杀怪不掉宝\"的反游戏化吐槽。\r\n- 关键信息/扩写技法：战力里程碑；D2堵门（威胁升级）；猫结石功能（发热保暖）；第一幕\"离城\"完成。\r\n- 逐章写法公式：夜宿异家（干尸冷峻）→ 补给 → D2再现 → 气窗极限逃生 → 坠楼脱困 → 江边独战 → 沙坑夜宿温暖收尾。\n\n---\n\n# 末日蟑螂 第1-21章 女人（摘要）\r\n- 情节点：两只大狗劫走七八斤熟肉香肠；大狗清空广场七八十丧尸（含S/D）；狗群离去；骑自行车行进（\"有车一族\"）；小卖部刺尸补货；本田车内发现活人（齐肩发女子）。\r\n- 角色动向：幽默吐槽（\"我没奶啊\"）；警惕性渐强（观察车内人影）。\r\n- 关键信息/扩写技法：变异动物与丧尸的猎食关系（狗吃脑浆/高级丧尸）；第一个幸存者线索；物资辛劳被狗夺走的戏剧反差。\r\n- 逐章写法公式：清晨遭遇 → 幽默危机 → 狗清场战力展示 → 骑行新阶段 → 补给 → 发现活人（新钩子）收尾。\n\n---\n\n# 末日蟑螂 第1-22章 杨可儿（摘要）\n- 情节点：张小强骑自行车赶路至下午三四点；本田车内发现活人（杨可儿），巴掌叫醒后让她开车逃跑，结果她不会开车；丧尸逼近，被迫载她骑自行车冲出包围；天黑前在小树林小溪边扎营；杨可儿讲述经历：病毒爆发当天与男友逛超市，躲进货厢近三个月，暴雨后丧尸进化、男友偷本田带她出城，途中下车喝花坛水呕吐变丧尸被啃食；张小强扔真丝被给她睡觉。\n- 角色动向：张小强迎来末日第一个活人同伴，从嫌弃、想甩掉到默认收留；杨可儿14岁少女，话痨缺心眼但活了下来，成为长期同伴。\n- 关键信息/扩写技法：病毒规则碎片补全（暴雨加速丧尸进化）；他人背景经历全部借杨可儿亲口转述带出（不切视角）；\"大叔\"称呼+丧尸vs怪物的争辩制造反差笑点；她用\"电影里的丧尸\"定义怪物，细节反衬真实末世。\n- 逐章写法公式：发现活人（意外钩子）→ 鸡同鸭讲喜剧 → 被迫合作逃亡 → 扎营夜话（背景补叙）→ 收留决定收尾。\n\n---\n\n# 末日蟑螂 第1-23章 偷看杨可儿洗澡（摘要）\n- 情节点：张小强守夜到天亮（不敢让她守夜）；杨可儿想洗澡又怕溪水含病毒；讲述中年幸存者喝花坛水后变丧尸的往事；张小强用溪水洗手示范证明安全；她下溪洗澡，他偷看并吐槽\"三无身材\"；她吐酸水疑似感染，实为怀孕——才14岁，男友已死；张小强从震惊到接受\"生下来就是\"。\n- 角色动向：两人从戒备到半熟；张小强由嫌弃转为\"带娃\"式责任；杨可儿身世揭底（14岁、怀孕、孤身一人），人物厚度增加。\n- 关键信息/扩写技法：病毒规则实战验证（雨水入腹必变异、皮肤接触无碍），用\"示范洗手\"演示而非科普；黑色幽默缓冲沉重信息（怀孕话题）；偷看桥段用吐槽化解油腻感。\n- 逐章写法公式：守夜日常 → 洗澡危机（规则验证）→ 偷看喜剧 → 怀孕重磅信息 → 态度转变收尾。\n\n---\n\n# 末日蟑螂 第1-24章 杨可儿引怪（摘要）\n- 情节点：两人骑车上路，杨可儿话痨惹烦；张小强吼她闭嘴后她大哭，哭声引来丧尸；路过被几十只丧尸围堵的客运大巴；S型丧尸拦路，张小强弃车迎战：军刀砍爪被震开、反握军刀刺入头顶又被头骨卡住，脚蹬肩膀才拔出；杨可儿在田埂上边跑边叫\"拉火车\"引怪，误打误撞拖住尸群；张小强把她扛回车上骑走，夜色中扎营。\n- 角色动向：张小强独立击杀S型丧尸，战力再验证；杨可儿无意暴露敏捷天赋（引怪跑位精准），为后续训练埋线；两人磨合出协作雏形。\n- 关键信息/扩写技法：S型丧尸爪子硬如金属（设定细节）；战斗写代价（军刀被震开、拔刀费劲、卷刃），胜利不廉价；\"引怪\"用游戏比喻降低血腥感、增加喜剧；他人行为全程通过主角观察呈现（不切视角）。\n- 逐章写法公式：上路日常 → 话痨喜剧 → 哭声招灾 → S型遭遇战 → 意外反转（引怪）→ 夜宿收尾。\n\n---\n\n# 末日蟑螂 第1-25章 打死我也不下来（摘要）\n- 情节点：篝火夜谈，张小强回答\"会不会死—会\"\"能不能保护我—不能\"，教她末世只能靠自己、明天开始训练；杨可儿从绝望到重燃求生欲；深夜张小强第三次\"莫名预感\"不安，全副武装守夜；变异羊角兽现身（约160公分、螺旋长角、怕火好奇）；弩箭射中额头不致命；火花惊吓下怪兽冲撞，铁枪枪头被撞断；张小强翻上兽背死抱不放：\"打死我也不下来\"。\n- 角色动向：张小强生存观成形（不承诺保护、教人自强）；杨可儿从\"等待被救\"转向\"想活\"，人物弧光启动；主角\"第六感预警\"第三次出现，作为特质反复铺垫。\n- 关键信息/扩写技法：生存说教借篝火对话自然带出，不喊口号；未知怪物先给局部轮廓（角、蹄）再给全貌，感官优先；撞断铁枪制造D2级力量对比，威胁不廉价；\"预感要倒霉\"建立主角被动警觉人设。\n- 逐章写法公式：夜谈（观念塑造）→ 预警不安 → 怪物亮相（局部→全貌）→ 攻击失效 → 死缠绝境收尾。\n\n---\n\n# 末日蟑螂 第1-26章 好大一块肉（摘要）\n- 情节点：一夜骑兽狂奔，张小强吐到只剩苦胆、左腿脱臼自己摸索接回；天亮后趁怪兽人立，用榔头砸弩箭尾将其钉入颅骨，怪兽倒地；宿营地原封未动，他倒在兽尸上睡去；醒来研究战利品：双角长近七十公分坚硬无比（军刀砍卷刃）、兽皮捅不烂，用钢弩箭凿角、单兵锹锯皮取下；推理链：大狗吃丧尸不变丧尸→动物免疫病毒→兽肉无毒可食；让杨可儿继续练蛙跳，晚上吃肉。\n- 角色动向：张小强完成极限体能战（脱臼自接的笨拙真实感）；首次获得异兽级装备（角、皮、肉），战力升级；杨可儿开始2000次蛙跳训练，正式进入\"培养\"轨道。\n- 关键信息/扩写技法：免疫推理链用主角内心推演完整呈现（狗→动物→肉），不靠旁白科普；战利品升级（弩箭→角+皮+肉）像游戏掉宝但不突兀；战斗余韵写代价（断枪、脱臼、卷刃），胜利有重量。\n- 逐章写法公式：骑兽绝境 → 体能极限 → 破局（砸箭入颅）→ 战利品研究 → 推理吃肉 → 新装备期待收尾。\n\n---\n\n# 末日蟑螂 第1-27章 叫我蟑螂吧！（摘要）\n- 情节点：张小强先烤小片兽肉试吃验证无毒，再让杨可儿吃，确认\"D病毒对人有害、对动物有益\"；杨可儿问名字，他回忆名字带来的嘲笑（蟑螂梗），下定决心\"就叫我蟑螂吧\"；割肉烤肉存口粮（百多斤生肉烤熟约四五十斤）；埋掉断成两截的铁枪；草木灰鞣制兽皮；路上让杨可儿跑步当锻炼；发现农田边落单丧尸，逼她第一次实战，递出铁榔头。\n- 角色动向：张小强完成\"改名仪式\"（蟑螂意象点题，告别过去身份）；杨可儿正式入队进入训练轨道；\"动物肉可安全食用\"经人体试吃验证，生存设定落地。\n- 关键信息/扩写技法：推理验证用\"自己试吃\"行动完成，风险感强；名字梗（蟑螂）作为全书意象记忆点；物资精确（百斤肉→烤熟四五十斤）具象化生存底气；断枪埋掉象征装备更替；教育观输出（不救只教，人只能靠自己）。\n- 逐章写法公式：吃肉验证 → 命名仪式（情感重击）→ 物资处理 → 赶路 → 实战逼练收尾。\n\n---\n\n# 末日蟑螂 第1-28章 杨可儿VS丧尸（摘要）\n- 情节点：杨可儿想用弩被拒，张小强以\"扔下她\"相逼；她磨蹭接近丧尸，丧尸扑来她尖叫逃跑；张小强钢珠警告\"再跑我就杀了你\"；她被迫回头，学会绕背周旋；丧尸被带倒她也摔（第一局平局）；试探两米内骚扰、闪避爪击（第二局略占上风）；一记撩阴脚+跳背疯狂砸榔头完胜（第三局完胜）；事后她一边抽泣一边念叨\"灭害灵喷死你\"；张小强把狙击弩递给她：\"你现在有资格用它。\"\n- 角色动向：杨可儿完成首次猎杀，从恐惧到自信膨胀（\"老娘杀他一万只\"）；张小强冷酷教学法见效，随后交付武器正式认可她；师徒关系确立。\n- 关键信息/扩写技法：成长戏用三回合递进（平局→上风→完胜）清晰可感；\"再跑就杀你\"极端教学建立末世生存观（没有谁是谁的救世主）；战后情绪释放（边砸边哭骂）真实不煽情；武器交付=信任仪式。\n- 逐章写法公式：逼战 → 逃跑受挫 → 强制回头 → 三回合升级战 → 战后崩溃 → 认可奖励收尾。\n\n---\n\n# 末日蟑螂 第1-29章 被夜袭了（摘要）\n- 情节点：张小强手把手教杨可儿用弩，她拿弩无意识乱瞄让他直冒汗；自行车前胎被划破，弃车步行；傍晚发现农田边农家小洋楼，踩肩爬二楼阳台开门入住（厨房空、水缸满、后院铁栅门落锁，推断房主带物资逃难）；烧水洗澡后分房睡；深夜张小强被铁管捅醒——土制猎枪和手电指着他，屋主回来了；屋主枪托砸脸，杨可儿端弩出来喊\"再动打死你\"。\n- 角色动向：两人获得久违的安稳夜宿（床）；张小强对\"屋内过夜\"有D2堵屋的心理阴影，权衡后仍选择房子；杨可儿关键时刻端弩护场（成长展示）；屋主身份与目的留白，冲突骤起。\n- 关键信息/扩写技法：环境勘察细节（水缸满/厨房空/后门锁）拼出屋主故事线（痕迹叙事）；屋主\"半夜偷回自家\"行为制造悬念；喜剧（踩头爬窗）与紧张交替控节奏；第一人称严格——猜屋主身份用\"莫非\"式推测，不越界。\n- 逐章写法公式：授弩教学（喜剧）→ 弃车步行 → 发现小楼 → 入楼勘察 → 安稳夜宿 → 夜袭冲突收尾。\n\n---\n\n# 末日蟑螂 第1-30章 神经病？（摘要）\n- 情节点：屋主调转枪口对准杨可儿，张小强扑救，枪响打上天花板；滚地夺枪、被掐脖险些窒息、一脚踹飞屋主，屋主逃下楼；天亮循后院黄土路追踪；发现山洞（洞口\"备荒备战\"大字、红漆三轮农用车、钥匙在油箱上）；进洞被青年用石块菜刀偷袭，他认定张小强是来抓自己的；追至采石场悬崖，青年哭诉：全家变异、当着他的面吃掉小侄儿，他杀光家人后一直活在自责恐惧中，随即跳崖自尽。\n- 角色动向：张小强经历濒死搏斗（夺枪/被掐脖）验证普通人战斗的狼狈；理解屋主是\"以为自己在末世犯了杀人罪\"的悲剧幸存者；心态沉重（\"这狗日的末世\"）。\n- 关键信息/扩写技法：夜袭悬念在此章解决并反转（屋主=受害者）；悲剧人物用癫狂言行+遗言交代全貌（不切视角）；\"备荒备战\"时代遗迹做世界观细节；夺枪战写实（混乱、误伤、无主角光环），胜利不廉价。\n- 逐章写法公式：枪口对峙 → 夺枪搏斗 → 屋主逃走 → 循迹追踪 → 山洞遭遇 → 真相与跳崖收尾。\n\n---\n\n# 末日蟑螂 第1-31章 大叔，你是个大坏蛋（摘要）\n- 情节点：下山见七座新坟（父向卫革、母黄秀、哥向伟、嫂陈香云、侄向家豪），补全青年悲剧全貌；回山洞开走红漆三轮农用车；洞内发现小型基地级物资：几百袋粮食（数万斤）、熏肉、近千斤白菜、梅干菜腌菜、十几只土鸡、清泉水潭；决定在山洞休整、训练杨可儿后向省城出发；回小楼搬床垫被褥；杨可儿换装打扮（马尾、丝巾、淡黄风衣），张小强调侃她口臭，自己换上黑灰羽绒服+老式军裤；开着满载三轮车回山洞。\n- 角色动向：张小强获得交通工具+物资据点，从流浪转为\"有家底\"；明确目的地省城（人终归是社会生物）；杨可儿少女心回归（打扮），师徒关系继续磨合；\"伪萝莉/三无身材\"梗收束。\n- 关键信息/扩写技法：物资清单精确到袋/斤（数万斤粮、近千斤白菜、十几只鸡），生存底气具象化；七座坟用墓碑文字交代悲剧（信息碎片，不切视角）；山洞\"备荒备战\"时代遗存增加真实感；目标明确（省城）开启下一段旅程。\n- 逐章写法公式：坟墓真相（沉重）→ 发现基地（惊喜）→ 决策休整 → 搬家用具 → 换装喜剧 → 新据点启程收尾。\n\n---\n\n# 末日蟑螂 第1-32章 虾米东西（摘要）\n- 情节点：张小强把削尖硬木棍套进兽角、铁钉固定做成兽角枪；试插地面竟钉进岩石，确认\"神兵利器，恐怕连D2都能穿透\"；开着三轮在附近村庄搜物资（首日三家几千斤大米）；河边小村发现上百只丧尸围死一栋小楼，判断救不了、决定趁机抢物资；尸群被引向桥头（两只S型打头）；张小强兽角枪贯穿第一只S型头盖骨，杨可儿弩箭射穿第二只眼眶（她\"那个东西\"来了，血腥味引来尸群）；他踹开桥栏、把三轮横在桥上、向杨可儿讨卫生巾做陷阱诱饵。\n- 角色动向：张小强新武器成型（兽角枪轻而锋利）；杨可儿首次弩杀S型（战斗配合成形）；\"救还是不救\"的内心抉择展示末世务实底线；卫生巾钓鱼计划成型。\n- 关键信息/扩写技法：武器设定实战验证（兽角能钉穿岩层，硬度具象化）；\"救还是不救\"内心纠结写主角务实不圣母；杨可儿生理期做笑点+设定伏笔（血腥味引尸）；桥栏+三轮+卫生巾构成低成本智慧陷阱（以小博大）。\n- 逐章写法公式：武器制作（性能验证）→ 搜物资 → 发现围村 → 救与不救抉择 → 尸群袭来 → 设陷阱收尾。\n\n---\n\n# 末日蟑螂 第1-33章 吃人（摘要）\n- 情节点：卫生巾挂枪头当诱饵，D型丧尸带头跳河，上百只丧尸层层叠成\"金字塔\"（最底下的D型被压得悲鸣）；进村搜物资，在小楼发现瘦成皮包骨的中年男人；喂兽肉救活后他讲述：WH市包工程的老板，年关提前回家过年，夫妻躲过感染但家中断粮，妻子先饿死，他被饿怕了开始吃妻子尸体活到现在；张小强把带来的几十斤大米腊肉留给他，男人用木匣手枪（五四式+3弹匣+约50发子弹）作交换，锁门后再没出现。\n- 角色动向：张小强低成本团灭百尸（\"果冻陷阱\"），智力爽点；面对\"吃人\"幸存者从厌恶到理解（换我未必不这样），人性灰色地带；获得手枪火力升级；杨可儿全程旁观。\n- 关键信息/扩写技法：黑色幽默陷阱战（卫生巾诱尸跳河）用荒诞化解血腥；吃人设定借亲历者自述呈现，主角不审判（道德灰色）；物资（米腊肉）换武器（手枪）等价交换自然合理；奢华小楼与皮包骨主人形成反差。\n- 逐章写法公式：陷阱收网（喜剧高潮）→ 进楼发现活人 → 救活叙旧（悲剧真相）→ 赠粮换枪 → 锁门诀别收尾。\n\n---\n\n# 末日蟑螂 第1-34章 别挑了，全部搬回去（摘要）\n- 情节点：清点五四手枪（空仓挂机试枪，3弹匣+约50发子弹）；村内大丰收：年关家家杀猪熏肉，共清点出熏猪肉约万斤、腊味山货近千斤，两人吃能吃百年；发愁熏肉放不久，想起外婆谷糠藏肉可存七八年，决定回村搬谷糠；杨可儿上楼找卫生巾时发现二楼\"劳保超市\"：九个货架摆满解放鞋、日用品、五金、内衣袜子、零食文具，香烟柜台下翻出十条十八块一包的黄鹤楼；张小强喊出\"别挑了，全部搬回去\"。\n- 角色动向：物资从\"够用\"升级到\"囤积\"阶段；张小强财迷本性+生存远见（谷糠储存、为物资越来越紧张做准备）；杨可儿物资眼光渐入（发现隐藏宝箱）。\n- 关键信息/扩写技法：物资数字精确（万斤熏肉/近千斤腊味/十条黄鹤楼）制造\"粮仓\"爽感；外婆谷糠藏肉=民间智慧设定（真实可信）；货架细节堆叠出末日购物爽点；\"全部搬回去\"金句收尾。\n- 逐章写法公式：试枪爽点 → 熏肉清点（数字堆积）→ 储存难题 → 民间智慧解围 → 超市扫货 → 金句收尾。\n\n---\n\n# 末日蟑螂 第1-35章 大叔我去洗澡啦，你要不要来看？（摘要）\n- 情节点：一周紧张搬运结束，粮食近二十万斤；搬回雅马哈单相柴油发电机（4桶半柴油，滑轮吊装+虹吸抽油解决）；物资清单：被褥衣物、商店货架全搬、十个半人高白酒壶（储水够两人用一月多）、防水大油布、十几只叫花鸡等；接电亮起白炽灯、玩上PSP，久违的文明感回归；杨可儿刷牙、洗澡前问\"你要不要来看\"，两人斗嘴；整装准备去WH市，杨可儿不舍安逸想留下，张小强说\"你可以一个人留下来\"；她改口\"你到哪我到哪，要死做一对同命鸳鸯\"；春雷炸响，大雨将至。\n- 角色动向：张小强从流浪汉变成\"有基地有发电机\"的土财主；宅男本质回归（PSP/无网感慨）；杨可儿依赖加深，两人口嫌体正直的羁绊成型；出发被大雨阻住。\n- 关键信息/扩写技法：物资清单+精确数字（近二十万斤粮/4桶半柴油/10个壶）把\"家底\"具象化；发电机、亮灯、PSP=文明符号，用物件写情绪（回到文明社会的感觉）；离别戏用斗嘴藏不舍；春雷收尾埋天气悬念。\n- 逐章写法公式：物资盘点（爽感）→ 发电机搬运（困难解决）→ 通电亮灯（文明回归）→ 出发准备 → 离别斗嘴 → 春雷收尾。\n\n---\n\n# 末日蟑螂 第1-36章 深挖洞广积粮（摘要）\n- 情节点：大雨阻行（上次雨连下11天让丧尸进化、动物变异，这次雨会带来什么未知）；张小强用修车铺找来的切割机把变异兽皮加工成皮甲；杨可儿肚子痛找厕所，被\"三不原则\"（不在通道、水潭、物资边）逼到平台最深处，摸墙摸到满手铁锈发现一扇锈死铁门；撬开铁门进入约千平大洞窟：空空荡荡，石壁上留着年代标语\"向伟大的领袖毛主席致敬\"\"一切帝国主义都是纸老虎\"\"深挖洞广积粮\"；杨可儿问是什么意思，张小强敷衍\"没事儿挖洞，有事儿钻洞\"。\n- 角色动向：雨季危机感建立紧张基调（进化压力未知）；张小强展示DIY制造能力（切割机+电钻加工皮甲）；杨可儿担当\"意外发现者\"；洞中洞悬念开启。\n- 关键信息/扩写技法：天气设定延续（雨=变异催化剂），借主角担忧带出进化压力；工具利用（修车铺切割机）展示普通人就地取材的求生；杨可儿\"摸到铁锈\"发现门=细节触发悬念（伏笔自然）；时代标语做世界观厚度；\"深挖洞广积粮\"标题双关。\n- 逐章写法公式：雨阻（危机基调）→ 手工日常 → 便便喜剧 → 意外发现铁门 → 撬门探洞 → 标语悬念收尾。\n\n---\n\n# 末日蟑螂 第1-37章 只是想睡觉？（摘要）\n- 情节点：大雨连下三天；杨可儿偷懒学孙悟空耍枪被抓；两人穿上缝了变异兽皮的迷彩服皮甲（张小强用武装带给杨可儿系腰，小女兵造型）；张小强接满一桶雨水，纠结喝不喝（回忆上次冰火折磨）；杨可儿误喝他八分满的雨水，只说\"有点想睡觉\"便倒头睡去；他提心吊胆守夜八小时（磨牙打呼、鼻涕泡虚惊），天亮才撑不住睡过去。\n- 角色动向：杨可儿疑似变异/免疫体质（喝雨水只犯困）；张小强责任感加重（准备在她变异瞬间动手，最终守着没下手）；皮甲装备完成。\n- 关键信息/扩写技法：雨水药效实验用\"误饮\"自然推进（杨可儿当试验品，喜剧与悬疑并存）；守夜戏写足生理细节（鼻涕泡/磨牙）用虚惊制造张力；\"渴望力量、不愿把希望寄托在运气上\"的心理独白交代主角变强动机。\n- 逐章写法公式：雨阻日常 → 训练喜剧 → 皮甲完成 → 接水纠结 → 误饮昏睡 → 守夜悬念收尾。\n\n---\n\n# 末日蟑螂 第1-38章 大叔你要负责哦（摘要）\n- 情节点：杨可儿醒来无变异迹象、精神反而更好；张小强二次试喝半杯雨水，只觉淡涩、当晚失眠；两人先后拉肚子（雨水有泻药成分），在洞底蹲坑互怼；杨可儿说\"你看到人家的那个啦，你要负责哦\"；追问下揭底：她以为被男友\"那东西\"沾到手上就会怀孕（楼上的姐姐们教的），14岁从不看生理卫生；张小强彻底无语。\n- 角色动向：雨水双效果确认（对杨可儿=强化+美容初显；对张小强=美容+拉肚子，效果打折）；杨可儿生理知识荒诞空白（笑点+人物特色）；两人在屎尿屁喜剧里关系更近。\n- 关键信息/扩写技法：雨水效果因人而异为后续设定埋伏笔；\"要负责\"梗推进关系又保持距离感；生理知识盲区用对话展示（不科普不说教）；拉肚子戏用互怼化解尴尬。\n- 逐章写法公式：醒来无恙（虚惊回收）→ 二次试喝 → 拉肚子喜剧 → 负责梗 → 知识盲区揭底收尾。\n\n---\n\n# 末日蟑螂 第1-39章 哎呦喂！我的腰（占位空章）\n- 情节点：本章为占位空章，正文仅有\"请记住本站域名:\"一句，无剧情内容；真正的第39章正文在 第2-39章（绝对序号0039）中，已在边界表标注。\n- 角色动向：无（无剧情）。\n- 关键信息/扩写技法：处理策略与批次01的1-19/1-20合并一致——占位页不单独成文，正文并入对应部-章处理。\n- 逐章写法公式：无。\n\n---\n\n# 末日蟑螂 第2-39章 哎呦喂！我的腰（摘要）\n- 情节点：清晨杨可儿容光焕发如太阳花，张小强照镜子发现自己变年轻（大叔→叔叔）；吃饭时杨可儿筷子一下戳穿碗底、徒手掰断螺纹钢枪身的兽角枪；她单手把百多斤米袋像气球一样提起转圈；按张小强要求把米袋扔过去，直接把他撞倒压伤腰；她自称\"咸蛋超人\"，主动给他做腰部按摩。\n- 角色动向：雨水强化实锤——杨可儿力量暴涨；张小强只获得美容+腰伤，反差怨念加深；\"叔叔\"称谓梗延续。\n- 关键信息/扩写技法：力量暴涨用日常小动作展示（戳穿碗/掰断枪/扔米袋），不写数据面板；\"变年轻\"侧面印证雨水美容功效；被米袋撞倒=主角不光环化，保持普通人对比。\n- 逐章写法公式：晨光日常 → 力量展示三连（喜剧升级）→ 误伤事故 → 超人自称 → 按摩收尾。\n\n---\n\n# 末日蟑螂 第2-40章 太阳出来喽（摘要）\n- 情节点：张小强对比自身（力量敏捷约提升两三成，比D/S型不虚，但见D2仍是菜）；怨念凭什么杨可儿变大力水手、自己变打不死的小强；她承诺\"谁欺负你我就打他\"；他反思不能吃软饭、男人要雄起；重试雨水毫无反应，推断雨水只有第一次有效（杨可儿=力量+美容，自己=美容为主）；把大半桶雨水当宝贝收起（\"给儿子留着\"）；雨停日出，杨可儿在阳光下欢呼，张小强心里发寒（\"男人碰了那东西会倒霉\"）。\n- 角色动向：能力分化设定明确（同水不同果）；张小强大男子主义+怨念喜剧；杨可儿从被保护者转向\"保护者\"（关系反转苗头）；天气转晴开启新阶段。\n- 关键信息/扩写技法：能力对比用自嘲写（D2面前仍是菜），战力不膨胀；雨水设定收束（第一次有效、因人而异），成为可携带资源；\"太阳出来\"意象=章节情绪转换；童工梗+儿子梗埋未来线。\n- 逐章写法公式：怨念对比 → 保护宣言 → 自尊反思 → 雨水实验 → 储水 → 日出收尾。\n\n---\n\n# 末日蟑螂 第2-41章 什么东西？（摘要）\n- 情节点：雨停第三天、四月烈日如盛夏，张小强带杨可儿开三轮农用车踏上寻路之旅；路边大树下休息时遭两只变异黄鼠狼从树冠偷袭，杨可儿一枪砸爆一只，张小强被第二只扑倒，用左臂挡喉、拳头硬生生砸死。\n- 角色动向：杨可儿战斗力首次正面碾压张小强（一枪秒 vs 肉搏半天）；张小强\"变强但仍是普通人\"的定位靠狼狈搏杀立住。\n- 关键信息/扩写技法：末世气候异常（四月的太阳像七八月）一笔带过却信息量大；变异动物≠丧尸的新威胁类型登场（会爬树、偷袭、有地盘意识）；搏杀写实——左臂挡喉、拳头砸到见白骨，胜利不廉价。\n- 逐章写法公式：环境描写（热浪压抑）→ 行进日常（角色互动）→ 树下休息（松弛）→ 偷袭危机（突变）→ 惨烈搏杀（高潮）→ 喘息收尾（留余韵）。\n\n---\n\n# 末日蟑螂 第2-42章 哇！好可爱呦（摘要）\n- 情节点：战后杨可儿笨手笨脚给张小强包扎（包成山梨状，用红笔写\"可儿出品\"+心形）；张小强细察尸体推断是变异黄鼠狼，兽皮能防军刀（庆幸之前把兽皮缝进衣服）；杨可儿剥皮处理猎物；树上探出三只小黄鼠狼幼崽，杨可儿被萌到尖叫，张小强意识到是闯入它们地盘才遭攻击。\n- 角色动向：两人\"大叔+未来老婆\"的斗嘴日常定型；张小强从孤僻宅男被杨可儿闹得活泛起来；杨可儿从累赘转向\"巧妇\"成长线。\n- 关键信息/扩写技法：包扎戏=低成本情感升温（笨拙+标记\"可儿出品\"），用细节替代表白；\"兽皮防军刀\"=物品价值锚点，为后文皮甲做铺垫；小黄鼠狼萌点=危机后的呼吸章缓冲。\n- 逐章写法公式：战后喘息（情绪）→ 包扎互动（情感）→ 尸体研究（设定）→ 幼崽出现（萌点）→ 地盘推论（规则）。\n\n---\n\n# 末日蟑螂 第2-43章 杨可儿发飙（摘要）\n- 情节点：张小强独臂开车（不放心杨可儿把三轮开成公路赛）；杨可儿一路撒泼抱怨不带走小黄鼠狼；发现小工厂楼顶有人舞红布条求救；张小强利用受伤血腥味引丧尸出笼，S型快丧尸+两只D型+四五十只普通丧尸倾巢而出；他故意崩开伤口把S型引离杨可儿，杨可儿砸飞S型、一枪横扫斩双D，剩下一堆炮灰。\n- 角色动向：张小强的战术头脑（引怪、用伤当饵、让强输出站桩）；杨可儿战力爆棚但鲁莽（\"太心急了\"点评）；\"男人引怪女人输出\"的搭配成型。\n- 关键信息/扩写技法：引怪战术写全流程（观察→等→钓→清），不靠蛮力堆爽点；S型接近S2的进化苗头（速度快、臂长过膝）埋升级线；\"枪是用来捅的\"伏笔（本章还在砸）。\n- 逐章写法公式：独臂开车（日常）→ 工厂发现（新场景）→ 战术布置（智）→ 尸潮出笼（紧张）→ 杨可儿无双（爽）→ 点评收尾（角色）。\n\n---\n\n# 末日蟑螂 第2-44章 不然我杀了他（摘要）\n- 情节点：杨可儿重新包扎并回忆她\"围尸游走、像削土豆\"的战斗天赋；进小工厂，谢远山（食品厂业务经理）激动讲述被困四个月、杀变异库管自保的经历；张小强疑心此人，与杨可儿约定轮流守夜；深夜张小强被踹醒，谢远山持狙击弩威胁：\"把那玩意放下，不然我杀了他。\"\n- 角色动向：谢远山首登场\"浓眉大眼、真诚感激\"——标准好人脸，为反转埋雷；张小强末世警觉性回归（对陌生人多疑）。\n- 关键信息/扩写技法：救人戏留尾巴（为何不在谢远山说话时细究漏洞），让读者跟主角一起大意；\"好人脸+救命恩人\"的伪善人设=反转弹药；守夜约定=读者已知隐患，制造\"等靴子落地\"的紧张。\n- 逐章写法公式：包扎温情（缓冲）→ 恩人登场（伪善）→ 背景讲述（信息）→ 守夜布置（隐患）→ 深夜挟持（反转钩子）。\n\n---\n\n# 末日蟑螂 第2-45章 不要再打他啦（摘要）\n- 情节点：谢远山撕下伪装——要杨可儿脱衣换张小强性命，还炫耀奸杀库管（四十岁女人）的细节，暴露\"国家没了法律没了\"的疯狂逻辑；张小强嘴上周旋拖延，趁其注意力被杨可儿吸引，一拳打裤裆、枪柄砸膝，五四手枪因没上膛哑火；杨可儿冲过来踩断谢远山四肢（\"四条腿包括中间那条\"）。\n- 角色动向：张小强绝境自救=冷静+阴损（粽子拳、攻击下三路）；杨可儿哭中爆发、护夫狠辣；谢远山=末世\"本我释放\"的反派标本（呼应46章弗洛伊德）。\n- 关键信息/扩写技法：反派自白式变态独白（奸杀细节）制造极致厌恶，为后面喂丧尸铺垫道德正当性；武器设定写实（五四不上膛打不响）——主角也会掉链子；\"坏人废话太多\"先立flag再应验。\n- 逐章写法公式：挟持对峙（危机）→ 变态自白（厌恶感）→ 假意屈服（骗反派）→ 绝地反击（翻转）→ 残忍收尾（情绪释放）。\n\n---\n\n# 末日蟑螂 第2-46章 有代沟了？（摘要）\n- 情节点：战后张小强靠杨可儿怀里教育她\"坏人废话太多、脑残女主才信坏人\"；深度自我检讨——山洞安逸+能力变强让他丢了警惕心，用弗洛伊德本我/自我/超我反思末世人性崩坏；决定\"不当好人也不当坏人\"；审问出谢远山趁杨可儿上厕所偷弩；宣布明天把谢远山喂丧尸；发现与杨可儿有代沟（她杀怪像打游戏毫无恶心感）。\n- 角色动向：张小强\"普通人底线\"成型（不当圣人也不做恶人）；杨可儿杀伐果断的本色显露（末世适者）；两人关系从\"捡到的小丫头\"深化为互相关心的搭子。\n- 关键信息/扩写技法：整章几乎零剧情推进、纯心理戏，却用\"检讨变强后的大意\"完成主角成长弧——用反思制造危机后的余韵；弗洛伊德理论做末世人性注解（本我释放）提升B格不拖节奏；\"喂丧尸\"的处置=以恶制恶，维持主角灰色人设。\n- 逐章写法公式：战后相拥（温情）→ 反派处决决定（狠）→ 自我检讨（成长）→ 理论反思（主题）→ 代沟调侃（收尾）。\n\n---\n\n# 末日蟑螂 第2-47章 杀我（摘要）\n- 情节点：深夜张小强自愈能力发作——万蚁钻身、酸麻痒胀伴电流感，无法动弹；他让杨可儿做十人份饭，天亮恢复后吃掉七只叫花鸡+一大锅饭；拖谢远山到围墙边空地喂丧尸，谢远山哀求\"给我个痛快，杀我\"，张小强冷眼旁观至其被啃食而死，自己却吐了苦水。\n- 角色动向：自愈能力升级设定落地（重伤后爆发、食量大增、力量每日增长）；张小强首次执行\"以恶制恶\"——做得出但看不下去，保持人性温度。\n- 关键信息/扩写技法：自愈场景用\"万蚁钻身+电流麻痒\"写生理折磨而非爽点；喂丧尸全程不写血腥过程、只写张小强呕吐的视角反应（间接恐怖）；\"杀我\"哀求=反派最后一句台词，狠辣又真实。\n- 逐章写法公式：夜间发作（能力）→ 大食恢复（设定）→ 拖行处刑（执行）→ 丧尸啃食（间接恐怖）→ 呕吐余韵（人性）。\n\n---\n\n# 末日蟑螂 第2-48章 又见D2（摘要）\n- 情节点：张小强驾车前往WH市（理由：省城驻军武警、幸存者多）；桥上发现撞护栏的金龙大巴+几十只丧尸，车门被整扇扯下暴露\"有进化丧尸\"的线索；D2（二次进化丧尸）现身，勾起上次大巴噩梦；张小强想跑，三轮车没油熄火，拉着杨可儿弃车逃；杨可儿不知厉害要迎战，张小强解释弩箭射不死D2。\n- 角色动向：张小强对D2的PTSD（赤手对坦克的比喻）；杨可儿\"打BOSS兴奋感\"的初生牛犊；WH路线=全书第一阶段目的地明确化。\n- 关键信息/扩写技法：环境推理（车门被扯=非普通丧尸）先给读者线索再揭答案；D2数据锚点（2.5米、皮厚如钢板、弩箭只能破皮）；\"没油熄火\"=末世资源管理铁律，主角也会被日常琐事坑。\n- 逐章写法公式：目的地动机（WH）→ 桥面侦察（推理）→ D2现身（恐怖）→ 弃车逃亡（狼狈）→ 队友分歧（冲突铺垫）。\n\n---\n\n# 末日蟑螂 第2-49章 爆菊（摘要）\n- 情节点：张小强大男子主义爆发走到杨可儿前面迎战；五四手枪六发五中D2毫无效果；杨可儿兽角枪砸大腿被反震晕厥；张小强情急把兽角枪捅进D2后门（螺旋纹=红酒开瓶器），被D2拖着原地转圈，上演\"老鹰抓小鸡\"；他不敢松手怕被拆骨头。\n- 角色动向：张小强\"为护小丫头忘记恐惧\"的舍命时刻；杨可儿大意扑街=鲁莽代价（晕在战场）；D2仇恨锁定（进化丧尸感觉敏锐、记仇）。\n- 关键信息/扩写技法：爆菊桥段把B级片恶搞做成招牌梗（开瓶器、遛狗比喻），黑色幽默化解绝望氛围；战斗写实——普通武器打不动就换非常规思路，符合末世求生逻辑；\"不敢松手\"的生死权衡=喜剧外壳下的真危机。\n- 逐章写法公式：迎战决心（情绪）→ 火力无效（绝望）→ 队友扑街（危机）→ 奇招得手（转折）→ 僵持转圈（悬念）。\n\n---\n\n# 末日蟑螂 第2-50章 再次爆菊（摘要）\n- 情节点：张小强悟出\"单手顺力遛狗\"战术，靠反复捅菊花让D2保持运动消耗体能；D2越来越慢最终趴窝，他疯狂摇枪身暴击；D2被激怒暴走抓他，松手后亡命田野，捡回螺纹钢枪身；引D2跳灌溉沟渠，D2掉进1.8米深水泥渠卡住，他开枪逼退，D2后退时菊花枪被水泥墙顶穿。\n- 角色动向：张小强持久战+地型利用的平民智慧；D2从\"无敌坦克\"被磨成\"可耗死的大BOSS\"，战力认知刷新。\n- 关键信息/扩写技法：\"遛狗\"比喻贯穿全章把惨烈战斗写成喜剧（哈欠、抱怨），节奏完全由作者掌控；体能消耗设定（丧尸也会累）给弱者留活路；掉沟渠=地形杀，环境即武器，无需新装备。\n- 逐章写法公式：战术成型（智）→ 持久消耗（节奏）→ 暴走危机（反转）→ 田野追逐（动感）→ 地形翻盘（胜利伏笔）。\n\n---\n\n# 末日蟑螂 第2-51章 醒醒！别睡了（摘要）\n- 情节点：张小强用兽角枪头抵石捅穿D2喉咙（前后夹击卡死）；D2挣扎砸弯枪身反把自己颈椎撕裂、头颅飞起——被自己的力气杀死；他踢D2头当足球反踢伤脚；拔不出卡在盆骨的兽角枪，捡回变形枪身；发现杨可儿趴在战场睡大觉（她跳车就被震晕、醒来直接在D2尸体前睡着），气得肝疼。\n- 角色动向：张小强完成\"从见D2就跑→单杀D2\"的里程碑（掐腿确认不是梦）；杨可儿憨睡反差萌+拖后腿喜剧；\"被自己力气杀死\"=阴差阳错的胜利逻辑。\n- 关键信息/扩写技法：里程碑战斗的胜利感不靠系统提示，靠\"掐腿确认不是梦\"的生理反应；战后处理（拔枪、捡装备）写实不省略；睡神梗=紧张剧情后最大的笑点缓冲。\n- 逐章写法公式：绝杀执行（智胜）→ 意外胜利（因果）→ 战后清点（现实）→ 发现睡神（喜剧）→ 叫醒闹剧（收尾）。\n\n---\n\n# 末日蟑螂 第2-52章 枪是用来捅滴！（摘要）\n- 情节点：张小强教训杨可儿\"枪是用来捅的\"——用巨石演示兽角枪捅穿40公分+螺旋纹搅碎骨头的原理，设想捅D2膝盖关节即可制胜；杨可儿一句\"一开始是你给我榔头叫我砸的\"反杀；杨可儿被迫去拔D2后门上的菊花枪（被\"下次用你的枪捅\"威胁），边拔边唱《菊花台》。\n- 角色动向：张小强的\"老师\"人设翻车（自作孽）；杨可儿嘴硬但听劝，战斗方式即将升级（捅+搅）；兽角枪真正用法揭晓=全书武器设定核心。\n- 关键信息/扩写技法：\"教育戏\"用实操演示（捅巨石）而非说教，规则具象化；\"教学翻车\"笑点=人设温度；武器升级逻辑（捅关节破防）为后续战斗提供新解法，读者可预期。\n- 逐章写法公式：质问开场（冲突）→ 演示教学（设定）→ 学生反杀（喜剧）→ 拔枪差事（恶搞）→ 菊花台收尾（梗）。\n\n---\n\n# 末日蟑螂 第2-53章 我爱你，老公（摘要）\n- 情节点：桥头引怪清场（张小强引、杨可儿乱杀包圆50只）；搜刮金龙大巴战利品（零食化妆品、BonMarche包、诺基亚新款手机）；手机里有漂亮小女孩照片+七条未读短信：2012年12月31日至2013年1月7日，妻子从\"外面的人发疯啦\"写到\"我看着他被吃掉……我爱你，老公\"——手机主人已死，妻子与猫喵喵还在家等他。\n- 角色动向：杨可儿女武神式战力展演（还是用砸，张小强放弃矫正）；张小强读短信后心里发闷——末世第一笔\"别人的故事\"，触发共情。\n- 关键信息/扩写技法：战利品戏=末世资源清单的变体（零食、化妆品、手机）；手机短信=教科书级\"遗物叙事\"——用日期递进写一个人从恐慌到绝望到告白的全过程，百字内完成一个悲剧；不发一言的读后感比抒情更有力。\n- 逐章写法公式：引怪战术（智）→ 无双清场（爽）→ 搜刮战利（物资）→ 手机发现（物件）→ 短信连读（情感爆点）。\n\n---\n\n# 末日蟑螂 第2-54章 内衣哪儿来的？（摘要）\n- 情节点：清晨手机闹铃唤醒（末世里的\"回到从前\"错觉）；杨可儿走光、被发现偷穿张小强私藏的情趣内衣，振振有词\"当封口费\"；搜大巴行李舱：山寨手机包（电池通用）、女士内衣包（私藏最性感款）、20万现金包（撒钞票雨被杨可儿嫌垃圾，张小强顿悟钱=纸片）、TNF冲锋衣+两台户外笔记本+太阳能充电包。\n- 角色动向：张小强财迷+闷骚人设（藏内衣、撒钱发愣）；杨可儿死皮赖脸占便宜但可爱；\"钱变垃圾\"=末世价值观第一课。\n- 关键信息/扩写技法：开箱戏=游戏式\"开宝箱\"期待感（第四个包是啥的悬念）；钞票雨意象=末世金钱观的视觉化呈现（红色伟人头像飘散）；笔记本+太阳能充电包=科技资源伏笔，为后文离线资料/电子地图铺路。\n- 逐章写法公式：闹钟日常（反差）→ 走光喜剧（笑）→ 内衣审讯（人设）→ 连开四包（物资）→ 钞票雨反思（主题）。\n\n---\n\n# 末日蟑螂 第2-55章 哥就是这样一个拉风滴男人（摘要）\n- 情节点：开往J城途中遇枪声惨叫——四个男人被S型丧尸追杀（拿八一式的何文斌子弹打光）；张小强两枪点杀两只伤残S型（\"一米内百发百中\"）；杨可儿弩箭救下险被抓脸的龙泉剑男；张小强反握军刀钉死扑来的S型，四人看呆吞口水；他惦记着八一式，决定\"等你死了再捡\"。\n- 角色动向：张小强战力展演（飞刀+手枪近距离百发百中），从菜鸟到\"拉风的男人\"；杨可儿对外冷漠化（谢远山事件后）；何文斌小队长登场（幸存者团队引子）。\n- 关键信息/扩写技法：\"不救人也杀丧尸\"的旁观者立场=真实末世利己逻辑，主角非圣人不圣母；飞刀=张小强苦练的技能线（磨刀石磨穿），技能有来源；八一式步枪=下章谈判的道具钩子。\n- 逐章写法公式：行路偶遇（事件）→ 旁观追逐（冷漠）→ 顺手点杀（战力）→ 飞刀救场（高光）→ 吞口水反应（装逼回响）。\n\n---\n\n# 末日蟑螂 第2-56章 WH的消息（摘要）\n- 情节点：何文斌（临时小队长）一行自报来历——劳改农场逃出（老实人放人、两狱警带一拨人分道）；广播称WH边有十几万人的幸存者聚集点，但WH方向被\"能把大客车拆开\"的怪物堵死（十个去八个死一个疯）；蔡全勇（张小强亲戚）无下落；张小强决定先跟何文斌回养鸡场聚落落脚观望。\n- 角色动向：张小强寻亲线开启（蔡全勇）；WH=目的地确认，但\"大怪物拦路\"=路线障碍；龙哥（聚落头目）名声初现。\n- 关键信息/扩写技法：情报全用对话自然带出（广播、道听途说），不搞信息面板；幸存率数字（900万→十几万）用主角心算震撼呈现；\"绕不过去\"=给主角行动强约束，制造路线选择。\n- 逐章写法公式：战后盘问（信息）→ 监狱背景（群像）→ WH情报（目标）→ 怪物堵路（障碍）→ 落脚决定（转场）。\n\n---\n\n# 末日蟑螂 第2-57章 点火（摘要）\n- 情节点：张小强飞投钢筋钉丧尸+手枪爆头立威（子弹心疼的反效果，何文斌送龙泉剑）；发现精卫剑（千锻纹、吹毛断发、砍丧尸不卷刃）；三子起子被上千丧尸围在未完工小区脚手架；张小强定火攻：加油站油罐车+旧轮胎+链条拖挂，轮胎浇汽油点燃滚下山坡。\n- 角色动向：张小强从\"被救者\"转\"指挥者\"（投名状逻辑）；何文斌一行死心塌地跟随；精卫剑=新武器升级（兽角枪之外第二件神兵）。\n- 关键信息/扩写技法：\"上千丧尸\"首见——用何文斌等人的颤抖+语言崩溃烘托规模（侧面写大场面）；火攻方案全流程（轮胎、汽油、链条、滚坡）写实可复现；精卫剑细节（千层浪钢纹、未开锋却削铁如泥）给道具立传。\n- 逐章写法公式：立威（地位）→ 宝剑入手（装备）→ 侦察困境（危机）→ 火攻构想（智）→ 点火执行（高潮前）。\n\n---\n\n# 末日蟑螂 第2-58章 成功救援！（摘要）\n- 情节点：燃烧轮胎滚入尸群引发连锁大火（橡胶难灭、丧尸互燃、D型S型四散）；张小强提精卫剑独闯尸群接应，何文斌尿裤子跟上；三子获救、起子吓傻抱铁管不放，张小强亲自爬上脚手架救下；回程听何文斌讲劳改农场突围往事（20多人+2狱警、弹药库死了6个）。\n- 角色动向：张小强\"孤身立威\"的高光时刻（投名状达成）；何文斌背景补全（吸毒老板顶包、无期入狱）——恶人也有悲情底子；聚落结构（龙哥为首）正式引出。\n- 关键信息/扩写技法：救援戏用\"何文斌尿裤子\"的失态反衬张小强镇定；角色背景用\"开车路上闲聊\"自然倾倒（场景移动=信息搬运）；\"不追问细节\"留白（何文斌话未完被打断），防信息过载。\n- 逐章写法公式：火海战局（场面）→ 孤身接应（英雄）→ 救下三子（成果）→ 爬楼救起子（再上一层）→ 回程交底（信息）。\n\n---\n\n# 末日蟑螂 第2-59章 千万别手软（摘要）\n- 情节点：到蒋胖子养鸡场（四米围墙、红漆字）；何文斌提醒小心陈义（入室抢劫杀一家八口判死刑、不服龙哥、可能找麻烦）；守门老毛子（奸杀幼女重犯）偷瞄杨可儿被警告；进小楼陈义要\"收编\"杨可儿，被张小强五四手枪指脑门，陈义立刻变脸称兄道弟；四个女人下楼泡茶、跪地捏腿，陈义大方\"看上哪个说一声\"。\n- 角色动向：陈义=笑面虎型反派（拿得起放得下、随时背后咬人）；杨可儿被觊觎=聚落危险信号；张小强武力立威后保持警惕。\n- 关键信息/扩写技法：聚落内部生态速写（红砖房男人吃鸡饲料、小楼女人被圈养）一页立起\"人性崩塌\"基调；陈义\"杀一家八口\"人物履历=恐怖标签；\"千万别手软\"=作者借角色之口给读者预告冲突。\n- 逐章写法公式：入寨（场景）→ 内部警告（伏笔）→ 老毛子（恶人速写）→ 陈义交锋（冲突）→ 美女阵仗（诱惑+危机）。\n\n---\n\n# 末日蟑螂 第2-60章 兄弟妻不可欺啊（摘要）\n- 情节点：陈义让红衣女人苏茜（原酒店大堂经理、被驯成\"狗\"）贴身伺候张小强——按摩、脱袜、摸大腿，张小强拒绝拉链戏码（\"不习惯在别人面前做这个\"），苏茜脸色惨白、陈义转阴，他补一句夸按摩手艺圆场；张小强送四条黄鹤楼做见面礼；陈义讲聚落规矩（敢抢物资吃大米、宅家吃鸡饲料）；龙哥（光头刀疤男、目光如实质）登场压制陈义，认出张小强是Y城老乡，随即盯着杨可儿一脸呆傻——杨可儿神色异常、拼命打眼色。\n- 角色动向：苏茜=被物化的女性符号（麻木、绝望、讨好），真实呈现末世性暴力；龙哥登场即压场（气场压制陈义）；\"龙哥盯杨可儿发呆\"=超大悬念钩子（与杨可儿身世相关）。\n- 关键信息/扩写技法：\"伺候戏\"用张小强视角写女人的麻木与恐惧（期望/害怕/绝望三种神色），不写情色写压迫；规矩对比（大米vs鸡饲料）一句话立起聚落等级制；龙哥最后一句\"你也是Y城人\"+盯呆杨可儿=三秒内连抛两个钩子。\n- 逐章写法公式：美人伺候（压迫感）→ 巧妙拒绝（主角底线）→ 送烟拉拢（江湖）→ 规矩揭示（世界观）→ 龙哥登场（新势力+悬念）。\n\n---\n\n# 末日蟑螂 第2-61章 我家的表叔数不清（摘要）\n\n1. 情节点：\n   - 客厅气氛诡异：杨可儿认出龙哥是自家表叔（\"小表叔你出来啦\"），众人呆滞\n   - 龙哥确认杨可儿是城哥女儿，回忆她小时候撒泼要钱的糗事，感慨\"怎么一下子长这么大了\"\n   - 张小强因杨可儿喊龙哥表叔差点滑倒，心里唱起\"我家的表叔数不清\"\n2. 角色动向：\n   - 杨可儿：找到亲人，性格跳脱（紧张到捏衣角→打破沉默→尴尬被揭糗事）\n   - 龙哥：从呆滞到如梦中，认亲后态度软化\n   - 张小强：吃醋式吐槽，警惕杨可儿暴露秘密基地\n3. 关键信息与扩写技法：\n   - 设定：龙哥与杨可儿父亲（ n# 末日蟑螂 第2-85章 凄惨的老毛子（摘要）\n\n1. 情节点：\n   - 张小强把轮胎山后的修理铺小院建成秘密落脚点（砸墙藏悍马、清库房、点轮胎可阻丧尸），四人吃上热乎饭\n   - 回养鸡场途中，老毛子（龙哥手下）见袁意起色心，咸猪手刚伸就被袁意一记关节技卸了右臂，还要补脚被张小强拉住\n   - 袁意杀意未消反手一掌停在张小强脸前，猩红双眼良久才退；老毛子滚到脚边又被踩断右腿\n   - 龙哥带人赶到，炮膛满目凶光走向袁意\n2. 角色动向：\n   - 袁意：从\"小绵羊\"到\"母暴龙\"的人设爆发（D型丧尸都敢肉搏），猩红双眼+失控杀意=毁灭欲外化；张小强拉住她=团队还需要分寸\n   - 张小强：建立秘密基地=独立意识成型（\"和一帮强奸犯杀人犯混在一起格格不入\"）；\"过客\"心态不想结死仇\n   - 老毛子：色欲熏心的路人反派，被拿来立袁意战力+激化团队矛盾\n   - 炮膛：新登场战力威胁，龙哥的打手代表\n3. 关键信息与扩写技法：\n   - 技法：用\"路人调戏\"事件引爆配角高光（袁意关节技细节：翻臂压肘咔嚓）；\"收与不收\"的张力（张小强拉一把 vs 袁意猩红眼神）=人物失控边界\n   - 设定：秘密落脚点+藏车=主角的底牌资源，为后续脱离团伙铺路\n4. 逐章写法公式：基地建设（资源沉淀）→生活细节→冲突引爆（色狼）→战力展示→杀意失控→援军对峙收尾\n\n---\n\n# 末日蟑螂 第2-86章 两清（摘要）\n\n1. 情节点：\n   - 袁意掏枪威慑炮膛（子弹打脚下+枪口瞄眉心），又当龙哥面踩废老毛子第三条关节；龙哥摸枪被袁意反指，僵持升级\n   - 张小强发话\"袁意下来吧\"，袁意犹豫后收枪归位（团队权威试炼）；警告杨可儿私下解决\n   - 张小强当面宣布\"袁意是我的女人，和以前没关系\"，陈义借机帮腔驳龙哥面子\n   - 展示物资（满车香米/苹果/油），上交2000斤米+80箱苹果+40桶油+红酒山货=袁意苏茜的\"赎身金\"，与龙哥陈义两清\n2. 角色动向：\n   - 张小强：用物资换独立权（\"谁也不欠谁\"）；在袁意失控和龙哥权威之间走钢丝，一手压袁意一手怼龙哥\n   - 袁意：彻底蜕变，枪口敢指龙哥；\"六亲不认\"但听张小强的话=唯一权威绑定\n   - 龙哥：威信受损，打哈哈掩饰；陈义：抓住机会挑拨，团队裂痕出现\n   - 杨可儿：担忧亲戚颜面+暗自记下不服\n3. 关键信息与扩写技法：\n   - 技法：枪口对峙戏用\"走火-威慑-僵持-收场\"四段式制造张力；\"上交物资=赎身金\"=末世的人际关系契约化（人情债量化）\n   - 设定：团队规矩\"上交部分其他自得\"=幸存者团体的资源分配制度；龙哥陈义的暗斗=内部权力线\n4. 逐章写法公式：枪口立威→权威挑衅→主角控场→物资展示→契约交易→关系两清收尾\n\n---\n\n# 末日蟑螂 第2-87章 刺客（摘要）\n\n1. 情节点：\n   - 张小强单留杨可儿问立场：\"龙哥要杀我你帮谁？\"杨可儿表态\"当然帮你，你是我老公\"，并透露家人也不喜欢这个表叔\n   - 收拾战利品（烟酒藏好、毛片缝进迷彩服里子防杨可儿翻）；复盘刚才故意不拦袁意=试探龙哥底气，结论\"他们外强中干\"\n   - 袁意照旧端水来伺候洗澡，态度平淡；张小强反而不自在（昨天弱者伺候理所当然，今天已让她做人却还照旧）\n   - 深夜刺客翻窗入室，被张小强被褥罩头+连踹制服，一刀割喉灭口——不问主使（龙哥陈义都可能，杀了最省事）\n   - 房间有死人睡不下，摸黑去杨可儿房间（兽角枪在桌上确认）\n2. 角色动向：\n   - 张小强：心机觉醒（\"谁说宅男就没有心机\"）；杀伐果断（不问主使直接灭口=末世生存逻辑）；对袁意身份转换的困惑=关系张力\n   - 杨可儿：年纪小但立场坚定（\"这辈子就跟定你\"），对表叔无好感\n   - 袁意：身份认知混乱（还当自己是仆从），是\"人格重塑\"未完待续的信号\n3. 关键信息与扩写技法：\n   - 技法：夜袭反杀写\"预判+干脆\"（被褥罩头=低成本制敌），主角不废话直接杀=末世狠劲立住；\"藏私房钱\"式细节把毛片梗用得自然\n   - 设定：问立场=团队忠诚度测试；刺客身份成谜=内部权力斗争的暗线钩子\n4. 逐章写法公式：忠诚测试→物资隐藏→复盘心机→关系困惑→夜袭反杀→灭口移房收尾\n\n---\n\n# 末日蟑螂 第2-88章 今天就在你们这睡（摘要）\n\n1. 情节点：\n   - 现世报：张小强进杨可儿房间被被褥罩头+踹胸——袁意把他当成刺客了（门把手转动时就醒了），两人黑暗中过招（倒挂金钩踢刀/勾脚别腿），袁意差点折断他手指\n   - 认人（冷香）化解误会；张小强丢脸但嘴硬，\"我房里死了人，今天就在你们这睡\"，脱衣上床，语气平常得让人以为说\"房里有老鼠\"\n   - 晨醒：有人用口舌服务小小强（袁意或苏茜，苏茜嘴角残留物+讨好神色暗示是她）；杨可儿像小猪趴怀里，被捏鼻子叫醒训练\n   - 训练第二天：袁意苏茜肌肉酸痛落队；张小强给袁意\"上桌吃饭\"资格=身份转变的公开宣告\n2. 角色动向：\n   - 张小强：武力值不低（黑暗中连招应对），但被袁意制服=大男子主义受挫把她拉黑名单（口嫌体正直）；把死人说得像\"房里有老鼠\"=末世麻木感\n   - 袁意：警觉性高（门把手响就醒），身手已全面反超；苏茜：讨好+暗中接近（口舌服务）的心机暗线\n   - 杨可儿：睡死体质（D2都喊不醒），对张小强主动来找喜出望外\n3. 关键信息与扩写技法：\n   - 技法：误会式打斗戏=反转喜剧（刚用这招收拾刺客，转身被同一招放倒）；\"现世报\"吐槽调节节奏；晨醒服务细节暗写三人关系（不点破=留白）\n   - 设定：训练体系落地（第二天肌肉酸痛=真实成长曲线）；\"上桌吃饭\"=末世阶级地位的仪式化转变\n4. 逐章写法公式：误会冲突（复刻式反转）→认人化解→同床共枕（关系杂糅）→晨醒服务（留白）→训练+身份宣告收尾\n\n---\n\n# 末日蟑螂 第2-89章 单挑（摘要）\n\n1. 情节点：\n   - 早餐桌上，龙哥皮笑肉不笑试探昨夜\"老鼠\"；张小强用\"拍死一只老鼠\"双关回应，双方心照不宣\n   - 炮膛嘲讽袁意\"母狗爬上餐桌\"，袁意猩红双眼+舔唇亢奋=杀戮信号；她以眼神请示张小强，张小强放行：\"动手可以，不动武器，不伤人命\"\n   - 单挑开打：炮膛重拳被袁意闪避+关节技反制（力气大被挣脱），袁意穿裆滑行+扫堂腿、撞腰眼把炮膛撞进液晶电视屏\n   - 炮膛拆屏砸人+疯牛式破坏家具，袁意游走找破绽；炮膛变爪抓衣领，左拳直取面门\n2. 角色动向：\n   - 张小强：借袁意之手立威（\"炮膛不过龙哥一个打手\"）；嘴上放行实为敲打龙哥势力，拇指搭刀随时救援=隐性掌控\n   - 袁意：战斗直觉强（躲拳+穿裆+扫堂腿），冷静寻找破绽；对炮膛这类\"看不起她的人\"杀意最盛\n   - 炮膛：力量型莽夫，被小个子女人压制后发狂，破坏狂人设（拆家具/扔电视）\n   - 群像：何文斌装聋作哑（靠龙哥吃饭）、杨可儿蹲椅子上骂炮膛不要脸、龙哥陈义冷眼旁观\n3. 关键信息与扩写技法：\n   - 技法：打斗分镜清晰（闪避→关节技→穿裆→扫堂腿→撞飞），节奏快慢交替；\"拍死老鼠\"式黑话对话=成人世界的试探艺术\n   - 设定：单挑规则（不武器不人命）=团队内部冲突的边界；袁意\"以眼神请示\"=主从关系新形态\n4. 逐章写法公式：暗流试探（双关对话）→挑衅升级→授权单挑→动作戏（闪避反击）→对手发狂→新回合收尾\n\n---\n\n# 末日蟑螂 第2-90章 住手（摘要）\n\n1. 情节点：\n   - 袁意被拧衣领后双脚踏胸反制（衣服被撕开露小背心），她干脆脱掉上衣继续打；炮膛发狂想抱摔她，被袁意让手抱臂+横跨绊摔，一头撞碎玻璃酒柜\n   - 炮膛右眼插碎玻璃，袁意要踩断他腿，龙哥喊\"住手\"无效——咔嚓一声腿断；陈义当和事佬（暗示何文斌等人作证炮膛先砸人），秃鹫嘴角冷笑\n   - 龙哥阴阳怪气提醒\"袁意是我送给你的\"；张小强脱衣给袁意披上（\"别随便脱衣服\"），假意骂袁意几句给龙哥台阶，并宣布\"休整几天就上路\"\n2. 角色动向：\n   - 袁意：冷血执行（龙哥喊住手也照踩），唯一动力=让张小强看到自己有用；披衣时嘴角微翘=被在乎的暗喜\n   - 张小强：护短（\"自己人\"）+掌控全局（给台阶/宣去意）；吃醋心理（\"凭什么给别人看\"）=口嫌体正直的感情线\n   - 炮膛：一代凶人被女奴打成残废，颜面扫地=龙哥势力受挫的具象化\n   - 龙哥/陈义：龙哥威信进一步流失，陈义借当和事佬巩固中间人地位；秃鹫冷笑=陈义派系的态度\n3. 关键信息与扩写技法：\n   - 技法：单挑收尾用\"喊住手照踩\"写袁意的失控边缘+张小强的默许；\"又一个飞翔的男人\"=前文梗复用制造喜剧落差\n   - 设定：张小强公开去意=与龙哥阵营的切割倒计时；龙哥内心\"他再不走就除掉他\"=暗杀线伏笔\n4. 逐章写法公式：危机反制→撕衣爆点→抱摔终结→残废立威→和事佬调停→披衣关怀→宣告去意收尾\n\n---\n\n# 末日蟑螂 第2-91章 龙哥和陈义（摘要）\n\n1. 情节点：\n   - 反派视角专场：龙哥陈义私下商量——刺客尸首不用找（\"那小子心狠手辣\"），炮膛废了、何文斌怕他、秃鹫靠不住，拿张小强没辙\n   - 陈义献策\"用粮库当诱饵\"：让张小强清掉粮库怪物，龙哥搬进粮库发展势力（粮食几千吨吃到死，再攻监狱弹药库称霸J城）\n   - 交易条件：出300粒子弹+几个女人+一支好步枪，换张小强打粮库；龙哥咬牙答应\"就算把所有女人都要过去都行\"\n   - 张小强这边：找匠人做长枪/狼牙棒/狗腿刀/盾（用两袋香米当定金，威胁质量不行不给尾款）；发现菜园寸草不生——末世植物停止生长，人类存续危机伏笔\n2. 角色动向：\n   - 龙哥/陈义：利益算计立体（刺客灭口/粮库计划/子弹交易），反派不是无脑恶，是有成本思维的枭雄\n   - 张小强：武器定制=战斗体系升级；用物资定价权拿捏匠人=末世阶级关系的缩影\n   - 袁意：学做饭认真=身份转型努力；杨可儿：砸弯兽角枪（把丧尸当地鼠敲）的莽撞可爱\n3. 关键信息与扩写技法：\n   - 技法：切反派视角写\"如何算计主角\"（威胁感来自被盯上）；粮库交易=双赢局面的钩子（主角得资源/反派得粮库）\n   - 设定：植物停止生长=比丧尸更可怕的长期危机，世界观从\"生存\"升维到\"存续\"\n4. 逐章写法公式：反派密谋（算计）→交易筹码→主角侧武器升级→匠人关系→生态危机伏笔收尾\n\n---\n\n# 末日蟑螂 第2-92章 哇！好多哟！（摘要）\n\n1. 情节点：\n   - 小院菜地下发现秘密地窖：水泥甬道→天然溶洞空间，内有柴油发电机、机械工作台，成千上万张盗版光碟（女优/游戏/电影），原是个盗版光碟加工窝点\n   - 张小强从\"找到宝\"的兴奋到\"想骂娘\"（末世里娱乐没意义），杨可儿扑上碟堆荤素不计全收\n   - 苏茜请求\"我也能开始杀怪物吗\"；张小强警告\"不给任何帮助，被吃了我也不会管你\"（实际计划她受伤就杀掉让她解脱）\n   - 决定把地窖改造成隐蔽所（搬物资/加厚铁板/备水备电磁炉）；杨可儿罢工抗议\"你虐待童工\"\n2. 角色动向：\n   - 苏茜：心机人设全面展开（\"男人喜欢弱势女人\"\"我要压过袁意一头\"），争取杀怪=摆脱女奴身份的机会\n   - 袁意：对苏茜冷淡（哪怕苏茜曾为她求情），\"两个世界的人\"；专心学做饭转型\n   - 张小强：松鼠式囤积人格（\"自己会有孩子，孩子也会有孩子\"）；对苏茜的\"狠话+暗保\"两面手段\n   - 杨可儿：没心没肺（碟堆寻宝+罢工撒泼），\"虐待童工\"梗\n3. 关键信息与扩写技法：\n   - 技法：反转式发现（以为是宝库结果是碟片山）；苏茜视角整段内心独白=配角立体的写法示范（她不是工具人，有自己的算计）\n   - 设定：地窖隐蔽所=主角新基地（有电力/可扩展），\"藏物资\"主题延续；碟片窝点=末世前的社会切片\n4. 逐章写法公式：意外发现→落差反转→配角请求（心机揭秘）→基地改造决策→搬运冲突收尾\n\n---\n\n# 末日蟑螂 第2-93章 就它了，去吧！（摘要）\n\n1. 情节点：\n   - 杨可儿罢工，张小强曲线救国：用\"以后会有孩子、孩子的孩子，得给他们存粮\"忽悠她搬货，还编\"青春不老泉\"哄她（满嘴跑火车），杨可儿被\"为了小宝贝\"激励成搬运主力，甚至想进城把丧尸杀了搬空超市\n   - 地窖清空碟片机械后约200多平，可容十几人生存；苏茜请求出战，张小强给平台不给帮助（她害怕但必须自己迈出那一步）\n   - 世界危机补全：丧尸已出现四个月，变异兽在二次发育（大狗一个月从1.6米长到1.8米），有智慧会隐忍偷袭\n   - 路边随机指一只丧尸：\"就它了，去吧！\"\n2. 角色动向：\n   - 张小强：忽悠式管理（拿杨可儿当童工还编瞎话），\"过犹不及\"踩刹车；对苏茜的严苛=物竞天择的末世价值观\n   - 杨可儿：天真好哄（为没影的儿子女儿操心生男生女），但\"进城抢空超市\"的提议暴露她的暴力潜力\n   - 袁意：站在张小强身后三米看背影发呆=依赖感具象化\n   - 苏茜：双腿微颤仍握紧榔头，第一次直面丧尸\n3. 关键信息与扩写技法：\n   - 技法：用\"育儿忽悠\"把枯燥的搬运任务写成喜剧对话戏（怪蜀黍vs小萝莉）；\"青春不老泉\"的荒诞=底层小人物式幽默\n   - 设定：变异兽进化时间线（4个月/二次发育/有智慧）=后期威胁升级的预告；地窖改造=基地建设细节\n4. 逐章写法公式：冲突化解（忽悠喜剧）→基地扩容→新成员试炼铺垫→世界观威胁升级→试炼开场收尾\n\n---\n\n# 末日蟑螂 第2-94章 种子（摘要）\n\n1. 情节点：\n   - 苏茜首杀：观察丧尸弱点→绕圈当\"吊在驴头前的胡萝卜\"→把丧尸引进电缆沟→一榔头砸开颅骨；杀完虚脱坐地，但获得了\"抬头说话的权利\"\n   - 出发去小型集市：苏茜介绍地形（小镇山脚、高速带动、工地饭馆聚集），提到有家种子店\n   - 张小强激动：种子=未来命脉（\"千年莲子都能发芽\"），只要保存好就是传家宝级资源，决定今天抢定种子店\n   - 抵达小镇：山脚百户人家、小河包围集市、对岸客运站空地几十只丧尸游走、白骨和骷髅头\n2. 角色动向：\n   - 苏茜：从女奴到\"能杀丧尸的人\"的蜕变完成（用脑取胜：弱点+地形）；性格铺垫（曾为父求医独自跑小镇，熟悉道路）\n   - 张小强：识货（种子=金山），末世观从\"囤物资\"升级到\"囤希望\"；风险评估（千只丧尸可能团灭）与贪婪并存\n   - 杨可儿：恐怖电影当背景音（车里尖叫连连），末日麻木感的黑色幽默\n3. 关键信息与扩写技法：\n   - 技法：首杀戏写\"观察-引诱-地形杀\"三步骤，突出苏茜用脑而非蛮力；种子店=新目标钩子（比粮食更高阶的资源）\n   - 设定：末世农业生产停滞（配合前文植物不生长），种子=未来复兴的稀缺品，主题从生存升维到文明延续\n4. 逐章写法公式：新人首杀（智取）→新目标（种子）→地形情报→抵达现场（环境描写+丧尸分布）→开战前奏\n\n---\n\n# 末日蟑螂 第2-95章 看，那是什么？（摘要）\n\n1. 情节点：\n   - 清剿客运站停车场：袁意抢了张小强的S型丧尸猎物（卸胎棒绞爪+砸颈椎，干净利落），张小强心里骂\"吃了春药这么猛\"；苏茜捡漏（无头丧尸砸中目标）\n   - 扫荡小餐馆发现异常：所有食物物资都被取走（米桶一粒不剩、储物柜空空）——有活人绕过丧尸搜刮过\n   - 张小强从厨房窗户看到排污渠：沥青状黑色胶质+垃圾尸体的生化臭气，被熏到干呕（\"比丧尸还恶心\"）\n   - 杨可儿用望远镜发现活人：\"看，那是什么？有活人也\"\n2. 角色动向：\n   - 袁意：战力碾压（单杀S型），主动出击不再等命令；张小强酸溜溜但认可\n   - 苏茜：首杀后再杀一只（捡漏也是本事），团队融入加快\n   - 张小强：对\"活着的人\"态度复杂（先想躲开，结果被对方看见）；被臭味干呕的狼狈=主角不神化的真实感\n   - 杨可儿：望远镜乱瞄=寻宝潜质，引出幸存者线\n3. 关键信息与扩写技法：\n   - 技法：战斗用\"战果分配\"一笔带过（谁杀了几只），突出团队效率；\"食物被提前取走\"的细节=幸存者存在的推理线索（翻窗思维）\n   - 设定：排污渠生化臭气=末世环境恶化的具象（人类活动停摆后的次生污染）；S型丧尸=进化型威胁的常规化\n4. 逐章写法公式：速战速决（团队分工）→异常发现（物资被搜）→推理线索（翻窗）→恶臭冲击（生理反应）→幸存者发现收尾\n\n---\n\n# 末日蟑螂 第2-96章 禽兽老头（摘要）\n\n1. 情节点：\n   - 山包平房外挂着\"疑似胸罩\"的红布条信号；张小强用杨可儿的香水丝巾蒙鼻，绕过排污渠前往（发现绕远路是白瞎，广告牌后直通停车场）\n   - 铁门锁着但屋里没动静（门把手无灰=有人住）；砸窗后传来女人惨嚎，张小强踹开抵门的柜子进宅\n   - 屋内惨状让张小强直接呕吐——老头吃人；他从后门逃出，张小强狂追，一脚踹断他的腿\n   - 张小强不急着杀，让老头看着自己穿出皮肉的断骨哀嚎（\"只有真正丧尽天良的家伙才慢慢折磨，像谢远山和眼前的老头\"）\n2. 角色动向：\n   - 张小强：人设边界确立——对敌人痛快，对\"吃人者\"零容忍慢折磨；\"找媳妇\"的自我调侃=底层人逻辑下的正义感\n   - 老头：末世人性之恶的具象（吃人），成为\"人心比丧尸更可怕\"的实证\n   - 世界观补全：前文龙哥等人（女奴/鸡饲料）被对比成\"慈善家\"——人性光谱的灰度描写\n3. 关键信息与扩写技法：\n   - 技法：恐怖氛围三段递进（锁门无动静→砸窗惨叫→屋内惨状呕吐）；用\"张小强见过各种恶仍被震惊\"反衬事件程度\n   - 设定：幸存者信号（红布条）=末世求助暗号；\"吃人\"=人性底线议题，为后续\"人心更可怕\"主题定调\n4. 逐章写法公式：异常信号→冒险接近→恐怖氛围→惨状揭露（恶心冲击）→凶手逃亡→追捕折磨→人设边界确立\n\n---\n\n# 末日蟑螂 第2-97章 于神医？（摘要）\n\n1. 情节点：\n   - 老头求生欲极强：自己处理断腿（割裤止血/服保命丹脸色回红润），掏出祖传\"鱼腥土\"（撒血上变醒神香，遮血腥味，连狗/吃人的都闻不出）当买命筹码；张小强踢昏他，没收背包\n   - 战利品：不明材质匕首（角柄微凉转温）、保命丹等药瓶、一卷小篆竹简（看不懂先收）\n   - 回到屋内直面惨状：女人被锯断四肢（齐根而断）、割去双乳，卡在木板洞上，身下搪瓷盆接排泄物——老头把她做成\"存粮\"（人彘）\n   - 苏茜认出老头身份：\"于神医？\"（曾为父求医的老中医），跪地呕吐\n2. 角色动向：\n   - 张小强：对残忍的愤怒（\"千刀万剐的老王八蛋\"）；贪婪与原则并存（收鱼腥土但绝不放人）\n   - 老头（于神医）：反转人设——救死扶伤的老中医沦为吃人恶魔，\"医者仁心\"的彻底背叛；求生手段展示他的医术（止血/保命丹）\n   - 苏茜：旧识相认的冲击（她曾求医的人竟是凶手），世界观碎裂\n3. 关键信息与扩写技法：\n   - 技法：先写老头\"医术高明\"的求生戏，再揭他吃人——用专业能力反衬恶（会医术的人最懂怎么\"保存\"人）；\"人彘\"现场用器物细节（漏斗/木棍/搪瓷盆）写透而不直说\n   - 设定：鱼腥土=遮味神器（后期潜行道具）；竹简=神秘传承线索；\"存粮\"式罪恶=末世人性堕落的天花板\n4. 逐章写法公式：反派自救（技能展示）→买命交易被拒→战利品（道具伏笔）→惨状直击→身份反转（旧识）→呕吐收尾\n\n---\n\n# 末日蟑螂 第2-98章 一个人的世界（摘要）\n\n1. 情节点：\n   - 张小强亲手掐死被做成\"存粮\"的女人（她的眼神满是乞求，死后面容安详带笑）——\"不只是丧尸吃人，人也开始吃人\"\n   - 他眼神从愤怒变成\"冰\"（从未有过的寒意），袁意被吓得几乎失禁、苏茜对世界绝望、杨可儿只觉可怕仍跟着找宝\n   - 决定清算所有沾过\"人肉盛宴\"的人（\"作为一个人，他就有理由这么做\"）\n   - 一间间抄家搜人，最后一间锁着的小屋：床上坐着个光着身子的十一二岁小女孩，眼神空洞望着墙壁——\"她所有的世界就是她目光尽头的墙壁\"\n2. 角色动向：\n   - 张小强：从愤怒到\"冰\"的转变=人物黑化的阈值线；亲手送女人解脱=底线与悲悯并存；\"清算\"宣言=正义执行的开始\n   - 袁意：对张小强的恐惧加深（蔓藤依附者的自我认知），吓得汗毛倒竖\n   - 苏茜：世界观崩塌（\"粮食丰足的情况下吃人\"），对整个世界绝望\n   - 小女孩：极端创伤的受害者形象（赤裸+失神），成为本章情感重锤\n3. 关键信息与扩写技法：\n   - 技法：把\"掐死\"写成慈悲（安详的微笑=解脱），用情绪翻转冲击读者；\"眼里的冰\"意象替代愤怒描写=更高级的压迫感写法\n   - 设定：\"人吃人\"从传闻变成亲历，主角的正义观被彻底激活；发信号者另有其人=悬念（谁在求救/帮凶身份）\n4. 逐章写法公式：慈悲处决→情绪冻结→恐惧传染（三人反应各不同）→清算宣言→抄家搜索→惨状新发现收尾\n\n---\n\n# 末日蟑螂 第2-99章 只要能活下去（摘要）\n\n1. 情节点：\n   - 屋内两个受害女孩：12岁妹妹被折磨到失神（烟疤/牙印/见男人就张腿），17岁姐姐被铁链锁在床脚（红胸罩绑竹竿从瓦缝求救=之前看到的信号）\n   - 姐姐讲述真相：父亲打工在外，母亲腿疼请于神医看病被困；老头下麻药制服母女三人，用母亲要挟姐妹就范，吃了母亲还让妹妹看着（\"谁不听话就吃掉\"），妹妹从此变傻\n   - 张小强放话\"明天杀老头\"，问姐妹去处；姐姐跪求带上，甚至脱衣交易\n   - 张小强答应带她们走但明说\"会把你交给别人（养鸡场）\"；姐姐：\"只要能活下去，我们做什么都行\"\n2. 角色动向：\n   - 张小强：冰寒消退但现实冷酷（不带累赘，送去养鸡场=明知是火坑的妥协）；\"啼笑皆非\"的人性观察\n   - 姐姐：用身体做最后筹码的绝望求生，仍有清醒判断力（观察到张小强给妹妹盖被才安心）\n   - 妹妹：创伤后应激的具象（布偶化），成为\"人祸比尸祸更重\"的铁证\n   - 于神医：恶的完整链条（好色→下药→吃人→折磨），谢远山都比不上\n3. 关键信息与扩写技法：\n   - 技法：借受害者之口补齐故事全貌（回述式信息交代），\"妹妹回来说了句'妈没死'就再没说话\"=留白式残忍\n   - 设定：求救信号（红胸罩+竹竿）首尾呼应；\"送养鸡场\"=末世救援的灰色地带（救≠救到底）\n4. 逐章写法公式：惨状细描→受害者口述真相→主角决策（冷酷权衡）→交易达成→\"只要能活下去\"主题句收尾\n\n---\n\n# 末日蟑螂 第2-100章 耶稣受难记（摘要）\n\n1. 情节点：\n   - 姐姐夜跪谢恩：\"明天杀那个老混蛋一定要多割几刀\"；妹妹依旧空洞（见到死母也无反应）\n   - 张小强布置\"耶稣受难记\"处刑：挖坑填积水、埋十字架、抽两吨汽油+干柴，把老头钉上十字架、披白床单划几十刀\n   - 血腥味引来千只丧尸挤满小桥（S型被尸群挤成乌龟）；姐姐吓到失禁，妹妹却第一次主动抓住姐姐衣摆、死盯着\"圣子状\"老头\n   - 团队四人反应特写：杨可儿跃跃欲试（不能砸千只地鼠心痒）、袁意进入杀戮迷醉状态（猩红眼/舔唇/磨腿）、苏茜自认懦弱心生嫉恨与绝望\n2. 角色动向：\n   - 张小强：处刑仪式感拉满（\"耶稣待遇\"=以恶制恶的黑色正义），血祭引尸=借尸清理的战术思维\n   - 妹妹：空洞中唯一一次情绪波动（盯着老头嘴唇哆嗦）=创伤记忆的出口，暗示复仇欲望\n   - 袁意：杀丧尸=纯粹享受的人设强化（对比人类内斗的\"规矩\"束缚）\n   - 苏茜：自我否定与嫉恨（\"永远追不上袁意\"），对\"被淘汰\"的恐惧\n3. 关键信息与扩写技法：\n   - 技法：千尸压境的群像反应戏（四人各写一段内心）=同一场景多维呈现的教科书写法；\"耶稣受难记\"处刑=意象化复仇，视觉冲击力强\n   - 设定：血腥味引尸=末世世界观的物理规则（前期铺垫鱼腥土的用途在此呼应）；S型在尸群中的限制=进化型并非无敌\n4. 逐章写法公式：复仇铺垫（姐姐求情）→处刑布置→血腥引尸→尸群压境→四人反应对比→新危机收尾\n\n---\n\n# 末日蟑螂 第2-101章 D2（摘要）\n\n1. 情节点：\n   - 处刑计划翻车：千只丧尸被桥头卡死过不来（只零散过来十几只），张小强干瞪眼（\"玩战略游戏从没赢过\"的自嘲）\n   - 杨可儿撒娇要\"晨练\"，获准\"只准打过了桥的\"；三个女人主动冲杀——杨可儿兽角枪抡圆清场、袁意卸胎棒勾颈开瓢、苏茜犹豫错过战果\n   - 袁意拖着活丧尸到张小强身后慢慢拆骨头（把丧尸当发泄玩具）；姐姐惊讶\"这些女人也能杀怪物\"\n   - 高潮：对岸尸群炸窝，铁皮小屋被掀飞——D2（两米多高进化丧尸）登场，单手举起D型丧尸甩出去撞碎四层小楼，颅骨碎片四散\n2. 角色动向：\n   - 张小强：算计失败（桥卡尸）→新危机（D2）；\"战略游戏没赢过\"=底层小人物自嘲，主角不神化\n   - 杨可儿/袁意：战力展示对比（莽撞清场vs冷静收割），袁意\"慢慢拆\"的虐待倾向加深\n   - 苏茜：再次落空→\"被淘汰\"恐惧加剧；姐姐：对女性战斗力的认知刷新\n   - D2：力量型BOSS登场的视觉震撼（扔D型像扔玩具娃娃）\n3. 关键信息与扩写技法：\n   - 技法：小反转（千尸被桥卡死）→大反转（D2现身），节奏先松后紧；用望远镜视角写D2战力=主角视觉边界内的全景\n   - 设定：D2=更高阶进化丧尸（碾压D型），为战力升级定下新标尺；\"桥\"的地形=未来战场的变数\n4. 逐章写法公式：计划受挫→放行冲杀（女性战力秀）→慢杀细节（暗黑）→尸群异变→D2登场收尾";function md(s){const ls=String(s).split(/\r?\n/);let o=[],p=[],ul=false;const fl=()=>{if(p.length){o.push("<p>"+p.join(" ")+"</p>");p=[]}};for(const l of ls){const t=l.trim();if(!t){fl();continue}if(/^#{1,3}\s/.test(t)){fl();const n=t.match(/^#+/)[0].length;o.push("<h"+(n+1)+">"+esc(t.replace(/^#+\s*/,""))+"</h"+(n+1)+">")}else if(/^[-*]\s/.test(t)){fl();o.push("<ul><li>"+esc(t.replace(/^[-*]\s*/,""))+"</li></ul>")}else if(/^>\s?/.test(t)){fl();o.push("<blockquote>"+esc(t.replace(/^>\s?/,""))+"</blockquote>")}else if(/^---+$/.test(t)){fl();o.push("<hr>")}else{p.push(esc(t))}}fl();return o.join("")}function esc(s){return s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/\*\*([^*]+)\*\*/g,"<b>$1</b>")}document.getElementById("doc").innerHTML=md(SRC);</script></body></html>
